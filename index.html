<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kartičky RK">
<meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Kartičky – Realitný maklér</title>
<style>
:root{
  --bg:#f5f1ea; --surface:#fffdf9; --surface-2:#efe9df; --ink:#1f1d1a; --muted:#6f685e; --line:#e2dacd;
  --accent:#1f5f5b; --accent-ink:#ffffff; --accent-soft:#dcebe8;
  --ok:#2e7d4f; --ok-soft:#dff1e5; --bad:#b4442f; --bad-soft:#f8e1db; --pick:#3a4fa0; --pick-soft:#e3e7f7;
  --shadow:0 1px 2px rgba(40,30,15,.06),0 8px 24px rgba(40,30,15,.08);
  --r:18px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16181b; --surface:#1f2226; --surface-2:#282c31; --ink:#ece8e1; --muted:#9a958c; --line:#33373d;
    --accent:#5fb3aa; --accent-ink:#0e1513; --accent-soft:#1f3633;
    --ok:#62c48a; --ok-soft:#1c3427; --bad:#e8826c; --bad-soft:#3d2420; --pick:#93a5ec; --pick-soft:#262c45;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{
  font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

/* ---------- HOME ---------- */
#home{
  min-height:100%;
  padding:calc(var(--sat) + 28px) calc(var(--sar) + 20px) calc(var(--sab) + 32px) calc(var(--sal) + 20px);
  max-width:760px;margin:0 auto;
}
.brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 6px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 24px;font-size:15px}
.tests{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.tests{grid-template-columns:1fr 1fr}}
.test{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.test-head{width:100%;text-align:left;padding:16px 16px 14px;display:block}
.test-name{font-weight:650;font-size:18px;line-height:1.25;margin-bottom:4px}
.test-meta{font-size:14px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.test-meta b{color:var(--ink);font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex;margin-top:12px}
.bar i{display:block;height:100%}
.bar .k{background:var(--ok)} .bar .u{background:var(--bad)}
.setup{padding:0 16px 16px;display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;background:var(--surface-2);font-size:14.5px;font-weight:550;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;min-height:40px}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle[aria-pressed="true"] .sw{background:var(--accent)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(18px)}
.btn{min-height:48px;padding:0 20px;border-radius:14px;font-weight:650;font-size:16px}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:var(--surface-2)}
.link{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;min-height:40px;padding:0 4px}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}

/* ---------- STUDY ---------- */
#study{
  height:100vh;height:100dvh;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
  grid-template-areas:"top" "main" "ctrl";
}
.top{
  grid-area:top;padding:calc(var(--sat) + 8px) calc(var(--sar) + 12px) 8px calc(var(--sal) + 12px);
  display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);
}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.top-mid{flex:1;min-width:0}
.top-title{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{height:4px;border-radius:4px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

.main{grid-area:main;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:16px calc(var(--sar) + 16px) 20px calc(var(--sal) + 16px)}
.card{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  padding:18px 18px 16px}
.card.enter{animation:in .22s ease-out}
.card.out-l{animation:outl .18s ease-in forwards}.card.out-r{animation:outr .18s ease-in forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes outl{to{opacity:0;transform:translateX(-24px)}}
@keyframes outr{to{opacity:0;transform:translateX(24px)}}
@media (prefers-reduced-motion:reduce){.card.enter,.card.out-l,.card.out-r{animation:none}}
.card-meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.qnum{font-weight:700;color:var(--accent);letter-spacing:.02em}
.status{font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--surface-2)}
.status.k{background:var(--ok-soft);color:var(--ok)} .status.u{background:var(--bad-soft);color:var(--bad)}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.q{font-size:20px;line-height:1.38;font-weight:620;margin:0 0 16px;letter-spacing:-.005em}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 12px;border-radius:14px;
  border:1.5px solid var(--line);background:var(--surface);transition:background .15s,border-color .15s}
.opt .L{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--surface-2)}
.opt .T{padding-top:3px;font-size:16.5px;line-height:1.4}
.opt .mark{flex:none;margin-left:auto;padding-top:4px;font-weight:700;font-size:15px}
.opt.sel{border-color:var(--pick);background:var(--pick-soft)} .opt.sel .L{background:var(--pick);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .L{background:var(--ok);color:#fff} .opt.ok .mark{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)} .opt.bad .L{background:var(--bad);color:#fff} .opt.bad .mark{color:var(--bad)}
.opt.dim{opacity:.55}
.revealed .opt{cursor:default}
.answer{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2);font-size:15px;line-height:1.4}
.answer b{font-size:16px}
.answer .v-ok{color:var(--ok);font-weight:700}.answer .v-bad{color:var(--bad);font-weight:700}
.hint{max-width:760px;margin:12px auto 0;text-align:center;font-size:13px;color:var(--muted)}

.ctrl{grid-area:ctrl;padding:10px calc(var(--sar) + 12px) calc(var(--sab) + 10px) calc(var(--sal) + 12px);
  background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;align-items:stretch;justify-content:center}
.ctrl-inner{display:flex;gap:10px;width:100%;max-width:760px}
.ctrl .grow{flex:1}
.nav{width:52px;min-height:52px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.nav svg{width:22px;height:22px}
.big{min-height:52px;border-radius:14px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px}
.big.primary{background:var(--accent);color:var(--accent-ink)}
.big.no{background:var(--bad-soft);color:var(--bad)}
.big.yes{background:var(--ok-soft);color:var(--ok)}
.big.sugg{box-shadow:inset 0 0 0 2px currentColor}
.kbd{font-size:12px;opacity:.6;font-weight:600}
@media (hover:none){.kbd{display:none}}

/* ---------- END ---------- */
.end{max-width:520px;margin:6vh auto 0;text-align:center}
.end h2{font-size:26px;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 8px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.k b{color:var(--ok)} .stat.u b{color:var(--bad)}
.end .btns{display:grid;gap:10px}

/* ---------- LANDSCAPE PHONE ---------- */
@media (orientation:landscape) and (max-height:560px){
  #study{grid-template-columns:minmax(0,1fr) 210px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "main ctrl"}
  .top{padding-top:calc(var(--sat) + 4px);padding-bottom:4px}
  .icon-btn{width:40px;height:40px}
  .main{padding:12px 12px calc(var(--sab) + 12px) calc(var(--sal) + 12px)}
  .card{padding:14px 16px}
  .q{font-size:18px;margin-bottom:12px}
  .opt{padding:9px 10px}.opt .T{font-size:15.5px}
  .ctrl{border-top:0;border-left:1px solid var(--line);flex-direction:column;justify-content:flex-end;
    padding:10px calc(var(--sar) + 12px) calc(var(--sab) + 12px) 12px}
  .ctrl-inner{flex-direction:column;height:100%;justify-content:flex-end}
  .ctrl-inner .navrow{display:flex;gap:10px;margin-bottom:auto}
  .ctrl .grow{flex:none}
  .ctrl-inner .navrow .nav{flex:1;width:auto}
  .big{min-height:50px}
  .hint{display:none}
}
.navrow{display:contents}
</style>
</head>
<body>

<main id="home" aria-labelledby="h1"></main>

<section id="study" class="hidden" aria-live="polite">
  <header class="top">
    <button class="icon-btn" id="back" aria-label="Späť na zoznam testov">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="top-mid">
      <div class="top-title" id="tTitle"></div>
      <div class="top-sub" id="tSub"></div>
      <div class="pbar"><i id="tBar"></i></div>
    </div>
    <button class="icon-btn" id="shuffleNow" aria-label="Zamiešať zostávajúce kartičky" title="Zamiešať">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
    </button>
  </header>
  <div class="main" id="mainArea"></div>
  <footer class="ctrl" id="ctrl"></footer>
</section>

<script>
const DATA = [{"id":"digitalne","name":"Digitálne nástroje a moderné technológie","questions":[{"n":1,"q":"Ktoré tvrdenia správne vystihujú úlohu digitálnych technológií v práci makléra?","o":["Môžu znižovať množstvo opakujúcej sa administratívy.","Ich prínos spočíva najmä v používaní čo najväčšieho počtu aplikácií.","Môžu zlepšovať dostupnosť informácií a prehľadnosť práce."],"a":"AC"},{"n":2,"q":"Maklér má kontakty uložené v telefóne, e-mailoch a poznámkach. Čo môže priniesť používanie CRM?","o":["Sústreďuje informácie o klientovi, komunikácii, úlohách a zákazkách na jednom mieste.","Slúži predovšetkým ako elektronický telefónny zoznam.","Môže uľahčiť prácu s klientom aj ďalšiemu oprávnenému členovi tímu."],"a":"AC"},{"n":3,"q":"Ktoré tvrdenia správne rozlišujú kontakt, lead a zákazku?","o":["Lead predstavuje konkrétnu dokončenú realitnú zákazku.","Kontakt predstavuje osobu alebo organizáciu uloženú v databáze.","Zákazka predstavuje konkrétny obchodný prípad, na ktorom kancelária pracuje."],"a":"BC"},{"n":4,"q":"Realitná kancelária pri každej novej zákazke vykonáva rovnakú sériu administratívnych krokov. Ktoré postupy sú vhodné?","o":["Opakujúce sa úlohy možno vytvárať automaticky podľa fázy zákazky.","Jasne definovaný pracovný postup môže znižovať riziko zabudnutia na niektorý krok.","Individuálne odborné rozhodovanie je vhodné vždy úplne nahradiť automatizáciou."],"a":"AB"},{"n":5,"q":"Maklér pracuje s údajom o priemernej cene nehnuteľností v určitej lokalite. Ktoré tvrdenie je správne?","o":["Priemerná cena automaticky určuje cenu každej nehnuteľnosti v lokalite.","Takýto údaj môže pomôcť pri orientácii, ale konkrétna nehnuteľnosť môže mať vlastnosti, ktoré priemer nezohľadňuje.","Ak údaj zobrazuje profesionálny softvér, nie je potrebné zisťovať jeho pôvod."],"a":"B"},{"n":6,"q":"Ktoré tvrdenia o práci s dokumentmi v cloude sú správne?","o":["Cloud automaticky zabezpečí poriadok v dokumentoch aj bez pravidiel kancelárie.","Prístup k dokumentom možno nastavovať podľa pracovných potrieb jednotlivých používateľov.","Spoločná práca s jednou aktuálnou verziou dokumentu môže znižovať problém viacerých rozdielnych kópií."],"a":"BC"},{"n":7,"q":"Ktoré tvrdenia o elektronickom podpisovaní sú správne?","o":["Každý spôsob elektronického podpisovania je vhodný pre každý typ dokumentu.","Elektronický proces môže prepojiť prípravu, podpisovanie a uloženie dokumentu ku konkrétnej zákazke.","Pri výbere spôsobu podpisovania treba prihliadať na požiadavky konkrétneho právneho úkonu."],"a":"BC"},{"n":8,"q":"Maklér použije pri prezentácii prázdneho bytu virtuálny staging. Ktoré tvrdenia sú správne?","o":["Môže ukázať možné zariadenie priestoru bez jeho fyzického zariadenia.","Výsledný obraz treba považovať za fotografiu aktuálneho fyzického stavu.","Pri prezentácii treba rozlišovať medzi skutočným stavom a digitálnou vizualizáciou."],"a":"AC"},{"n":9,"q":"Ktoré tvrdenia správne vystihujú rozdiel medzi fotografiou, pôdorysom a 360° prehliadkou?","o":["Pôdorys pomáha pochopiť dispozíciu a vzájomnú polohu miestností.","360° prehliadka môže umožniť záujemcovi preskúmať priestor na diaľku.","Automaticky vytvorený marketingový pôdorys má vždy rovnakú presnosť ako odborné zameranie."],"a":"AB"},{"n":10,"q":"Maklér požiada AI LLM, aby z podkladov pripravil text ponuky. Ktoré tvrdenia sú správne?","o":["Ak je výsledok jazykovo presvedčivý, možno ho považovať za automaticky fakticky správny.","AI LLM môže pri príprave a úprave textu výrazne šetriť čas.","Maklér by mal pred použitím skontrolovať, či AI nepridala údaj, ktorý nebol v podkladoch."],"a":"BC"},{"n":11,"q":"Maklér používa AI LLM pri práci s dôležitými informáciami. Ktoré postupy sú správne?","o":["Poskytnúť AI dôveryhodné podklady a výsledok následne skontrolovať.","Považovať výstup AI za overený fakt, ak je formulovaný profesionálne a presvedčivo.","Mieru ľudskej kontroly prispôsobiť závažnosti možnej chyby."],"a":"AC"},{"n":12,"q":"Realitná kancelária rieši, akú úlohu má mať jej vlastný web. Ktoré tvrdenia sú správne?","o":["Web môže slúžiť na prezentáciu kancelárie, služieb, nehnuteľností aj odborného obsahu.","Web môže získavať nové kontakty a po prepojení s CRM ich zaradiť do ďalšieho pracovného procesu.","Vlastný web je vo väčšej miere pod kontrolou kancelárie než profil na sociálnej sieti alebo inzertnom portáli."],"a":"ABC"},{"n":13,"q":"Ktoré tvrdenia správne vystihujú rozdiel medzi inzertnými portálmi, sociálnymi sieťami a vlastným webom?","o":["Inzertné portály využívajú najmä ľudia, ktorí aktívne vyhľadávajú nehnuteľnosti.","Sociálne siete môžu slúžiť aj na budovanie osobnej značky a dlhodobý kontakt s publikom.","Rozvoj AI vyhľadávania znamená, že kvalitný vlastný web prestáva byť pre kanceláriu dôležitý."],"a":"AB"},{"n":14,"q":"Ktoré postupy zodpovedajú bezpečnej práci s digitálnymi službami a AI LLM?","o":["Používať unikátne heslá a tam, kde je to možné, viacfaktorové overovanie.","Poskytovať AI iba údaje potrebné na konkrétnu úlohu.","Považovať profesionálne napísanú správu za dôveryhodnú, pretože phishingové správy bývajú jazykovo nekvalitné."],"a":"AB"},{"n":15,"q":"Realitná kancelária prepojí webový formulár s CRM. Po prijatí nového dopytu systém automaticky vytvorí kontakt, priradí makléra a vytvorí úlohu. Ktoré tvrdenia sú správne?","o":["Ide o príklad integrácie a automatizácie pracovného postupu.","Takýto postup môže znížiť množstvo manuálneho prepisovania údajov.","Ak je vstupný údaj chybný, automatizovaný proces môže chybu preniesť aj do ďalších častí systému."],"a":"ABC"}]},{"id":"financovanie","name":"Financovanie realitných transakcií","questions":[{"n":1,"q":"Je možné financovať hypotekárnym úverom od slovenskej banky nejakú nehnuteľnosť v zahraničí, t.j. mimo SR ?","o":["Iba ak použijeme 50% úveru a 50% vlastných prostriedkov","Áno, ak je jeden z manželov cudzinec","Nie, hypotekárny úver možno využiť iba na financovanie tuzemskej nehnuteľnosti"],"a":"C"},{"n":2,"q":"Ukazovateľ DTI (Debt to Income) predstavuje pomer:","o":["výšky hypotéky a úspor žiadateľa","celkovej zadlženosti a ročného hrubého príjmu žiadateľa","celkovej zadlženosti a ročného čistého príjmu žiadateľa"],"a":"C"},{"n":3,"q":"Zákonná lehota na vydanie rozhodnutia o schválení alebo zamietnutí žiadosti o úver zo Štátneho fondu rozvoja bývania (ŠFRB) je:","o":["45 pracovných dní odo dňa doručenia úplnej žiadosti alebo do 30. 11. v roku, v ktorom bola žiadosť podaná","45 pracovných dní odo dňa doručenia úplnej žiadosti alebo do 31. 12. v roku, v ktorom bola žiadosť podaná","do 1. 1. v roku, ktorý nasleduje po roku, v ktorom bola žiadosť podaná"],"a":"B"},{"n":4,"q":"Ktoré z uvedených úverov so splatnosťou na 10 rokov majú konštantnú výšku úrokovej sadzby počas celej doby splácania:","o":["hypotekárny úver s 10 ročnou fixáciou úrokovej sadzby","úver zo ŠFRB","stavebný úver zo stavebnej sporiteľne"],"a":"ABC"},{"n":5,"q":"Požaduje banka, ako zabezpečenie úveru, založenie celého rodinného domu, alebo stačí, ak sa založí len časť rodinného domu?","o":["banke stačí založenie len časti rodinného domu","banka požaduje založenie celého rodinného domu","banka neakceptuje ako záložné právo dom vo vlastníctve viacerých majiteľov"],"a":"B"},{"n":6,"q":"Pokiaľ je účelom hypotekárneho úveru kúpa nehnuteľnosti a v prospech banky sa zakladá kupovaná nehnuteľnosť, pričom ako záložcovia sú uvedení v záložnej zmluve predávajúci, ktorá zmluva sa predkladá prvá na kataster?","o":["záložná zmluva","kúpna zmluva","je to jedno, nezáleží na poradí podania týchto zmlúv na kataster"],"a":"A"},{"n":7,"q":"Ktoré z uvedených vecných bremien je neakceptovateľné pre banku, ak chce klient založiť takúto nehnuteľnosť:","o":["záložné právo v prospech fyzickej osoby zapísané v prvom rade","doživotné právo užívania nehnuteľnosti","právo prechodu cez parcelu susediacu s rodinným domom"],"a":"B"},{"n":8,"q":"Pokiaľ je jediný prístup k zakladanej nehnuteľnosti cez susedov pozemok, banka vyžaduje:","o":["čestné prehlásenie suseda podpísané u notára, že sa môže prechádzať cez jeho pozemok","zriadenie predkupného práva na susedov pozemok","zriadenie vecného bremena práva prechodu"],"a":"C"},{"n":9,"q":"U dlžníkov do 40 rokov vrátane je pre úvery na bývanie hodnota DTI:","o":["6-násobok ročného čistého príjmu","7-násobok ročného čistého príjmu","8-násobok ročného čistého príjmu"],"a":"C"},{"n":10,"q":"Úroková sadzba na stavebnom úvere zo stavebnej sporiteľne:","o":["je závislá od typu zabezpečenia úveru (napr. ručiteľ, nehnuteľnosť, vinkulácia vkladu a pod.)","je závislá od doby splácania stavebného úveru","je konštantná počas celej doby splácania stavebného úveru"],"a":"C"},{"n":11,"q":"Žiadateľ o úver zo ŠFRB nesmie:","o":["byť mladší ako 18 rokov","byť starší ako 30 rokov","byť odchovancom detského domova"],"a":"A"},{"n":12,"q":"Cieľová suma pri stavebnom sporení sa skladá:","o":["z vkladov, štátnej prémie a pripísaných úrokov","z nasporenej sumy a stavebného úveru","z vkladov a štátnej prémie"],"a":"B"},{"n":13,"q":"K čerpaniu hypotekárneho úveru na kúpu už postavenej a skolaudovanej nehnuteľnosti banka okrem iných podkladov vyžaduje aj doklad o preukázaní účelu a to:","o":["zmluvu o budúcej kúpnej zmluve s overenými podpismi všetkých účastníkov zmluvy","podpísanú Kúpnu zmluvu s úradne overenými podpismi kupujúcich","podpísanú Kúpnu zmluvu s úradne overenými podpismi predávajúcich"],"a":"C"},{"n":14,"q":"Maximálna podlahová plocha bytu v bytovom dome (ak nejde o bývanie pre ZŤP osobu), aby sa mohol žiadať úver na jeho výstavbu zo ŠFRB, je:","o":["160 m2","80 m2","100 m2"],"a":"B"},{"n":15,"q":"Pri výpočte bonity klienta musí banka počítať aj s finančným vankúšom vo výške:","o":["40%","10%","25%"],"a":"A"},{"n":16,"q":"Kedy môže banka zmeniť dlžníkovi fixovanú úrokovú sadzbu na hypotekárnom úvere?","o":["kedykoľvek v závislosti na aktuálnom vývoji úrokových sadzieb","len po skončení pôvodnej doby fixácie úrokovej sadzby","kedykoľvek ak dôjde k poklese hodnoty založenej nehnuteľnosti na realitnom trhu"],"a":"B"},{"n":17,"q":"Hodnotiace číslo na zmluve o stavebnom sporení je dôležité pre:","o":["vyplatenie štátnej prémie do 2 rokov od začiatku sporenia","pre kontrolu nároku na zrušenie zmluvy po 6 rokoch sporenia","pre pridelenie nároku na stavebný úver"],"a":"C"},{"n":18,"q":"Pokiaľ klient do 35 rokov kupuje rekreačnú chatu, ktorý z uvedených úverov môže využiť na jej kúpu:","o":["medziúver a následný stavebný úver zo stavebnej sporiteľne","úver zo Štátneho fondu rozvoja bývania","hypotekárny úver z hypotekárnej banky so štátnym príspevkom pre mladých"],"a":""},{"n":19,"q":"Informácie v úverovom registri sa uchovávajú aj po splatení úveru a to minimálne po dobu:","o":["10 rokov po splatení úveru","3 roky po splatení úveru","5 rokov po splatení úveru"],"a":"C"},{"n":20,"q":"Banky pri posudzovaní schopnosti splácať hypotekárny úver musia zároveň aplikovať stres test vo výške:","o":["5%tnej prirážky k aktuálnej úrokovej sadzbe","3%tnej prirážky k aktuálnej úrokovej sadzbe","2%tnej prirážky k aktuálnej úrokovej sadzbe"],"a":"C"},{"n":21,"q":"Opatrenie LTV predstavuje:","o":["pomer výšky čistého príjmu a hodnoty založenej nehnuteľnosti","pomer výšky čistého príjmu a výšky hypotéky","pomer výšky hypotéky a hodnoty založenej nehnuteľnosti"],"a":"C"},{"n":22,"q":"Čo znamená fixácia úrokovej sadzby?","o":["kredit za poskytnutie peňažných prostriedkov","pokles hodnoty peňazí v dôsledku rastu cien","zamrazenie úroku na určitú dobu"],"a":"C"},{"n":23,"q":"Čo je istina?","o":["suma, ktorú za celé obdobie splácania klient zaplatí banke","suma, ktorú si klient požičia od banky a ktorú postupne klient spláca v splátkach spolu s pravidelným úrokom za požičanie","použitie finančných zdrojov na dosiahnutie zisku"],"a":"B"},{"n":24,"q":"Musí zaplatiť dlžník stavebnej sporiteľne poplatok za predčasné splatenie stavebného úveru?","o":["Áno, pokiaľ splatí stavebný úver do 5 rokov od poskytnutia.","Musí zaplatiť ak nebol stavebný úver zabezpečený zriadením záložného práva na nehnuteľnosť.","Nie, predčasné splatenie stavebného úveru zo stavebnej sporiteľne nie je spoplatnené."],"a":"C"},{"n":25,"q":"Má nárok na úver zo Štátneho fondu rozvoja bývania aj žiadateľ bez akéhokoľvek príjmu?","o":["Nie, žiadateľ vždy musí preukázať, že priemerný mesačný čistý príjem jeho domácnosti za predchádzajúci kalendárny štvrťrok zodpovedá minimálne 1,3 násobku životného minima v zmysle aktuálnych predpisov o životnom minime.","Áno, hlave musí splniť požiadavku, že bol odchovancom detského domova.","Stačí, ak si žiadateľ dokáže každý mesiac akokoľvek zaobstarať dostatočný objem finančných prostriedkov, ktorý postačuje na úhradu mesačnej splátky úveru."],"a":"A"},{"n":26,"q":"Čo je hypotekárny úver?","o":["Úver zabezpečený záložným právom k nehnuteľnosti","Krátkodobý spotrebný úver","Úver poskytovaný bankou na bývanie"],"a":"AC"},{"n":27,"q":"Aký dokument vystavuje banka, ak klient ešte nemá nehnuteľnosť?","o":["Úverový prísľub (hypotekárny certifikát)","Poistnú zmluvu","Kúpnu zmluvu"],"a":"A"},{"n":28,"q":"Čo je bonita klienta?","o":["Schopnosť klienta splácať úver","Suma úveru požadovaná klientom","Kritérium pre zaradenie klienta do rizikovej skupiny"],"a":"AC"},{"n":29,"q":"Ktorý register uchováva údaje o fyzických osobách?","o":["SRBI","NRKI","SBBI"],"a":"AB"},{"n":30,"q":"Ktorý ukazovateľ sleduje schopnosť klienta splácať dlh?","o":["LTV","DSTI","RPMN"],"a":"B"},{"n":31,"q":"Ktoré faktory vplývajú na výšku úroku?","o":["Bonita klienta a typ úveru","Riziková skupina klienta","Dostupnosť údajov katastra"],"a":"AB"},{"n":32,"q":"Ktorý vekový limit platí pre DTI v hodnote 8?","o":["Do 40 rokov vrátane","Od 50 rokov vyššie","Len pre dôchodcov"],"a":"A"},{"n":33,"q":"Ktoré hodnoty znižujú limit DTI?","o":["Vek","Počet súrodencov","Lokalita nehnuteľnosti"],"a":"A"},{"n":34,"q":"Čo predstavuje ukazovateľ LTV?","o":["Pomer výšky úveru k hodnote zabezpečenia","Maximálnu zadlženosť klienta","Priemerný úrok z hypotéky"],"a":"AB"},{"n":35,"q":"Ktorá nehnuteľnosť je najčastejšie akceptovaná ako zabezpečenie úveru?","o":["Byt","Rodinný dom","Výrobný areál"],"a":"AB"},{"n":36,"q":"Ako banka určuje hodnotu nehnuteľnosti?","o":["Nižšou z cien: znaleckou alebo kúpnou","Trhovou cenou podľa stanoviska realitnej kancelárie","Interným ocenením banky"],"a":"AC"},{"n":37,"q":"Aké podmienky platia pre znalecký posudok pri hypotékach?","o":["Musí byť aktuálny (nie starší ako 3 roky)","Banka ho môže prehodnotiť","Nemusí sa predkladať"],"a":"AB"},{"n":38,"q":"Čo je vinkulácia poistky?","o":["Poistné plnenie je určené v prospech banky","Poistné plnenie je určené v prospech klienta","Povinná podmienka pri čerpaní úveru"],"a":"AC"},{"n":39,"q":"Čo znamená „plomba“ v katastri?","o":["Označenie podaného návrhu na zápis","Označenie informácie o prebiehajúcom súdnom konaní na LV","Označenie informácie o prebiehajúcom exekučnom konaní na LV"],"a":"A"},{"n":40,"q":"Ktorý spôsob splácania úveru je najbežnejší?","o":["Anuitný spôsob","Progresívny spôsob","Splácanie len úrokov"],"a":"A"},{"n":41,"q":"Aký efekt má mimoriadna splátka na úver?","o":["Zníženie výšky splátky","Zvýšenie splátok","Možnosť skrátenia doby splácania"],"a":"AC"},{"n":42,"q":"Kedy je refinancovanie hypotéky výhodné?","o":["Ak pôvodná banka nezníži úrokovú sadzbu","Ak nová banka ponúka vyššiu úrokovú sadzbu","Ak nová banka ponúka nižšiu úrokovú sadzbu"],"a":"AC"},{"n":43,"q":"Kedy je stavebné sporenie účelové?","o":["Ak sa využíva na bývanie alebo rekonštrukciu","Pri kúpe auta","Pri výstavbe rodinného domu"],"a":"AC"},{"n":44,"q":"Kto poskytuje stavebné sporenie?","o":["Prvá stavebná sporiteľňa, Wüstenrot, ČSOB, VÚB","Prvá stavebná sporiteľňa, Wüstenrot, VÚB","Prvá stavebná sporiteľňa"],"a":"C"},{"n":45,"q":"Aké sú podmienky nároku na získanie štátnej prémie?","o":["Príjem nižší ako 1,3-násobok priemernej mzdy u plnoletého sporiteľa","Deti a mladí do 18 rokov majú nárok na štátnu prémiu, bez ohľadu na výšku príjmu rodičov alebo zákonných zástupcov","Na získanie maximálnej prémie musí sporiteľ vložiť na účet minimálny vklad podľa oznámenia Ministerstva financií SR pre daný rok"],"a":"ABC"},{"n":46,"q":"Kedy nárok na štátnu prémiu zaniká?","o":["Pri zrušení zmluvy do 2 rokov bez relevantného dôvodu","Ak klient presiahne vek 40 rokov","Pri použití prostriedkov na iný ako stavebný účel"],"a":"AC"},{"n":47,"q":"Aké sú fázy stavebného sporenia?","o":["Fáza sporenia a fáza úverovania","Sporenie, medziúver, stavebný úver","Len fáza sporenia"],"a":"AB"},{"n":48,"q":"Čo je hodnotiace číslo?","o":["Indikátor výšky a pravidelnosti vkladov","Kritérium pre získanie stavebného úveru","Indikátor výšky štátnej prémie"],"a":"AB"},{"n":49,"q":"Kto má nárok na stavebný úver:","o":["Každý, kto splní podmienky sporenia a splácania","Len študent","Len rodiny s deťmi"],"a":"A"},{"n":50,"q":"Čo je medziúver?","o":["Úver na preklenutie do pridelenia stavebného úveru","Komerčný produkt stavebnej sporiteľne","Bežný bankový úver"],"a":"AB"},{"n":51,"q":"Je hypotekárny úver účelovým úverom ?","o":["Áno, hypotekárny úver je účelovým úverom na financovanie nehnuteľností a veci s tým spojených","Iba, ak je založený nehnuteľnosťou. Ak nie je založený, tak je hypotekárny úver bezúčelový","Nie, o účele použitia hypotekárneho úveru rozhoduje sám dlžník"],"a":"A"},{"n":52,"q":"Kedy môže ŠFRB pozastaviť prijímanie žiadostí o podporu?","o":["ŠFRB pozastavuje prijímanie žiadostí najčastejšie vtedy, keď finančné sa prostriedky určené na podporu v danom roku vyčerpajú","Odchovancom detských domovom a ŤZP osobám sa nikdy nepozastavuje prijímanie žiadostí","Žiadosti sa nepozastavujú tým žiadateľom, ktorí v žiadosti uvedú, že akceptujú vyššiu úrokovú sadzbu nad rámec zákonom stanovenej podpory ŠFRB"],"a":"A"},{"n":53,"q":"Je možné financovať zateplenie bytovky a stavebné práce z hypotekárneho úveru?","o":["Áno, ale iba keď aspoň tretina vlastníkov bytov v bytovom dome zriadi záložné právo na svoje byty, a znalecký posudok musí kryť hodnotu vo výške bankového úveru","Hypotekárny úver na zateplenie bytovky si musia zobrať všetci vlastníci bytov a všetci musia založiť svoje byty v prospech banky","Nie, financovanie údržby bytových domov sa rieši iným účelovým bankovým úverom pre spoločenstvá vlastníkov bytov alebo vlastníkov zastúpených správcom, pričom ako zabezpečenie sa zvykne zriaďovať záložné právo na pohľadávky z účtu bytového domu do ktorého pravidelne prispievajú vlastníci bytov"],"a":"C"},{"n":54,"q":"Môže sa po rozvode manželov vysporiadať bezpodielové spoluvlastníctvo druhého manžela hypotekárnym úverom ?","o":["Nie, manželia musia po rozvode všetok majetok predať a výnos z predaja si musia rozdeliť","Áno, jedným z účelov použitia hypotekárneho úveru je aj vysporiadanie bezpodielového spoluvlastníctva manželov","Rozvedení manželia si spoločne zoberú úver na vysporiadanie bezpodielového spoluvlastníctva, ale splácať ho bude iba jeden z manželov"],"a":"B"},{"n":55,"q":"Existuje ešte nejaký záväzok úverového dlžníka v prípade, že veriteľ nezariadil výmaz záložného práva a na liste vlastníctva je stále ťarcha zapísaná v katastri nehnuteľností?","o":["Keď je na liste vlastníctva ťarcha, určite existuje aj záväzok úverového dlžníka","Kataster nehnuteľností vie o každom dlžníkovi a vie kedy dlžník dlh splatí, preto sám ťarchu na nehnuteľnosti z listu vlastníctva vymaže","Dlh úverového dlžníka zaniká jeho splatením. Ak však veriteľ kvitanciu s návrhom na výmaz záložného práva na kataster nezašle, tak je v záujme úverového dlžníka a záložcu žiadať doklad o splatení záväzku a podať návrh katastru nehnuteľností na výmaz ťarchy na liste vlastníctva"],"a":"C"},{"n":56,"q":"Ak je účelom čerpania úver vysporiadanie bezpodielové spoluvlastníctvo manželov (BSM) hypotekárnym úverom, je nutné zriaďovať záložné právo na nehnuteľnosť ?","o":["Nezriaďuje sa záložné právo k nehnuteľnosti, aby sa viac manželia netraumatizovali","Záložné právo pri vypriadaní BSM hypotekárnym úverom sa zriaďuje na nehnuteľnosť iba toho manžela/ky, ktorý/á zo spoločného majetku dostane po rozvode viac","Záložné právo sa zriaďuje vždy k nehnuteľnosti na hypotekárne úvery, aj keď je aj účelom vysporiadanie bezpodielového spoluvlastníctva manželov"],"a":"C"},{"n":57,"q":"Dá sa riešiť vysporiadanie dedičského podielu čerpaním hypotekárneho úveru ?","o":["Hypotekárny úver nemôže čerpať dedič, ktorý nie je dieťaťom nepochádzajúcim z manželského vzťahu poručiteľa","Áno, jedným z účelov čerpania hypotekárneho úveru v zmysle zákona je aj na vysporiadanie dedičských podielov v dedičskom konaní","Vysporiadanie dedičských podielov v dedičskom konaní hypotekárnym úverom môže iba ten dedič, ktorý z dedičstva po poručiteľovi dostane z majetku najmenej"],"a":"B"},{"n":58,"q":"Musí sporiteľ stavebnej sporiteľne použiť štátnu prémiu iba na účely spojené s financovaním bývania?","o":["Nie, pokiaľ nežiada o stavebný úver, môže peniaze použiť na čokoľvek bez dokladovania účelu iba vtedy, ak nechá zmluvu plynúť do konca doby sporenia v zmysle zmluvy o stavebnom sporení, inak o pripísanú prémiu príde","Štátnu prémiu si môže sporiteľ vybrať z účtu kedykoľvek po jej pripísaní na účte stavebného sporenia","Sporiteľ stavebnej sporiteľne môže nasporené prostriedky spolu so štátnou prémiou použiť pokiaľ kupuje rodinný automobil"],"a":"A"},{"n":59,"q":"Ak úverový dlžník nespláca úver, môže veriteľ požadovať splnenie dlhu od spoludlžníka?","o":["Nie, povinnosť platiť má iba hlavný dlžník, lebo z jeho bežného účtu vedeného u veriteľa je nastavené inkaso splátok úveru,","Áno, spoludlžník je rovnako ako hlavný dlžník zodpovedný spoločne a nerozdielne za úverový záväzok vyplývajúci zo zmluvy o úvere","Plnenie od spoludlžníka môže veriteľ požadovať jedine v prípade, že hlavný dlžník zomrel a ešte neprebehlo dedičské konanie"],"a":"B"},{"n":60,"q":"Je možné financovať úverom ŠFRB mimo Slovenskej republiky?","o":["Ak žiadateľ o podporu ŠFRB splní podmienky veku a príjmu, môže financovať aj nehnuteľnosť v mimo Slovenskej republiky","Podpora zo ŠFRB slúži výhradne na rozširovanie a zveľaďovanie bytového fondu na území Slovenskej republiky, pričom úver musí byť zabezpečený založením nehnuteľnosti, ktorá sa takisto musí nachádzať na území SR","Financova nehnuteľností cez ŠFRB mimo územia SR je možné iba na prihraničné nehnuteľnosti, a iba pre osoby žiadateľov, ktoré majú zamestnanie na území SR a vedia denne dochádzať"],"a":"B"},{"n":61,"q":"Aký je súčet veku žiadateľa a doby splácania úveru pri úvere zo ŠFRB?","o":["O podporu zo ŠFRB je možné požiadať v akomkoľvek veku ale vždy so splatnosť 40 rokov","Odchovanec detského domova nemá vekový limit ani limit lehoty splatnosti úveru","Pre všetkých žiadateľov bez výnimky platí absolútny strop, podľa ktorého vek žiadateľa + lehota splatnosti úveru nesmú presiahnuť 65 rokov"],"a":"C"},{"n":62,"q":"Dá sa požiadať o hypotekárny úver na kúpu viacerých pozemkov evidovaných ako orná pôda, ktoré sú v blízkosti intravilánu a pravdepodobne budú v budúcnosti preklasifikované na stavebné pozemky ?","o":["Banky zvyčajne odmietajú špekulatívny a investičný charakter financovania pozemkov formou hypotekárneho úveru","Financovanie pozemkov z hypotekárneho úveru je možné vždy, a to aj bez prístupovej cesty k pozemkom, lebo pohľadávka z úveru je z pravidla zabezpečená záložným právom k nehnuteľnosti","Nie, samotná orná pôda zaradená do poľnohospodárskeho pôdneho fondu, na ktorú nebola vydaná územnoplánovacia informácia obce nebýva je premetom financovania hypotekárnym úverom"],"a":"AC"},{"n":63,"q":"Je možné použiť na financovanie nákupu stavebného pozemku úver od stavebnej sporiteľne, hypotekárny úver alebo úver zo ŠFRB ?","o":["Áno, stavebný úver alebo medziúver zo stavebnej sporiteľne je možné použiť na kúpu stavebného pozemku, pretože nadobudnutie pozemku na účely budúcej výstavby patrí medzi štandardné bytové potreby financované stavebným sporením","Áno, hypotekárne banky vyžadujú, aby išlo o pozemok určený na výstavbu (napr. rodinného domu) s legálnym prístupom k pozemku a uplatňujú prísnejšie podmienky na výšku poskytnutého úveru k hodnote zabezpečenia (tzv. LTV) je percentuálnejšie okresaná","Nie, ŠFRB poskytuje financie na rozvoj bytového fondu, teda primárne na výstavbu, kúpu bytov či rodinných domov a na obnovu budov. Samostatná kúpa pozemku pre občanov nie je v schéme podpory zahrnutá"],"a":"ABC"},{"n":64,"q":"Zaniká právo na pripísanú štátnu prémiu stavebného sporenia smrťou sporiteľa?","o":["Štátna prémia patrí stavebnému sporiteľovi za obdobie, ktoré sa skončí dňom jeho úmrtia. Nasporené vklady, pripísané úroky a už získaná štátna prémia sa stávajú predmetom dedičského","Zostatok na účte stavebného sporenia musia dedičia vrátiť štátu","Pripísané sumy štátnej prémie sa smrťou sporiteľa odúčtujú z účtu stavebného sporenia a zaniknú"],"a":"A"},{"n":65,"q":"Čo sa deje so záväzkami z úveru, keď si dvaja dlžníci zoberú úver na kúpu nehnuteľnosti a počas splácania úveru jeden z týchto dlžníkov zomrie?","o":["Žijúci spoludlžník bude splácať iba polovičné splátky, lebo vlastní polovicu nehnuteľnosti","Žijúci spoludlžník je naďalej viazaný úverovou zmluvou a má povinnosť platiť celé splátky spoločne a nerozdielne v zmysle úverovej zmluvy, pričom záväzok aj majetok zosnulého prechádza do dedičského konania","Žijúci spoludlžník môže požiadať veriteľa o odpustenie polovice dlhu"],"a":"B"},{"n":66,"q":"Je možné financovanie cez úver zo stavebnej sporene bez založenia nehnuteľnosti?","o":["Áno, stavebná sporiteľňa ponúka aj úvery bez založenia nehnuteľnosti pri nižších sumách do výšky 50 000 €, často na rekonštrukcie a modernizáciu","Úver zo stavebnej sporiteľne je vždy zabezpečený záložným právom k slovenskej nehnuteľnosti","Financovanie bez založenia nehnuteľnosti môžu len osoby, ktoré nikdy predtým nečerpali úver"],"a":"A"},{"n":67,"q":"Má sporiteľ vo veku do 18 rokov povinnosť deklarovať príjem svojich rodičov na preukázanie nároku na štátnu prémiu?","o":["Áno, sporiteľ do 18 rokov deklaruje príjem rodičov. Aby získal štátnu prémiu tak dokladuje, že rodičia nemajú viac ako 1,3-násobok priemernej mesačnej mzdy v hospodárstve SR","Nie, stavebný sporiteľ vo veku do 18 rokov nemá povinnosť deklarovať svoj príjem ani príjem svojich zákonných zástupcov na preukázanie nároku na štátnu prémiu","Iba ak sa jedná o sporiteľov do 18 rokov, ktorí popri štúdiu vykonávali prácu na základe dohody o pracovnej činnosti"],"a":"B"},{"n":68,"q":"Čo sa stane sporiteľovi, ktorý na účet stavebného sporenia nevloží ani minimálny vklad?","o":["Sporiteľ sa sám rozhoduje, či a kedy vloží finančné prostriedky na účet stavebného sporenia","Zmluva o stavebnom sporení nevstúpi do aktívnej fázy a sporiteľňa môže zmluvu jednostranne zrušiť pre neplatnosť/neúčinnosť","Sporiteľ príde o nárok na štátnu prémiu a právo čerpať stavebný úver"],"a":"BC"},{"n":69,"q":"Stratí sporiteľ nasporené peniaze ak bude žiadať stavebnú sporiteľňu o ich vyplatenie skôr ako je dohodnuté v zmluve o stavebnom sporení ?","o":["Nie, sporiteľ nestratí svoje vlastné vložené peniaze ani pripísané úroky, ale pri predčasnom zrušení zmluvy (skôr ako o 6 rokov) príde o štátnu prémiu a zaplatí poplatok za zrušenie zmluvy","Pri predčasnom ukončení zmluvy o stavebnom sporení príde sporiteľ o všetky prostriedky","Stavebná sporiteľňa vyplatí sporiteľovi nasporené peniaze do 10 rokov, nakoľko tieto prostriedky už použila na financovanie stavebných úverov iným stavebných sporiteľom"],"a":"A"},{"n":70,"q":"Ako sú chránené prostriedky sporiteľa v stavebnej sporiteľni pred prípadným krachom stavebnej sporiteľne?","o":["Vklady sporiteľa sú chránené iba počas prvých dvoch rokov od uzatvorenia zmluvy o stavebnom sporení","Prostriedky sporiteľa v stavebnej sporiteľni sú chránené zákonnou ochranou vkladov do 100 000 EUR ako aj dohľadom Národnej banky Slovenska","Prostriedky sporiteľa nie sú chránené, nakoľko ide komerčný vzťah sporiteľa a stavebnej sporiteľne"],"a":"B"},{"n":71,"q":"Môže si spoločenstvo bytov alebo vlastníci bytov sporiť v stavebnej sporiteľni a prijímať štátnu prémiu ?","o":["Áno, spoločenstvo vlastníkov bytov si môže sporiť v stavebnej sporiteľni pričom na každé 4 byty v bytovom dome pripadá 1 štátna prémia","Nie, bytový dom si nemôže sporiť. Jednotliví vlastníci bytov si sporia individuálne a každý tak má svoju štátnu prémiu","Stavebné sporiteľne nikdy neuzatvárajú zmluvy o stavebnom sporení so spoločenstvami bytov alebo vlastníkmi bytov zastúpenými správcom"],"a":"A"},{"n":72,"q":"Kto podpisuje zmluvu o stavebnom sporení ak ide o vlastníkov bytov v bytovom dome","o":["Zmluvu so stavebnou sporiteľňou podpisujú všetci vlastníci bytov, ktorý sa zúčastnili domovej schôdze, na ktorej si odsúhlasili uzatvorenie zmluvy o stavebnom sporení v stavebnej sporiteľni","Každý vlastník bytu aj podielový spoluvlastník bytu v danom bytovom dome uzatvorí svoju vlastnú zmluvu o stavebnom sporení","Všetky dokumenty podpisuje splnomocnená osoba podľa typu správy bytového domu, buď Predseda spoločenstva vlastníkov bytov, správca, alebo predseda bytového družstva"],"a":"C"},{"n":73,"q":"Ako sa preukazuje účelovosť použitia nasporených prostriedkov spolu so štátnou prémiou zo stavebného sporenia na stavebné účely pred uplynutím 6 rokov?","o":["Stavebnej sporiteľni stačí čestné prehlásenie o použití prostriedkov","Účelovosť použitia nasporených prostriedkov spolu so štátnou prémiou zo stavebného sporenia na stavebné účely sa nepreukazuje, ak sporiteľ prostriedky vkladané na účet stavebného sporenia dostával darom od svojich rodičov","Predložia sa príjmové pokladničné doklady alebo originály faktúr od dodávateľov, z ktorých je zrejmá platba za práce alebo materiály"],"a":"C"},{"n":74,"q":"Musí sporiteľ vrátiť štátnu prémiu na stavebnom sporení ak nesplácal stavebný úver riadne a včas?","o":["Samotné omeškanie so splátkami úveru nie je zákonným dôvodom na spätné odňatie či vrátenie už vyplatených štátnych prémií za minulé roky","Áno, štátnu prémiu musí vrátiť každý dlžník, ktorý sa omeškal so splátkami úveru","Vrátiť štátnu prémiu musí iba dlžník, ktorý je v omeškaní so splácaním splátok úveru viac ako 3 mesiace"],"a":"A"},{"n":75,"q":"Musí uzatvorenie zmluvy o stavebnom sporení ako aj zmluvy o úvere od stavebnej sporiteľne podliehať rozhodnutiu vlastníkov bytov a nebytových priestorov v bytovom dome?","o":["Správca bytového domu rozhodne sám bez vlastníkov bytov o uzatvorení zmluvy o stavebnom sporení aj o čerpaní stavebného úveru podľa toho, akú údržbu bytový dom vyžaduje","Vlastníci bytov a nebytových priestorov v dome prijímajú rozhodnutia dvojtretinovou väčšinou hlasov všetkých vlastníkov bytov a nebytových priestorov v dome, ak hlasujú o zmluve o úvere alebo o zmluve o zabezpečení úveru","Právo rozhodovať majú iba tí vlastníci bytov, ktorí sa pravidelne zúčastňujú na bytových schôdzach"],"a":"B"},{"n":76,"q":"Uzatvára sa zmluva o stavebnom sporení na celý bytový dom, alebo si každý vchod do bytovky so súpisným číslom môže uzatvoriť vlastnú zmluvu o stavebnom sporení?","o":["Zmluva len pre jeden vchod nie je možná, pokiaľ s tým domový správca súhlasí","Každý vchod, ktorý si sám sporí do svojho fondu opráv môže uzatvárať vlastné zmluvy","Celý bytový dom vystupuje ako jedna budova. Zmluvu uzatvára správca alebo spoločenstvo vlastníkov za všetky vchody bytového domu spoločne"],"a":"C"},{"n":77,"q":"Dá sa použiť stavebné sporenie na splatenie akéhokoľvek iného úveru?","o":["Stavebný úver je možné použiť na splatenie akéhokoľvek úveru, aj napr. spotrebiteľského úveru, kreditnej karty alebo iného dlhu","Ak už uplynula 6-ročná lehota stavebného sporenia a sporiteľ si nasporenú sumu vyberie ako hotovosť alebo prevedie bez čerpania stavebného úveru, vtedy je možné nasporenú sumu použiť na splatenie čokoľvek vrátane splatenia ľubovoľného dlhu","Stavebné sporenie a úver zo stavebnej sporiteľne je možné použiť na splatenie iného úveru ak pôvodný úver bol účelovo určený na bývanie (napríklad kúpu, výstavbu, rekonštrukciu alebo predchádzajúceho hypotekárneho úveru"],"a":"BC"},{"n":78,"q":"Čo môže urobiť sporiteľ stavebného sporenia ak má záujem získať štátnu prémiu, avšak jeho príjem je vyšší ako 1,3 násobok priemernej mzdy?","o":["Sporiteľ si uzatvorí viacero zmlúv o stavebnom sporení","Aby mohol sporiteľ získať štátnu prémiu, môže využiť uzatvorenie zmluvy pre maloleté dieťa, pretože u neplnoletých osôb sa príjem zákonných zástupcov neskúma","Sporiteľ bude pokračovať v sporení bez štátneho príspevku a môže využiť produkt len na zhodnotenie vkladov a budúci stavebný úver"],"a":"BC"},{"n":79,"q":"Je možné použiť prostriedky zo stavebného sporenia na nákup voľne stojacich spotrebičov do domácnosti?","o":["Nie, nie je to možné","Áno, použitie prostriedkov zo stavebného sporenia je možné v prípade, že sa jedná o spotrebiče pevne spojené s nehnuteľnosťou , ktoré sú jej súčasťou ako napr. zabudovaná rúra, varná doska, digestor či integrovaná umývačka riadu","Ak už uplynula 6-ročná lehota stavebného sporenia a sporiteľ si nasporenú sumu vyberie ako hotovosť alebo prevedie bez čerpania stavebného úveru, vtedy je možné nasporenú sumu použiť na kúpu samostatne stojacich spotrebičov"],"a":"BC"},{"n":80,"q":"Je stavebná sporiteľňa bankou?","o":["Nie je. Banky sú iba tie inštitúcie, ktoré poskytujú svoje služby aj pre podnikateľov a poskytujú všetky typy úverov, kreditných kariet a umožňujú prevod peňazí","Stavebná sporiteľňa je špecializovaná banka na podporu výstavby a bývania, ktorá poskytuje sporenie a úvery v zmysle Zákone o stavebnom sporení a Zákona o spotrebiteľských úveroch a o iných úveroch a pôžičkách pre spotrebiteľov","Áno, stavebná sporiteľňa musí na základe licencie plniť prísne pravidlá finančného trhu a podlieha dohľadu NBS a vklady sporiteľov sú chránené Fondom ochrany vkladov"],"a":"BC"},{"n":81,"q":"Čo môže spôsobiť veriteľ, ak boli úverové prostriedky použité v rozpore s účelom čerpania uvedeným v zmluve o úvere?","o":["Čerpanie prostriedkov na iný účel ako je dohodnutý v úverovej zmluve môže mať za následok zastavenie ďalšieho čerpania úveru a zmluvné pokuty","Použitie prostriedkov z úveru v rozpore s úverovou zmluvou môže mať za následok okamžité zosplatnenie úveru veriteľom a požadovanie dlžníka o zaplatenie celého dlhu s príslušenstvom naraz","Po načerpaní úveru nie je dôležité, na aký účel sa peniaze použili. Je dôležité, aby dlžník splatil celý úver a splácal jednotlivé splátky riadne a včas"],"a":"AB"},{"n":82,"q":"Je podpora vo forme úveru od ŠFRB účelovým úverom?","o":["Podpora zo ŠFRB je dávkou v hmotnej núdzi pre osoby bez príjmu","ŠFRB nie je banka a preto neposkytuje úvery","Áno, podpora vo forme úveru od ŠFRB je prísne účelovým úverom spojeným s bývaním a iba na zákonom a zmluvne presne určený účel, ktorý je záväzne zadefinované v zákone o ŠFRB a v konkrétnej úverovej zmluve"],"a":"C"},{"n":83,"q":"Je uvedenie nepravdivých informácií dôvodom, pre ktorý môže veriteľ žiadať úverového dlžníka o vrátenie poskytnutých peňažných prostriedkov?","o":["Úverové zmluvy a Všeobecné obchodné podmienky zvyčajne oprávňujú veriteľa žiadať predčasné splatenie celej istiny, ak dlžník poskytol nepravdivé alebo neúplné údaje o svojej bonite, príjmoch či záväzkoch","Veriteľ nemá právo na odstúpenie od zmluvy iba z dôvodu nepravdivých informácií poskytnutých dlžníkom. Dlžník sa musí dostať najprv do omeškať so splátkami úveru","Áno. V prípade, že bol veriteľ uvedený do omylu, môže okrem žiadania vrátenia peňazí zároveň aj iniciovať trestné konanie vo veci úverového podvodu"],"a":"AC"},{"n":84,"q":"Čo môže klient urobiť, keď mu banka pošle 2 mesiace vopred oznámenie o zvýšení úrokovej sadzby?","o":["Môže akceptovať ponuku, pokiaľ sú podmienky prijateľné, alebo nemusíte robiť nič a nová sadzba aj splátka začnú platiť dňom uvedeným v oznámení","Klient môže vyjednávať s bankou a požiadať o prehodnotenie či zníženie úroku","Refinancovať, teda preniesť hypotéku do inej banky, ktorá ponúka výhodnejšiu úrokovú sadzbu tak, že nová banka starý úver splatí, no klient musí počítať s novým schvaľovaním a poplatkami"],"a":"ABC"},{"n":85,"q":"Prečo je tzv. americká hypotéka drahšia ako klasická hypotéka?","o":["Americká hypotéka je bezúčelová. Banka nevie overiť účel použitia prostriedkov, čo predstavuje vyššie riziko vzniku nesplácania, čím banka kompenzuje riziko vyššou úrokovou sadzbou","Americké hypotéky sú drahšie kvôli hypotekárnej kríze v USA v rokoch 2007 až 2009","V USA sú vyššie príjmy a sú preto klienti schopní platiť drahšie úvery zabezpečené nehnuteľnosťou"],"a":"A"},{"n":86,"q":"Aký typ úveru je vhodný na začatie „start-up“ podnikania, keď podnikateľ chce od banky získať kapitál a je ochotný založiť rezidenčnú nehnuteľnosť?","o":["Rezidenčné nehnuteľnosti banky nezakladajú, lebo neslúžia na podnikanie","Kreditná karta založená nehnuteľnosťou","Na rozbeh start-upu so založením rezidenčnej nehnuteľnosti je najvhodnejším produktom tzv. americká hypotéka, teda bezúčelový úver zabezpečený nehnuteľnosťou"],"a":"C"},{"n":87,"q":"Čo môže urobiť spoludlžník, keď musí splácať veriteľovi úver za druhého spoludlžníka, ktorý zomrel?","o":["Spoludlžník bude ďalej splácať, ale bude uhrádzať iba polovičné splátky","Povinnosť splácať úver prechádza na žijúceho spoludlžníka, ktorý musí splácať ďalej a zároveň je podiel zosnulého predmetom dedičského konania, kde zaň zodpovedajú jeho dedičia","Žijúci spoludlžník pozastaví svoje úhrady úveru a začne splácať opäť, keď začnú realizovať splátky úveru dedičia zomrelého spoludlžníka"],"a":"B"},{"n":88,"q":"Čo sa stane s úverom, ak je založená nehnuteľnosť v podielovom spoluvlastníctve, a na majetkový podiel jedného zo spoludlžníkov je vedená exekúcia?","o":["Exekútor nemôže exekvovať ani dražiť podiel podielového spoluvlastníka ako povinného, kým nesplatí celý úver","Exekútor môže exekvovať a dražiť iba podiel spoludlžníka -povinného z exekúcie, pričom druhý spoludlžník má ako podielový spoluvlastník predkupné právo","Financujúca banka alebo iný veriteľ môže pre začaté exekučné konanie vyhlásiť predčasnú splatnosť úveru a žiadať vrátenie všetkých prostriedkov z úveru od oboch spoludlžníkov"],"a":"BC"},{"n":89,"q":"Možno z úveru ŠFRB financovať výstavbu bytu vrátane bytu získaného nadstavbou, prístavbou alebo stavebnou úpravou budovy, ak vznikne byt v bytovom dome, v rodinnom dome alebo v polyfunkčnom dome?","o":["Áno, zo ŠFRB je možné takéto financovanie až do výšky 100 % obstarávacích nákladov stavby, maximálne však do zákonom stanovených pravidiel do výšky 180 000 €","ŠFRB podporuje iba novostavby bytov a domov, nie zmeny už dokončených stavieb","Áno, v zmysle zákona o ŠFRB je možné poskytnúť podporu na účel, ktorým dôjde k vzniku novej bytovej jednotky a nejde o bežnú rekonštrukciu existujúceho bytu, ale o stavebnú úpravu, nadstavbu či prístavbu, výsledkom ktorej je nový byt"],"a":"AC"},{"n":90,"q":"Môže fyzická osoba, ktorá je občanom členského štátu Európskej únie, alebo Švajčiarskej konfederácie požiadať o podporu zo ŠFRB?","o":["Zo ŠFRB môže požiadať o podporu iba občania Slovenskej republiky","Občania Európskej únie ani Švajčiarskej konfederácie nemôžu požiadať o podporu zo ŠFRB","Áno, ak má takáto osoba na území Slovenskej republiky trvalý pobyt, dovŕšila vek 18 rokov a má vlastný pravidelný príjem zo závislej činnosti, podnikania alebo podľa osobitného predpisu"],"a":"C"},{"n":91,"q":"Môžu manželia požiadať žiadosť o úver zo ŠFRB v prípade, že jeden z manželov je osobou, ktorá nie je občanom Slovenskej republiky?","o":["Manžel, ktorý nie je občanom SR môže byť spoludlžníkom na úvere zo ŠFRB, ak je občanom členského štátu Európskej únie alebo občan Švajčiarskej konfederácie a má na území SR trvalý pobyt","Osoba, ktorá nie je občanom Slovenskej republiky musí žiadať o úver v krajine, z ktorej pochádza","Ak ide o mladých manželov do 35 rokov žiadajúcich o úver a spĺňajú podmienky príjmu, potom ŠFRB neberie ohľad na štátnu príslušnosť a trvalý pobyt"],"a":"A"},{"n":92,"q":"Poskytuje sa podpora ŠFRB vo forme úveru s lehotou splatnosti 40 rokov aj žiadateľovi, ktorí má v čase podania žiadosti 35 rokov?","o":["Nie. Lehota splatnosti je maximálne 40 rokov, avšak podmienkou je, že úverový dlžník v čase splatnosti úveru nepresiahne vek 65 rokov","Nie. Lehotu splatnosti úveru 40 rokov majú iba 18 roční žiadatelia, starší nemajú nárok","40-ročnú splatnosť môže získať len žiadateľ vo veku 25 rokov a menej. Ak má žiadateľ 35 rokov, maximálna lehota splatnosti úveru je preňho 30 rokov"],"a":"AC"},{"n":93,"q":"Môže úver zo ŠFRB pokryť 100 % z celkových oprávnených obstarávacích nákladov bývania?","o":["Áno, úver ŠFRB môže pokryť až 100 % z celkových obstarávacích nákladov v závislosti od konkrétneho účelu úveru a pri dodržaní zákona na maximálne limitné stropy výšky úveru a rozlohy metrov štvorcových bytu alebo rodinného domu","ŠFRB poskytne podporu 100% obstarávacích nákladov iba na malometrážne byty do 40m2","ŠFRB nikdy neposkytuje podporu vo forme úveru na 100% obstarávacích nákladov"],"a":"A"},{"n":94,"q":"Môžu požiadať o úver zo ŠFRB manželia vo veku nad 35 rokov?","o":["Nie, úver ŠFRB je vždy pre všetkých žiadateľov iba vo veku do 35 rokov","Bez ohľadu na vek môže žiadať o podporu žiadatelia, ak sú členmi domácnosti, ktorej súčasťou je fyzická osoba s ťažkým zdravotným postihnutím, s ktorou žijú v spoločnej domácnosti aspoň jeden rok a zabezpečujú jej bývanie","Áno, manželia môžu požiadať o úver zo ŠFRB, ale nie ako kategória mladomanželov do 35 rokov, ale ako iná cieľová skupina. V tom prípade neplatí vekový limit 35 rokov ak majú maloleté dieťaťa vo veku najviac šesť rokov žijúce s nimi v domácnosti"],"a":"BC"},{"n":95,"q":"Môžu požiadať žiadosť o úver zo ŠFRB manželia, z ktorých je jeden vo veku do 35 rokov, ale druhý presiahol v čase podania žiadosti vek 35 rokov?","o":["Žiadosť bude zamietnutá v prípade, že nejde o mladomanželov do 35 rokov, kde podmienku veku musí splniť každý z nich","Ak je jeden z manžel starší ako 35, môže ŠFRB požiadať v žiadosti o podporu vo forme úveru o výnimku z podmienky veku","Bez ohľadu na vek môže žiadať o podporu žiadatelia, ak sú členmi domácnosti, ktorej súčasťou je fyzická osoba s ťažkým zdravotným postihnutím, s ktorou žijú v spoločnej domácnosti aspoň jeden rok a zabezpečujú jej bývanie alebo sa jedná o manželov/rodičov žijúcich v domácnosti s maloletým dieťaťa vo veku najviac šesť rokov"],"a":"AC"},{"n":96,"q":"Je možné poskytnúť podporu zo ŠFRB vo forme úveru manželom v prípade, ak jeden z manželov má príjem, ktorý prevyšuje päťnásobok sumy životného minima?","o":["V prípade, ak jeden z manželov má príjem, ktorý prevyšuje päťnásobok sumy životného minima bude žiadosť o podporu zo ŠFRB okamžite zamietnutá","Ak celkový príjem domácnosti postačuje na splácanie úveru zo ŠFRB, jeho výška sa neposudzuje","Posudzuje celkový čistý príjem celej domácnosti spoločne (teda súčet príjmov oboch manželov), nie príjem každého manžela zvlášť. Rozhodujúce je, aby spoločný príjem nepresiahol zákonom stanovený strop, ktorým je 5-násobok životného minima pre spoločne posudzovanú domácnosť"],"a":"C"},{"n":97,"q":"Je možné odpustiť časť istiny úveru zo ŠFRB na základe žiadosti?","o":["Nie, istinu a úroky z úveru musia byť zaplatené celé bez možnosti odpustenia časti dlhu","Áno, časť istiny úveru vo výške 2 000 eur je možné odpustiť z dôvodu narodenia alebo osvojenia dieťaťa na základe písomnej žiadosti najneskôr do jedného roka odo dňa vzniku tohto nároku","Odpustiť časť istiny je možné iba tým, ktorí sú v omeškaní so splátkami úveru"],"a":"B"},{"n":98,"q":"Je stanovená maximálna podlahová plocha bývania pre ktorú je možné žiadať o podporu vo forme úveru zo ŠFRB?","o":["Nie sú stanovené žiadne limity rozlohy v metroch štvorcových.","Limitovaní sú iba žiadatelia, ktorí nesplnia podmienku ŠFRB vo otázke veku a príjmu","Pre byty v bytovom dome je limit 80 m² (vrátane balkónov, lodžií a terás). Pre rodinný dom je limit 120 m², pričom sa doň nezapočítava plocha balkónov, lodžií, terás a prípadná garáž do 25 m²"],"a":"C"},{"n":99,"q":"Môže žiadať o podporu vo forme úveru zo ŠFRB aj sám žiadateľ bez manžela ako jednočlenná domácnosť v prípade, že nemá žiaden príjem?","o":["Áno. O úver zo ŠFRB môže požiadať aj jednotlivec. Jeho priemerný čistý mesačný príjem musí však dosahovať minimálne 1,3-násobok životného minima jeho jednočlennej domácnosti a zároveň nesmie presiahnuť 5-násobok životného minima","Nie. Osoba bez akéhokoľvek príjmu túto podmienku splniť nedokáže a nevie preto preukázať ŠFRB schopnosť splácať úver","Príjem nie je dôležitý pri posudzovaní schopnosti splácania úveru ŠFRB. Je podstatné, či žiadateľ spĺňa podmienku veku do 35 rokov"],"a":"AB"},{"n":100,"q":"Môže žiadať o úver zo ŠFRB na obstaranie bytu aj právnická osoba, obec alebo mesto?","o":["Nie, žiadateľom o obstaranie bytu úverom zo ŠFRB môže byť iba fyzická osoba","Áno, účelom úveru v zmysle zákona o ŠFRB býva pre obce a mestá obstaranie nájomného bytu, obstaranie technickej vybavenosti alebo kúpa pozemku súvisiaca s výstavbou nájomných bytov","Právnické osoby, obce a mestá sú z nároku na podporu zo ŠFRB vylúčené"],"a":"B"},{"n":101,"q":"Môžu sa podávať žiadosti o úver zo ŠFRB aj elektronicky?","o":["Nie, podanie žiadosti o podporu ŠFRB nie je možné zadať elektronicky. Musí byť podaná osobne","Iba za podmienky, že si ŠFRB telefonicky overí žiadateľa a následne už žiadateľ zasiela dokumenty elektronickou poštou","Pri elektronickom podaní žiadosti cez klientsky portál ŠFRB musí žiadateľ následne originály alebo fyzické kópie povinných listinných príloh doručiť osobne alebo poštou na mestský úrad v sídle okresu (podľa miesta stavby) do 5 pracovných dní od odoslania elektronického formulára"],"a":"C"},{"n":102,"q":"Je nesplnenie podmienok na poskytnutie podpory zo ŠFRB dôvodom na zamietnutie žiadosti o úver?","o":["ŠFRB nemá právo zamietnuť žiadosť ak bola podaná od 15. januára do 31. augusta príslušného roka","Nie, každý žiadateľ vo veku do 35 rokov má vždy nárok na úver zo ŠFRB. Vek je jediná podmienka","Áno, prekročenie zákonom stanoveného príjmového limitu, nesplnenie vekových alebo rodinných podmienok, nedostatočný príjem na splácanie, nevyhovujúce parametre nehnuteľnosti alebo chyby a chýbajúce prílohy v žiadosti sú dôvodom na zamietnutie žiadosti o podporu"],"a":"C"},{"n":103,"q":"Aká je požadovaná hodnota zabezpečenia pre úvery zo ŠFRB?","o":["ŠFRB vyžaduje, aby hodnota zakladanej nehnuteľnosti podľa znaleckého posudku dosahovala spravidla minimálne 1,3-násobok s výnimkou osôb odchovancov detských domovov a osôb ťažko zdravotne postihnutých, u ktorých akceptuje zabezpečenie s hodnotu minimálne 1,0-násobok požadovanej výšky úveru","ŠFRB nikdy nepožaduje zriadenie záložného práva na nehnuteľnosť","Zabezpečenie úveru nehnuteľnosťou sa vyžaduje iba u žiadateľov starších ako 35 rokov"],"a":"A"},{"n":104,"q":"Kto môže byť sporiteľom v stavebnej sporiteľni?","o":["Iba občan narodený na území Slovenskej republiky","Ktokoľvek, kto vie poukázať minimálny ročný vklad potrebný pre získanie štátnej prémie","Stavebným sporiteľom môže byť fyzická osoba, právnická osoba alebo spoločenstvo vlastníkov bytov, ktoré uzatvoria zmluvu o stavebnom sporení so stavebnou sporiteľňou"],"a":"C"},{"n":105,"q":"Je možné kúpiť iba jednu polovicu z bytu financovaním cez hypotekárny úver?","o":["Nie, hypotekárne banky nepovoľujú žiadnu čiastočnú kúpu spoluvlastníckeho podielu","Je to možné v prípade, že všetci podieloví spoluvlastníci budú súhlasiť so zriadením záložného práva na ich spoluvlastnícke podiely na danom byte, ak má byť tento byt aj predmetom záložného práva zabezpečujúceho pohľadávku z hypotekárneho úveru.","V prípade, že všetci podieloví spoluvlastníci nezriadia záložné právo na ich spoluvlastnícke podiely na danom byte, bude banka požadovať ako záloh inú akceptovateľnú nehnuteľnosť"],"a":"BC"},{"n":106,"q":"Je možné financovať v jednom rodinnom dome výstavbu viacerých samostatných bytov?","o":["Nie, v rodinnom dome nie je byt","V jednom rodinnom dome môžu byť najviac tri samostatné byty. Ak by budova obsahovala štyri a viac bytov, podľa slovenských predpisov sa už automaticky považuje za bytový dom","Áno, maximálne tri byty v jednom rodinnom dome môžu byť financované aj kolaudované ako samostatné byty s vlastným vchodom, samostatnými meradlami médií a stavebnotechnickou ohraničenosť priestoru od zvyšku domu"],"a":"BC"},{"n":107,"q":"Podlieha štátna prémia pripísaná na účet stavebného sporenia dani z príjmov?","o":["Áno, sporiteľ musí podať daňové priznanie a tento príjem musí zdaniť","Nie, štátna prémia pri stavebnom sporení je oslobodená od dane z príjmov","Iba maloletí sporitelia sú oslobodení od dane za štátnu prémiu"],"a":"B"},{"n":108,"q":"Čo je to „mimoriadna splátka“ – splátka úveru?","o":["Mimoriadna splátka úveru je dobrovoľná platba zaplatená nad rámec bežnej mesačnej splátky, ktorá znižuje celkovú dlžnú sumu istiny, čím umožňuje buď skrátiť dobu splácania úveru, alebo znížiť nasledujúce mesačné splátky","Je to úhrada splátok, ktoré dlžník mimoriadne zaplatí v hotovosti alebo prevodom z iného účtu ako je jeho bežný účet, z ktoré realizuje na inkaso splátok úveru","Mimoriadna splátka je určená pre dlžníkov, ktorí nemajú pravidelný príjem, splácajú nepravidelne a preto s istotou nevedia odhadnúť, kedy budú mať prostriedky na úhradu splátky úveru"],"a":"A"},{"n":109,"q":"Čo je to deň predčasnej splatnosti úveru?","o":["Je deň o ktorý dlžník požiadal banku pri žiadosti o splatenie dlhu alebo deň oznámenia doručeného dlžníkovi, kedy márne uplynie lehota na vrátenie celého zostávajúceho dlhu okamžite splatného, vrátane jeho istiny a úrokov","Je to prípad, keď dlžník zaplatí splátku o pár dni skôr v danom mesiaci, ako je dátum úhrady splátky v zmysle úverovej zmluvy","Banka alebo iný veriteľ určí deň predčasnej splatnosti vtedy, keď dlžník vážne poruší zmluvu – najčastejšie pri dlhodobom omeškaní so splátkami. Tento krok sa nazýva aj zosplatnenie úveru"],"a":"AC"},{"n":110,"q":"Aké doklady zvyčajne vyžaduje financujúci veriteľ na preukázanie použitie úveru?","o":["Jediný doklad, ktorý dlžník predkladá veriteľovi je jeho doklad totožnosti pri žiadosti o úver. Iné doklady nemá veriteľ právo požadovať","Veriteľ overil dlžníkovi doklady v procese poskytovania úveru, preto stačí dlžníkom podpísané čestné vyhlásenie o použití prostriedkov z úveru","Doklady preukazujúce dodržanie použitia jednotlivého čerpania úveru, a to najmä: faktúry (daňové doklady) vystavené dodávateľom služieb, prác alebo materiálu, spolu s dokladom o ich zaplatení , doklady z elektronickej registračnej pokladne o zaplatení v hotovosti alebo iná hodnoverná dokumentácia akceptovaná veriteľom"],"a":"C"},{"n":111,"q":"Načo slúži veriteľovi poistenie založenej nehnuteľnosti k čerpanému úveru?","o":["Poisťuje sa predmet zabezpečenia pre prípad poškodenia alebo zničenia","Poistenie nehnuteľnosti je iba ďalším produktom, na ktorom vedia zarobiť, keď poskytujú úvery, inak nemá špecifický význam","Okrem zmluvnej povinnosti dlžníka splatiť úverový záväzok slúži veriteľovi poistenie založenej nehnuteľnosti ako zábezpeka, že v prípade poškodenia zálohu dostane svoje peniaze späť a preto sa poistné plnenie vinkuluje v prospech financujúceho veriteľa"],"a":"AC"},{"n":112,"q":"Čo je považované pri financovaní nehnuteľností za tzv. príslušenstvo pohľadávky?","o":["Príslušenstvo pohľadávky je protizákonná požiadavka veriteľa, aby dlžník uhradil dodatočné náklady okrem samotného úveru. Dlžník veriteľovi má uhradiť iba istinu a úroky","Príslušenstvom je miesto, kde sa nachádza príslušná pobočka banky alebo stavebnej sporiteľne v ktorej bola dlžníkom podpísaná úverová zmluva","Dlžník je povinný veriteľovi zaplatiť okrem samotnej istiny úveru aj príslušenstvo, t.j. riadne úroky, úroky z omeškania, poplatky z omeškania, náklady spojené s výkonom záložného práva ako aj náklady spojené s uplatnením pohľadávky"],"a":"C"},{"n":113,"q":"Načo veriteľ vyžaduje vinkuláciu poistného vo svoj prospech pri poistení založenej nehnuteľnosti?","o":["Ide o mimoriadny výnos veriteľa, ktorý slúži na krytie straty za nesplácané úvery","Veriteľ vyžaduje vinkuláciu poistného plnenia, aby mal istotu, že pri zničení nehnuteľnosti dostane peniaze z poistky on, a nie dlžník. Veriteľ má teda prednostné právo na poistné plnenie.","Ak by dostal prostriedky dlžník a nie veriteľ, mohol by dlžník použiť vyplatené poistné plnenie za poškodenú nehnuteľnosť na iný účel ako oprava nehnuteľnosti, čím by sa veriteľovi znížila hodnota zálohu, ktorý je predmetom záložného práva zabezpečujúceho pohľadávku"],"a":"BC"},{"n":114,"q":"Aká je úloha Národnej Banky Slovenska (NBS) vo veciach poskytovaných úverov na bývanie?","o":["NBS vie poskytnúť úver na bývanie v prípade, že hypotekárne banky alebo stavebné sporiteľne už nemajú voľné prostriedky na poskytovanie úverov","Úvery na bývanie sú produktom komerčných bánk a NBS nemá možnosti ich regulácie","NBS vykonáva dohľad nad finančným trhom, reguluje úvery na bývanie, chráni finančnú stabilitu, sleduje zadlženosť domácností a stanovuje záväzné limity pre banky pri poskytovaní hypoték, ako sú stropy pre ukazovatele výšky úveru voči hodnote nehnuteľnosti alebo ukazovateľa pomeru dlhu k príjmu dlžníka"],"a":"C"},{"n":115,"q":"Môže banka alebo stavebná sporiteľňa jednostranne meniť Všeobecné podmienky pre poskytovanie úverov?","o":["Všeobecné obchodné podmienky sa nikdy nemenia. Vychádza sa z tých, ktoré boli podpísané v deň podpisu úverovej zmluvy","Všeobecné obchodné podmienky môže veriteľ meniť vtedy, ak si to vyžaduje napr. zmena legislatívy, trhu či nákladov, pričom nesmú vytvárať neprimeranú nerovnováhu v neprospech dlžníka a o každej zmene musia dlžníka vopred informovať","Áno, veriteľ je oprávnený meniť počas úverového vzťahu Všeobecné obchodné podmienky. Dlžník má zároveň zvyčajne právo zmluvu alebo úverový vzťah ukončiť bez sankcií"],"a":"BC"},{"n":116,"q":"Musí mať klient v banke vedený bežný účet ak chce od banky čerpať úver na bývanie?","o":["Áno, pretože v prípade že klient nemá v banke vedený účet na ktorý mu je poukazovaný jeho príjem, banka nevie zhodnotiť bonitu dlžníka a úver na bývanie mu neposkytne","Hodnotenie bonity nie je závislé od toho, ako dlho je klientom banky ani či má u nej bežný účet","Klient nemusí mať povinne aktívny svoj bežný účet vo financujúcej banke. Vysporiadanie úverových záväzkov prebieha z technického úverového účtu na splácanie splátok v zmysle úverovej zmluvy"],"a":"BC"},{"n":117,"q":"Je banka oprávnená požiadať úverového dlžníka o doplnenie hodnoty zabezpečenia úveru v prípade, že dôjde k zníženiu hodnoty založenej nehnuteľnosti?","o":["Áno, veriteľ je na to oprávnený, nakoľko to vyplýva priamo zo všeobecných obchodných podmienok v prípade, že hodnota založenej nehnuteľnosti klesne a zabezpečenie sa stane nedostatočným, má veriteľ právo žiadať dlžníka o doplnenie zábezpeky","Nie. Dlžník, ktorému klesne hodnota založenej nehnuteľnosti je v zlej situácii, čím nie je schopný poskytnúť dodatočné zabezpečenie a preto ho veriteľ nesmie žiadať o dozabezpečenie úveru","Veriteľ znáša spolu s dlžníkom trhové a iné riziká, preto vychádzajú z podmienok, ktoré boli v čase pri podpise úverovej zmluvy"],"a":"A"},{"n":118,"q":"Môže veriteľ začať výkon záložného práva na založenú nehnuteľnosť ak predtým ešte nepodal na súd žalobu o zapletenie pohľadávky za nesplácaný úver?","o":["Nie, veriteľ môže uspokojiť svoju pohľadávku speňažením nehnuteľnosti formou výkonu záložného práva až po tom, čo nebol úspešný v súdnom konaní na vydanie platobného rozkazu","Áno, veriteľ môže začať výkon záložného práva na založenú nehnuteľnosť po márnej výzve na úhradu splatného úveru a po uplynutí 30 dňovej zákonnej lehoty po písomnom oznámení o začatí výkonu záložného práva doručenej dlžníkovi a záložcovi","Veriteľ nemôže začať výkon záložného práva na nehnuteľnosť v prípade, že dlžník nemá iné náhradné bývanie"],"a":"B"},{"n":119,"q":"Aký je postup veriteľa v prípade, že bol začatý výkon exekúcie predajom nehnuteľnosti, ktorá zabezpečuje úverovú pohľadávku?","o":["Žiaden. Záložné právo na nehnuteľný majetok má vyššiu právnu silu ako exekúcia, preto dlžníkovi nič nehrozí, nakoľko exekúcia je na liste vlastníctva zapísaná v ďalšom rade za veriteľom, ktorý poskytol úver na bývanie","Veriteľ bude intenzívnejšie kontrolovať, či dlžník spláca a nie je v omeškaní so splátkou úveru","Začatie exekúcie predajom nehnuteľnosti je porušením ustanovenia úverovej zmluvy, ktoré vedie k zosplatneniu celého úveru s povinnosťou uhradiť zostávajúci dlh. Veriteľ s prednostným záložným právom môže pristúpiť k dražbe predmetu zabezpečenia a prípadný zostatok výťažku zo speňaženia majetku poslúži na uspokojenie ostatných veriteľov"],"a":"C"},{"n":120,"q":"Má právo banka po podpise úverovej zmluvy odmietnuť poskytnutie úveru?","o":["Ak je klient bonitný, banka je povinná poskytnúť klientovi úver, inak môže klient banku žalovať","Áno, napr. z dôvodov nesplnenia odkladacích podmienok pre čerpanie, nepoistenie majetku, chýbajúci podpis ručiteľa, podiel spolufinancovania, prípadne zastavené alebo prerušené vkladové konanie k zakladanej nehnuteľnosti","Nie, banka nesme po podpise úverovej zmluvy odmietnuť poskytnutie úver"],"a":"B"},{"n":121,"q":"Má veriteľ právo žiadať dlžníka o dodatočné plnenie v prípade, že založená nehnuteľnosť, ktorá bola speňažená na dražbe nepokryla celú pohľadávku z úveru?","o":["Nie, nemá. Ak bola speňažená založená nehnuteľnosť, od dlžníka už veriteľ nemôže nič požadovať","Veriteľ môže žiadať od dlžníka dodatočné plnenie iba ak speňažoval na dražbe nehnuteľnosť, v ktorej nemal dlžník trvalý pobyt","Áno, veriteľ má právo požadovať od dlžníka zaplatenie zostávajúcej časti dlhu. Speňažením založenej nehnuteľnosti na dražbe zaniká pohľadávka len v rozsahu, v akom bola reálne uspokojená a neuhradená časť úveru naďalej existuje a veriteľ ju môže od dlžníka vymáhať"],"a":"C"},{"n":122,"q":"Môžu dvaja kupujúci čerpať úver ako spoludlžníci na kúpu nehnuteľnosti tak, že na liste vlastníctva bude jeden vlastníkom ¼ nehnuteľnosti a druhý bude vlastníkom ¾ nehnuteľnosti ?","o":["Nie, ak si berú úver spoločne, každý z kupujúcich/spoludlžníkov musí vlastniť rovnaký podiel na nehnuteľnosti","Áno, spoludlžníci môžu mať rozdielne spoluvlastnícke podiely, ale veriteľ bude požadovať založenie všetkých podielov na financovanej nehnuteľnosti, pričom obaja spoludlžníci budú zodpovedať za celý úverový záväzok spoločne a nerozdielne","Spoludlžníci budú realizovať splátky úveru na dva samostatné úverové účty, každý do výšky svojho spoluvlastníckeho podielu"],"a":"B"},{"n":123,"q":"Musí sa úver na výstavbu čerpať iba jednorazovo, alebo je možné čerpať úver aj postupne?","o":["Dlžník musí vyčerpať všetky prostriedky iba jednorazovo","Úver na výstavbu je možné čerpať aj postupne v tranžiach počas fázy výstavby s tým, že dlžník platí úroky z reálne vyčerpanej sumy","Postupné čerpania úveru na výstavbu banka odmietne pre je administratívnu náročnosť"],"a":"A"},{"n":124,"q":"Je možné čerpať hypotekárny úver aj na dlhšie obdobie ako 30 rokov?","o":["Opatrením NBS je možná výnimka, kde banka môže výnimočne poskytnúť úver na bývanie s lehotou splatnosti presahujúcou 30 rokov, avšak celkový objem takýchto úverov nesmie v danej banke prekročiť 10 % z celkového objemu jej poskytnutých úverov na bývanie","Nie. Splatnosť zabezpečených úverov na bývanie môže byť najviac 30 rokov bez výnimiek","Bonitný klient môže čerpať hypotekárny úver s akoukoľvek splatnosťou o akú požiada"],"a":"AB"},{"n":125,"q":"Čo môže urobiť klient v prípade, že banka neumožňuje čerpať hypotekárny úver na kratšie obdobie ako 4 roky?","o":["Klient využije to, že banky umožňujú splatiť hypotéku bez sankcií kedykoľvek pri výročí fixácie","Klient bude splácať tak, ako je to má uvedené v úverovej zmluve a zároveň využije možnosť mimoriadnych splátok bez poplatkov","Klient nemá inú možnosť a musí po celý čas splácať tak, ako je to má uvedené v úverovej zmluve"],"a":"AB"},{"n":126,"q":"Čo urobí banka v prípade, že dlžník nevyčerpal celú výšku úveru?","o":["Dlžník bude musieť splácať úver vo výške akú uviedol do žiadosti o úver, bez ohľadu na to, koľko z úveru vyčerpal","Ak dlžník nevyčerpá celú výšku schváleného úveru zníži banka po uplynutí lehoty na čerpanie celkovú výšku úveru na reálne vyčerpanú sumu a upraví splátkový kalendár. V závislosti od podmienok zmluvy môže banka uplatniť poplatok za nedočerpanie","Ak je tak dohodnuté v úverovej zmluve, môže banka dlžníkovi účtovať poplatok za nedočerpanie úveru, nakoľko banka mala náklady na alokáciu zdrojov na dané financovanie dlžníka"],"a":"BC"},{"n":127,"q":"Môže byť úroková sadzba dohodnutá v zmluve o úvere jednostranne zmenená bankou počas doby fixácie úrokovej sadzby?","o":["Banka môže zvýšiť úrokovú sadzbu v prípade, ak sama získava zdroje na medzibankovom trhu na financovanie úverov za drahšie ako poskytla úvery v minulosti","Banka môže kedykoľvek navýšiť alebo znížiť úrokovú sadzbu na hypotékach okamžite po úpravách základnej úrokovej sadzby Európskej centrálnej banky","Nie, banka nemôže jednostranne zmeniť dohodnutú úrokovú sadzbu počas doby platnosti fixácie. Výška úroku je pevne garantovaná a nezmení sa bez ohľadu na vývoj na finančnom trhu. K zmene úroku môže banka pristúpiť až po uplynutí tohto obdobia"],"a":"C"},{"n":128,"q":"Má prednosť tzv. zákonné záložné právo vlastníkov bytov v bytovom dome pred záložným právom zabezpečujúcim pohľadávku hypotekárneho úveru?","o":["Nie, v prípade, že dražbu založeného bytu realizuje banka, vlastníci bytov v bytovom dome nemajú nárok na výťažok z dražby","Banky majú vždy prednosť, nakoľko pohľadávky z hypotekárnych úverov sú zvyčajne oveľa vyššie v porovnaní s nedoplatkami neplatičov v bytovom dome","Áno, zákonné záložné právo vlastníkov bytov slúži na zabezpečenie úhrad za plnenia spojené s užívaním bytu a do fondu opráv. Vzniká priamo zo zákona na ochranu spoločného majetku všetkých vlastníkov pred neplatičmi"],"a":"C"},{"n":129,"q":"Môže žiadateľ o hypotekárny úver odmietnuť banke podmienku na uzatvorenie poistnej zmluvy na zakladanú nehnuteľnosť s vysvetlením, že celý bytový dom je poistený správcovskou spoločnosťou vykonávajúcou správy bytového domu?","o":["Nie, žiadateľ nemôže jednostranne odmietnuť poistenie nehnuteľnosti. Ak je to podmienka čerpania hypotekárneho úveru, banka neuvoľní čerpanie úveru","Hoci je celá stavba bytového domu komplexne poistená správcom, slovenské banky hromadnú poistku správcu pre individuálnu hypotéku spravidla neakceptujú tým, že poistka nemusí pokrývať požadované riziká. Správca by tiež nesplnil povinnosť vinkulovania poistného plnenia v prospech financujúcej banky","Iba v prípade, že správca bytového domu uzatvorí samostatné poistenie každého bytu, ktorého vlastník čerpá v nejakej banke hypotekárny úver"],"a":"AB"},{"n":130,"q":"Čo urobí banka v prípade, že úverový dlžník neuhradil splátku poistného za poistenie založenej nehnuteľnosti s vinkulovaním poistného v prospech banky?","o":["Ak poisťovňa oznámi banke zánik vinkulovaného poistenia, banka vyzve dlžníka na nápravu a uzatvorenie poistnej zmluvy s vinkulovaním poistného. Neplatenie poistného za nehnuteľnosti je vážnym porušením úverovej zmluvy a Všeobecných obchodných podmienok","Nehnuteľnosť ostane nepoistená a banka to bude akceptovať do momentu, kým sa dlžník nedostane do omeškania so splátkami úveru","Banka sama uzatvorí novú poistnú zmluvu a sama bude uhrádzať poistné za poistenie nehnuteľnosti a kým dlžník nezaplatí poslednú splátku úveru"],"a":"A"},{"n":131,"q":"Je banka oprávnená požadovať vykonanie obhliadky založenej nehnuteľnosti za účelom ohodnotenia predmetu záložného práva?","o":["Áno, v zmysle všeobecných obchodných podmienok je banka oprávnená požadovať od dlžníka alebo záložcu umožnenie obhliadky založenej nehnuteľnosti za účelom jej ohodnotenia.","Nie, banka má znalecký posudok vyhotovený v čase, keď poskytovala úver a na iné ohodnotenie zálohu nemá oprávnenie","Banka môže vyžadovať obhliadku iba od klientov, ktorí pri podpise úverovej zmluvy odovzdali banke kľúče od nehnuteľnosti"],"a":"A"},{"n":132,"q":"Môže úverový dlžník prenajímať nehnuteľnosť, ktorá je financovaná hypotekárnym úverom?","o":["Vlastník nehnuteľnosti má právo nakladať so svojim majetkom, avšak banky môžu v zmysle všeobecných obchodných podmienok vyžadovať povinnosť oznámiť veriteľovi dlhodobý prenájom","Vlastník môže prenajať nehnuteľnosť od momentu, keď splatí aspoň polovicu úveru","Nie, kým nie je úver celý splatený, dlžník v skutočnosti ešte nevlastní celú nehnuteľnosť, a preto financovanú nehnuteľnosť nemôže prenajímať"],"a":"A"},{"n":133,"q":"Je možné financovať hypotekárnym úverom apartmán, ktorý nespĺňa požiadavky bytu?","o":["Každý nebytový priestor je možné financovať hypotekárnym úverom","Apartmán, ktorý nespĺňa požiadavky bytu je možné výnimočne financovať hypotekárnym úverom, pričom banky ho posudzujú individuálne a s rôznymi obmedzeniami a dodatočnými požiadavkami","Áno, keď má apartmán všetku vybavenosť ako byt, banka ho bude financovať za rovnakých podmienok"],"a":"B"},{"n":134,"q":"Má úverový dlžník, ktorý čerpal hypotekárny úver za účelom výstavby povinnosť predložiť financujúcej banke kolaudačné rozhodnutie?","o":["V prípade, že je dokončená stavba obývateľná, nie je potrebné kolaudačné rozhodnutie","Banky nemajú právo požadovať nič od dlžníka, ani požadovať predložiť žiadne dodatočné doklady pokiaľ nie je dlžník v omeškaní so splátkami úrokov","Áno, na prechod zo splácania samotných úrokov z vyčerpanej časti úveru na štandardné splácanie istiny a úrokov vyžadujú banky kolaudačné rozhodnutie, ktoré je podkladom pre zápis dokončenej nehnuteľnosti do katastra"],"a":"C"},{"n":135,"q":"Aké doklady po vyčerpaní úveru bude požadovať financujúca banka v prípade, že účelom úveru je splatenie iného úveru na bývanie?","o":["Banka bude požadovať písomné potvrdenie o úplnom splatení pohľadávky pôvodného veriteľa (kvitanciu) a výpis z listu vlastníctva preukazujúci výmaz ťarchy pôvodného veriteľa","Banka nebude požadovať žiadne doklady","Banka bude požadovať občiansky preukaz dlžníka s preukázaním adresy trvalého pobytu na financovanej nehnuteľnosti"],"a":"A"},{"n":136,"q":"Je ručiteľ oprávnený získavať informácie od financujúcej banky o výške pohľadávky z úveru?","o":["Ručiteľ nemá právo na žiadne informácie o klientoch banky","Poskytnutie informácií ručiteľovi by bolo porušením bankového tajomstva","Áno, ručiteľ je oprávnený kedykoľvek a bez zbytočného odkladu žiadať od financujúcej banky ako veriteľa informáciu o aktuálnej výške pohľadávky z úveru"],"a":"C"},{"n":137,"q":"Môže banka ako veriteľ uspokojiť splatné splátky z hypotekárneho úveru z iného ako bežného účtu úverového dlžníka, napr. z jeho termínovaného účtu vedeného u veriteľa?","o":["Z termínovaného úveru nie je možné započítať splatnú pohľadávku, lebo klient by mohol prísť o úrokový výnos pred zročnosťou viazanosti prostriedkov","Všeobecné obchodné podmienky umožňujú bankám právo na jednostranný zápočet použitím akýchkoľvek vkladov či peňažných prostriedkov vedených na účtoch v banke na úhradu jeho splatných záväzkov, nedoplatkov a splátok","Termínovaný účet nie je bežný účtom, a nie je možné ho používať na úhradu alebo zápočet splátok"],"a":"B"},{"n":138,"q":"Kto znáša náklady spojené s vymožením nesplácaného úveru?","o":["Ak je veriteľom banka, tak musí znášať náklady vymáhania","Dlžník nikdy neznáša náklady vymáhania, lebo sám nemá prostriedky na splácanie úveru","Vynaložené náklady dražby, exekučného konania, notárske a správne poplatky sú súčasťou pohľadávky a dlžník alebo ručiteľ sa ich zaväzujú veriteľovi zaplatiť"],"a":"C"},{"n":139,"q":"Môže veriteľ, ktorý speňažuje založenú nehnuteľnosť na dražbe navrhnúť minimálne podanie na dražbe vo výške, ktorá je nižšia ako hodnota nehnuteľnosti ocenená znaleckým posudkom?","o":["Nehnuteľnosť na dražbe sa musí speňažovať za viac ako je hodnota uvedená znaleckým posudkom","Nie, znížiť najnižšie podanie na dražbe je možné iba so súhlasom dlžníka alebo záložcu","Áno, pri opakovaných dražbách je možné najnižšie podanie ďalej znížiť až na polovicu znaleckej hodnoty"],"a":"C"},{"n":140,"q":"Je banka oprávnená meniť výšku poplatkov počas úverového vzťahu s dlžníkom?","o":["Áno, banka je oprávnená meniť výšku p
