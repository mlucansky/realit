tknutej osoby (v rámci ochrany osobných údajov) možno získať:","o":["písomným vyhlásením","elektronickým jednoznačným potvrdzujúcim úkonom","zaznamenaným ústnym vyhlásením"],"s":"GDPR","a":"ABC"},{"n":164,"q":"Odvolanie súhlasu (v rámci ochrany osobných údajov):","o":["spôsobuje nezákonnosť spracúvania, ktoré bolo pred odvolaním vykonané zákonne","má byť rovnako jednoduché ako jeho poskytnutie","je možné kedykoľvek"],"s":"GDPR","a":"BC"},{"n":165,"q":"Námietka proti spracúvaniu osobných údajov na účely priameho marketingu:","o":["vedie k ukončeniu spracúvania na tento účel a vzťahuje sa aj na súvisiace profilovanie","zaväzuje prevádzkovateľa len vtedy, ak dotknutá osoba preukáže závažný dôvod","nemá vplyv na profilovanie spojené s priamym marketingom"],"s":"GDPR","a":"AC"},{"n":166,"q":"Realitná kancelária môže spracúvať osobné údaje klienta bez jeho súhlasu:","o":["vždy, ak ide o údaje získané počas obhliadky nehnuteľnosti","ak je spracúvanie nevyhnutné na plnenie zmluvy s klientom","ak klient svoje údaje zverejnil na internete"],"s":"GDPR","a":"B"},{"n":167,"q":"Porušenie ochrany osobných údajov sa dozornému orgánu oznamuje:","o":["bez zbytočného odkladu a podľa možnosti najneskôr do 72 hodín od okamihu, keď sa o ňom prevádzkovateľ dozvedel","do 24 hodín bez ohľadu na mieru rizika","iba vtedy, ak už porušenie preukázateľne spôsobilo dotknutej osobe škodu"],"s":"GDPR","a":"A"},{"n":168,"q":"Ak porušenie ochrany osobných údajov pravdepodobne povedie k vysokému riziku pre práva a slobody fyzických osôb:","o":["postačuje jeho oznámenie dozornému orgánu bez informovania dotknutej osoby","prevádzkovateľ ho oznámi dotknutej osobe bez zbytočného odkladu, ak nie je splnená niektorá zo zákonných výnimiek","dotknutá osoba sa informuje iba vtedy, ak jej preukázateľne hrozí škoda"],"s":"GDPR","a":"B"},{"n":169,"q":"Právo na prenosnosť osobných údajov sa uplatňuje, ak sa spracúvanie:","o":["vykonáva výlučne v papierovej evidencii bez automatizácie","vykonáva automatizovanými prostriedkami","zakladá na súhlase alebo zmluve"],"s":"GDPR","a":"BC"},{"n":170,"q":"Právo na vymazanie osobných údajov sa neuplatní, ak je ich spracúvanie potrebné:","o":["preto, že prevádzkovateľ predpokladá ich možné budúce využitie","na preukazovanie, uplatňovanie alebo obhajovanie právnych nárokov","pre prípad budúcej marketingovej kampane"],"s":"GDPR","a":"B"},{"n":171,"q":"Etapy legalizácie príjmov z trestnej činnosti sú:","o":["integrácia","umiestnenie","rozvrstvenie"],"s":"AML","a":"ABC"},{"n":172,"q":"Umiestnenie ako etapa legalizácie príjmov z trestnej činnosti môže zahŕňať:","o":["investovanie už legalizovaných prostriedkov do nehnuteľností alebo podnikania","sériu prevodov medzi viacerými účtami s cieľom sťažiť zistenie pôvodu peňazí","vloženie hotovostných výnosov z trestnej činnosti do finančného systému"],"s":"AML","a":"C"},{"n":173,"q":"Rozvrstvenie ako etapa legalizácie príjmov z trestnej činnosti:","o":["smeruje k zneprehľadneniu toku nelegálnych prostriedkov","predstavuje začlenenie už vypratých prostriedkov do legálnej ekonomiky","využíva množstvo zdanlivo nesúvisiacich operácií"],"s":"AML","a":"AC"},{"n":174,"q":"Pre integráciu ako etapu legalizácie príjmov z trestnej činnosti platí:","o":["spočíva vo vykonávaní série transakcií s cieľom zakryť pôvod a tok finančných prostriedkov","môže mať podobu nákupu nehnuteľností alebo cenných papierov","začleňuje už vypraté peniaze do legálnych obchodov alebo investícií"],"s":"AML","a":"BC"},{"n":175,"q":"Realitná kancelária ako povinná osoba podľa AML zákona je povinná:","o":["uplatňovať rizikovo orientovaný prístup","určiť zodpovednú osobu","vypracovať program vlastnej činnosti"],"s":"AML","a":"ABC"},{"n":176,"q":"Odborná príprava a vnútorná kontrola pri AML zahŕňajú:","o":["úkony, iba vtedy, ak bola u povinnej osoby zistená neobvyklá obchodná operácia","prípravu zamestnanca (spolupracujúceho makléra) pred nástupom na pozíciu s úlohami podľa programu","mechanizmus vnútornej kontroly a povinné preškolenie najmenej raz za kalendárny rok"],"s":"AML","a":"BC"},{"n":177,"q":"Neobvyklou obchodnou operáciou môže byť obchod:","o":["pri ktorom sa klient odmieta identifikovať","bez zrejmého ekonomického alebo zákonného účelu","pri ktorom je objem prostriedkov v zjavnom nepomere k deklarovaným majetkovým pomerom klienta"],"s":"AML","a":"ABC"},{"n":178,"q":"Klient bez zjavného dôvodu vytvára časovú tieseň a núti makléra obísť povinnosti. Takéto správanie:","o":["môže byť indikátorom neobvyklej obchodnej operácie","je bežné a je bez právneho významu","má realitná kancelária automaticky ignorovať, ak ide o klienta, ktorý jej služby v minulosti už využil"],"s":"AML","a":"A"},{"n":179,"q":"Na účet realitnej kancelárie prídu peniaze „omylom“ a odosielateľ žiada ich vrátenie v hotovosti alebo na iný účet. Ide o:","o":["situáciu bez akéhokoľvek AML významu","okolnosť uvedenú medzi indikátormi neobvyklej obchodnej operácie","legitímnu operáciu bez potreby ďalšieho posúdenia"],"s":"AML","a":"B"},{"n":180,"q":"Ak realitná kancelária zistí neobvyklú obchodnú operáciu:","o":["je povinná ju zdržať, ak hrozí zmarenie alebo podstatné sťaženie zaistenia prostriedkov","je povinná ju ohlásiť Finančnej spravodajskej jednotke Policajného zboru","môže ju dokončiť, ak realitnej kancelárii hrozí narušenie reputácie"],"s":"AML","a":"AB"}]},{"id":"obchod","name":"Realitný obchod","questions":[{"n":1,"q":"Realitný trh je trh:","o":["na ktorom sa stretáva ponuka nehnuteľností so službami s nimi súvisiacimi","na ktorom sa stretáva ponuka nehnuteľností s dopytom","ktorý pozostáva z množstva menších a relatívne samostatných lokálnych trhov"],"a":"ABC"},{"n":2,"q":"Medzi rezidenčné nehnuteľnosti nepatrí:","o":["byt","hotel","rodinný dom"],"a":"B"},{"n":3,"q":"Najčastejšia forma spolupráce medzi realitnou kanceláriou a maklérom je:","o":["keď maklér vystupuje ako zamestnanec (hlavný pracovný pomer)","keď maklér vystupuje ako podnikateľ – živnostník","na základe dohody o vykonaní práce podľa Zákonníka práce"],"a":"B"},{"n":4,"q":"Provízia predstavuje finančnú čiastku, ktorá môže byť dohodnutá:","o":["fixne","výšku provízie určuje vyhláška Ministerstva hospodárstva SR","je dohodnutá v závislosti od typu nehnuteľnosti a lokality"],"a":"AC"},{"n":5,"q":"Na vydanie viazanej živnosti sprostredkovania predaja, kúpy a prenájmu nehnuteľnosti (realitná činnosť) je zo zákona potrebné preukázať odbornú spôsobilosť:","o":["úplným stredoškolským vzdelaním s maturitou, 2 rokmi praxe v (realitnom) odbore a osvedčením o absolvovaní odborného kurzu akreditovaného MŠ SR","vysokoškolským vzdelaním ekonomického, právnického, alebo matematického smeru","úplným stredoškolským všeobecným vzdelaním alebo úplným stredoškolským odborným vzdelaním a osvedčením o absolvovaní akreditovaného vzdelávacieho programu v odbore"],"a":"C"},{"n":6,"q":"Homestaging je:","o":["virtuálna obhliadka nehnuteľnosti","jednou z najnovších internetových foriem reklamy","proces prípravy nehnuteľnosti na predaj, bez rozsiahlej rekonštrukcie a finančne náročných úprav"],"a":"C"},{"n":7,"q":"Prepis odberného miesta plynu na kupujúceho:","o":["sa uskutočňuje zväčša telefonicky, prípadne osobne v zákazníckych centrách dodávateľa, alebo vyplnením žiadosti o zmenu odberateľa na odbernom mieste","uskutočňuje sa jedine vyplnením žiadosti o zmenu odberateľa na odbernom mieste","nie je možné vybaviť telefonicky, ale iba osobne, návštevou Zákazníckeho centra SPP alebo vyplnením žiadosti o zmenu odberateľa na odbernom mieste, ktorú je potrebné zaslať e-mailom, poštou alebo faxom"],"a":"C"},{"n":8,"q":"Pod pojmom realitný sprostredkovateľ rozumieme:","o":["realitnú kanceláriu","realitných maklérov s viazanou živnosťou oprávňujúcou k realitnému sprostredkovaniu","výlučne makléra, nikdy nie realitnú kanceláriu"],"a":"AB"},{"n":9,"q":"Realitný maklér je:","o":["osoba, ktorá je personálnou súčasťou realitnej kancelárie a ktorá v mene realitnej kancelárie vykonáva súhrn určených činností, medzi ktoré patria najmä vyhľadávanie obchodných príležitostí, komunikácia s klientmi, vykonávanie obhliadok nehnuteľností a iné úkony na ktoré ho poverí realitná kancelária","zákonom definovaný ako sprostredkovateľ konajúci v mene realitnej kancelárie","nie je zákonne definovaný"],"a":"AC"},{"n":10,"q":"Hlavnými výhodami spolupráce s realitnou kanceláriou v režime „Podnikateľ“ sú pre realitného makléra:","o":["vyšší podiel z provízie","pohyblivá pracovná doba","nižšia zodpovednosť"],"a":"AB"},{"n":11,"q":"Exkluzívna (výhradná) zmluva v realitnom obchode:","o":["sa zvyčajne uzatvára na dobu neurčitú","umožňuje majiteľovi nehnuteľnosti uzatvárať sprostredkovateľskú zmluvu aj s inými realitnými kanceláriami","ide o trojstrannú dohodu medzi realitným sprostredkovateľom, budúcim kupujúcim a budúcim predávajúcim"],"a":""},{"n":12,"q":"Čo je tzv. pracovný list pri náborovej obhliadke:","o":["je pomocný záznam či skôr zoznam údajov o nehnuteľnosti","je spôsob zaznamenania všetkých informácií o nehnuteľnosti tak, aby tvorili kvalitný podklad pre prípravu predajného inzerátu na realitných inzertných portáloch","nie je rovnaký pre rôzne typy nehnuteľností"],"a":"ABC"},{"n":13,"q":"Dokumenty, ktoré je potrebné priniesť k správcovi pri prepise nehnuteľnosti:","o":["sa líšia v závislosti od požiadaviek jednotlivých správcov","sú zadefinované v Zákone o bytoch a nebytových priestoroch","určuje samospráva mesta, kde sa nehnuteľnosť nachádza"],"a":"A"},{"n":14,"q":"Maklér kupujúceho je:","o":["maklér, ktorý hľadá záujemcov o kúpu nehnuteľnosti","maklér, ktorý na základe sprostredkovateľskej zmluvy pracuje pre záujemcu o kúpu nehnuteľnosti","maklér, ktorý hľadá záujemcov o predaj nehnuteľnosti"],"a":"BC"},{"n":15,"q":"Dokumentačná obhliadka:","o":["je obhliadka nehnuteľnosti s prítomnosťou kupujúceho aj predávajúceho","je to isté ako náborová obhliadka","je obhliadka, pri ktorej sa realitný maklér oboznamuje s nehnuteľnosťou"],"a":"BC"},{"n":16,"q":"Čo je CMA analýza:","o":["je to nástroj na porovnávanie najpodobnejších nehnuteľností inzerovaných na aktuálnom trhu v danej lokalite","je to nástroj, ktorý umožňuje maklérom vykonávať trhovú analýzu cien","je to nástroj na určenie ceny nehnuteľnosti založený na metóde priemerovania cien za posledných 10 rokov"],"a":"AB"},{"n":17,"q":"Ktoré úkony patria medzi typické činnosti po prevode vlastníckeho práva?","o":["Odhlásenie pôvodného vlastníka a prihlásenie nového u správcu bytového domu","Prepis médií a služieb v prospech nového vlastníka","Prebratie nehnuteľnosti kupujúcim"],"a":"AB"},{"n":18,"q":"V realitnej praxi sa pri stanovení ceny nehnuteľnosti najčastejšie používa:","o":["komparatívna metóda postavená na historickom vývoji cien nehnuteľnosti","metóda regresnej analýzy","metóda založená na princípe porovnávania cien nehnuteľnosti v rovnakom čase, ktoré sú vzhľadom na svoj charakter, technický stav a umiestnenie porovnateľné"],"a":"C"},{"n":19,"q":"Kupujúci sa stane vlastníkom nehnuteľnosti v okamihu, keď:","o":["dôjde k odovzdaniu nehnuteľnosti medzi predávajúcim a kupujúcim","dôjde k podpisu kúpnej zmluvy medzi predávajúcim a kupujúcim","právoplatným rozhodnutím katastrálneho odboru okresného úradu o povolení vkladu do katastra nehnuteľností"],"a":"C"},{"n":20,"q":"Počas obhliadky by mal maklér:","o":["dať podpísať záznam o vykonanej obhliadke","ihneď zoznámiť predávajúceho so záujemcom","byť pripravený a pravdivo zodpovedať všetky otázky záujemcov"],"a":"AC"},{"n":21,"q":"Ako má realitný maklér postupovať pri nábore novej nehnuteľnosti?","o":["Uzatvoriť zmluvu ešte pred fyzickou obhliadkou","Overiť vlastníctvo v katastri a vykonať osobnú obhliadku","Zistiť technický stav a predajné možnosti nehnuteľnosti"],"a":"BC"},{"n":22,"q":"Aký je hlavný účel homestagingu?","o":["Zlepšiť vizuálnu prezentáciu a zvýšiť predajnú atraktivitu","Zabezpečiť právne preverenie vlastníckych vzťahov","Pomôcť kupujúcemu lepšie si predstaviť priestor"],"a":"AC"},{"n":23,"q":"Čo by mal maklér zabezpečiť pred zverejnením ponuky na realitných portáloch?","o":["Získať písomný súhlas vlastníka so zverejnením","Skontrolovať technické údaje a právne aspekty nehnuteľnosti","Zverejniť inzerát len s údajmi od developera"],"a":"AB"},{"n":24,"q":"V čom spočíva význam výhradnej sprostredkovateľskej zmluvy?","o":["Umožňuje predávať nehnuteľnosť viacerým kanceláriám súčasne","Zaväzuje klienta spolupracovať len s jednou kanceláriou","Poskytuje maklérovi silnejšiu vyjednávaciu pozíciu pri predaji"],"a":"BC"},{"n":25,"q":"Ktoré tvrdenia platia pri určovaní trhovej ceny nehnuteľnosti?","o":["Vyžaduje sa analýza cien porovnateľných nehnuteľností","Vždy sa určuje podľa znaleckého posudku","Zohľadňuje sa lokalita, stav a dopyt na trhu"],"a":"AC"},{"n":26,"q":"Kedy je ideálne uskutočniť obhliadku nehnuteľnosti?","o":["Počas denného svetla, keď je interiér dobre osvetlený","V noci, aby sa minimalizoval ruch v okolí","Vo vhodnom čase a na dobu, ktorá umožňuje klientovi posúdiť reálny stav objektu"],"a":"AC"},{"n":27,"q":"Aké sú výhody písomnej výhradnej zmluvy s klientom?","o":["Znižuje riziko duplicity v ponuke medzi viacerými RK","Klient môže súčasne spolupracovať s inými maklérmi","Maklér môže investovať viac do marketingu nehnuteľnosti"],"a":"AC"},{"n":28,"q":"Čo je hlavnou úlohou náborového stretnutia?","o":["Získať dôveru klienta a overiť fakty o nehnuteľnosti","Zabezpečiť podpis kúpnej zmluvy","Dohodnúť sa na predajnej stratégii a provízii"],"a":"AC"},{"n":29,"q":"Kedy možno považovať rezerváciu nehnuteľnosti za právne záväznú?","o":["Po podpise rezervácie s definovanými podmienkami a zálohou","Po telefonickej dohode medzi stranami","Ak je rezervácia doložená emailovou komunikáciou"],"a":"A"},{"n":30,"q":"Čo je dôležité overiť pri určovaní predajnej ceny nehnuteľnosti?","o":["Aktuálne trhové ceny podobných nehnuteľností v danej lokalite","Pôvodnú nákupnú cenu nehnuteľnosti predávajúcim","Technický stav, vybavenie a polohu"],"a":"AC"},{"n":31,"q":"Prečo je dôležité informovať klienta o priebehu obhliadok?","o":["Klient si vie upraviť vlastné očakávania počas priebehu predaja","Zvyšuje sa transparentnosť spolupráce","Nie je potrebné, klient si to zistí cez realitný portál"],"a":"AB"},{"n":32,"q":"Ktoré formy prezentácie patria medzi moderné marketingové nástroje?","o":["Virtuálne prehliadky 3D modelov nehnuteľností","Výhradne tlačená inzercia v novinách","Video prezentácie nehnuteľnosti s komentárom"],"a":"AC"},{"n":33,"q":"Čo je potrebné zabezpečiť pri tvorbe fotografií nehnuteľnosti?","o":["Súhlas vlastníka so zverejnením obrazového materiálu","Čisté a upravené priestory pred fotením","Použitie výhradne smartfónu pri fotení"],"a":"AB"},{"n":34,"q":"Aký význam má popredajný servis v realitnom obchode?","o":["Budovanie referencií a klientskych odporúčaní","Právna garancia kupujúcemu","Zvýšenie spokojnosti klienta a posilnenie značky makléra"],"a":"AC"},{"n":35,"q":"Ktoré náležitosti musí obsahovať rezervačná zmluva?","o":["Výška rezervačného poplatku a doba platnosti rezervácie","Dohodu o vyprataní nehnuteľnosti","Identifikácia nehnuteľnosti a účastníkov zmluvy"],"a":"AC"},{"n":36,"q":"Čo je kľúčové pre úspešné nadviazanie spolupráce s klientom?","o":["Dôvera, odbornosť a schopnosť vysvetliť proces predaja","Jasné stanovenie práv a povinností oboch strán","Oslovenie klienta prostredníctvom tretej osoby"],"a":"AB"},{"n":37,"q":"Ktorý dokument zvyšuje právnu ochranu počas realitného obchodu?","o":["Ústna dohoda medzi stranami","Sprostredkovateľská zmluva s definovaným rozsahom činnosti","Rezervačná zmluva so sankčnými podmienkami pri odstúpení"],"a":"BC"},{"n":38,"q":"Čo je výsledkom dobre vykonanej trhovej analýzy?","o":["Správne nastavená predajná cena nehnuteľnosti","Stanovenie realistických očakávaní predávajúceho","Zistenie daňovej povinnosti predávajúceho"],"a":"AB"},{"n":39,"q":"Kedy môže dôjsť k zníženiu predajnej ceny počas procesu predaja?","o":["Ak je nehnuteľnosť príliš dlho na trhu bez záujmu","Na základe vyjadrenia katastrálneho úradu","Na základe spätnej väzby z obhliadok"],"a":"AC"},{"n":40,"q":"Ako má maklér pristupovať k právnemu prevereniu nehnuteľnosti?","o":["Overiť list vlastníctva, ťarchy a vecné bremená","Konzultovať s právnikom","Spoliehať sa na vyjadrenia predávajúceho"],"a":"AB"},{"n":41,"q":"Ktoré faktory ovplyvňujú úspešnosť obhliadky?","o":["Príprava nehnuteľnosti a vhodné načasovanie obhliadky","Čas strávený na obhliadke","Schopnosť makléra prezentovať nehnuteľnosť"],"a":"AC"},{"n":42,"q":"Prečo je dôležité správne určiť cieľovú skupinu pri predaji?","o":["Efektívnejšia inzercia a vyššia pravdepodobnosť predaja","Možnosť prispôsobiť marketingové nástroje potrebám kupujúceho","Kvôli daňovej optimalizácii"],"a":"AB"},{"n":43,"q":"Ako má maklér pristupovať k určeniu výšky provízie?","o":["Zohľadniť náročnosť prípadu a dohodnúť výšku transparentne s klientom","Automaticky účtovať 5 % z ceny","Prispôsobiť výšku konkurenčnému prostrediu"],"a":"AC"},{"n":44,"q":"Čo je potrebné spraviť pri zisťovaní právneho stavu nehnuteľnosti?","o":["Skontrolovať list vlastníctva a ťarchy","Zistiť stav nehnuteľnosti cez ústne vyjadrenie predávajúceho","Overiť záznamy a informácie v katastri nehnuteľností"],"a":"AC"},{"n":45,"q":"Čo by mal maklér urobiť po podpise rezervačnej zmluvy?","o":["Informovať klienta o ďalšom postupe","Pripraviť podklady pre advokáta alebo notára","Rezervovať termín na katastri"],"a":"AB"},{"n":46,"q":"Ktoré znaky má mať profesionálna prezentácia nehnuteľnosti?","o":["Kvalitné fotografie, jasný popis, dôraz na výhody","Relevantné technické a právne informácie","Uvádzanie najvyššej možnej ceny bez ohľadu na realitu"],"a":"AB"},{"n":47,"q":"Kedy je vhodné klientovi odporučiť zníženie ceny?","o":["Ak je nehnuteľnosť na trhu bez odozvy viac ako niekoľko týždňov","Po dvoch obhliadkach bez podpisu zmluvy","Na základe spätnej väzby od záujemcov"],"a":"AC"},{"n":48,"q":"Aké dokumenty sú nutné na začatie predaja nehnuteľnosti?","o":["List vlastníctva a súhlas všetkých podielových spoluvlastníkov","Výpis z obchodného registra predávajúceho","Situačný pôdorys nehnuteľnosti a preukaz energetickej hospodárnosti"],"a":"A"},{"n":49,"q":"Ako má maklér pristupovať k požiadavkám klienta na utajenie predaja?","o":["Zohľadniť požiadavky klienta, no zabezpečiť efektívnu prezentáciu","Zverejniť inzerát bez fotiek exteriéru","Navrhnúť anonymnú formu propagácie"],"a":"AC"},{"n":50,"q":"Kedy je dôležité osloviť advokáta?","o":["Pri príprave zmlúv alebo riešení právnych komplikácií","Po podaní návrhu na kataster","Pri odovzdávaní kľúčov novému majiteľovi"],"a":"A"},{"n":51,"q":"Ktoré tvrdenia charakterizujú komerčné nehnuteľnosti?","o":["Môžu zahŕňať aj nehnuteľnosti na bývanie vlastnené na komerčné účely.","Môžu zahŕňať kancelárske priestory, sklady alebo hotely.","Sú určené výlučne na bývanie vlastníka."],"a":"AB"},{"n":52,"q":"Prečo je lokalita pre realitný trh podstatná?","o":["Lokalita má význam iba pri komerčných nehnuteľnostiach, nie pri bývaní.","Realitný trh má výrazne lokálny charakter, pretože nehnuteľnosť je spätá s lokalitou.","Realitný trh je nezávislý od miesta, kde sa nehnuteľnosť nachádza."],"a":"B"},{"n":53,"q":"Ktoré tvrdenia o zodpovednom zástupcovi platia?","o":["Zodpovedný zástupca nemusí spĺňať odbornú spôsobilosť.","Zodpovedného zástupcu možno ustanoviť iba vtedy, ak podnikateľ už odbornú spôsobilosť spĺňa sám.","Zodpovedný zástupca sa ustanovuje výlučne na účely fotografovania nehnuteľností."],"a":""},{"n":54,"q":"Ktoré činnosti patria medzi typické úlohy realitného makléra?","o":["Vyhľadávanie obchodných príležitostí a komunikácia s klientmi.","Vydávanie rozhodnutí o povolení vkladu do katastra.","Vykonávanie obhliadok nehnuteľností."],"a":"AC"},{"n":55,"q":"Maklér samostatne rokuje s klientmi, určuje predajnú cenu a stratégiu predaja. Čo by mal mať v predmete podnikania?","o":["Realitnú činnosť.","Výlučne reklamné a marketingové služby.","Žiadny predmet podnikania, ak pracuje pre realitnú kanceláriu."],"a":"A"},{"n":56,"q":"Ktoré výhody sú spojené s postavením makléra ako podnikateľa?","o":["Automaticky nižšia zodpovednosť za záväzky.","Vyšší podiel z provízie a väčšia časová flexibilita.","Zákonom garantovaný stabilný mesačný príjem."],"a":"B"},{"n":57,"q":"Ktoré nevýhody môže mať maklér v postavení podnikateľa?","o":["Úplná absencia podnikateľského rizika.","Povinnosť realitnej kancelárie uhrádzať všetky náklady makléra.","Vyššia zodpovednosť a vlastné finančné náklady."],"a":"C"},{"n":58,"q":"Ktoré tvrdenia charakterizujú property management?","o":["Jeho hlavným obsahom je výlučne fotografovanie nehnuteľností na predaj.","Môže zahŕňať kontrolu nájomných zmlúv a ekonomické či administratívne služby.","Ide o dlhodobejšiu komplexnú starostlivosť o nehnuteľnosti klienta."],"a":"BC"},{"n":59,"q":"Čo patrí medzi výhody pracovného pomeru makléra?","o":["Automaticky vyšší podiel z provízie než pri podnikaní.","Stabilnejší príjem a pravidelná práca.","Materiálno-technické zabezpečenie zo strany zamestnávateľa."],"a":"BC"},{"n":60,"q":"Prečo je priebežné vzdelávanie pre makléra dôležité?","o":["Po vstupnom školení už ďalšie vzdelávanie nie je potrebné.","Pomáha reagovať na meniace sa požiadavky trhu a klientov.","Priebežné vzdelávanie znižuje schopnosť makléra prispôsobiť sa novým komunikačným kanálom."],"a":"B"},{"n":61,"q":"Maklér narazí na daňovú otázku, na ktorú nemá príslušné oprávnenie. Ako má postupovať?","o":["Tváriť sa, že otázka s realitným obchodom nesúvisí.","Upozorniť klienta, aby sa poradil s kompetentnou osobou, prípadne mu také poradenstvo sprostredkovať.","Poskytnúť daňové poradenstvo, ak má dostatok praktických skúseností."],"a":"B"},{"n":62,"q":"Ktoré schopnosti pomáhajú maklérovi úspešne obchodovať?","o":["Schopnosť odmietnuť všetky námietky bez diskusie.","Vyhýbanie sa osobnému kontaktu s klientmi.","Komunikačné schopnosti, identifikácia potrieb a psychológia predaja."],"a":"C"},{"n":63,"q":"Prečo je pre makléra dôležitá aspoň základná znalosť realitného práva?","o":["Pomáha identifikovať základné právne vady a rozumieť ich vplyvu na obchod a financovanie.","Právny stav nehnuteľnosti nemá súvis s financovaním kúpy.","Umožňuje maklérovi automaticky nahradiť advokáta pri všetkých právnych službách."],"a":"A"},{"n":64,"q":"Maklér pracuje iba príležitostne popri inom zamestnaní. Ktoré riziká sú s tým spojené?","o":["Ťažšie udržanie prehľadu o trhu a pravidelného vzdelávania.","Problémy s plánovaním práce, motiváciou a pravidelnosťou príjmu.","Dokáže sa vždy prispôsobiť termínom obhliadok navrhnutým klientom."],"a":"AB"},{"n":65,"q":"Ktoré kroky patria do úvodnej časti cyklu realitného obchodu?","o":["Nadviazanie spolupráce.","Podanie daňového priznania kupujúceho ešte pred náborom.","Nábor a zdokumentovanie nehnuteľnosti."],"a":"AC"},{"n":66,"q":"Ktorý krok nasleduje v typickom cykle po rezervácii nehnuteľnosti?","o":["Opätovný nábor tej istej nehnuteľnosti ako povinný krok.","Podpis kúpnej zmluvy, pričom pri úverovom financovaní môžu predchádzať súvisiace úverové úkony.","Automatický prepis médií ešte pred prevodom vlastníctva."],"a":"B"},{"n":67,"q":"Kupujúci financuje kúpu hypotekárnym úverom. Ktoré doplnkové úkony môžu vstúpiť do cyklu?","o":["Podanie návrhu na vklad záložného práva.","Podpis úverovej zmluvy kupujúcim.","Vyhotovenie znaleckého posudku pre banku."],"a":"ABC"},{"n":68,"q":"Ktoré tvrdenia o prvých zákazkách začínajúceho makléra platia?","o":["Prvé zákazky majú prichádzať výlučne od neznámych ľudí mimo jeho okolia.","Po získaní prvej zákazky už maklér nemusí ďalej vyhľadávať obchodné príležitosti.","Oslovenie rodiny, známych a priateľov je zbytočné a materiál ho neodporúča."],"a":""},{"n":69,"q":"Prečo samotný okruh známych nestačí na dlhodobé získavanie zákaziek?","o":["Po oslovení známych už nie je potrebné získavať nové kontakty.","Referencie úplne nahrádzajú pravidelnú náborovú aktivitu.","Dlhodobý úspech vyžaduje systematickú aktivitu a širšie marketingové pôsobenie."],"a":"C"},{"n":70,"q":"Ktoré aktivity patria medzi offline spôsoby získavania zákaziek?","o":["Výlučne platená reklama vo vyhľadávači.","Len automatické párovanie dopytov v informačnom systéme.","Door knocking (oslovenie vlastníkov v teréne), osobné rozhovory, letáky a vizitky."],"a":"C"},{"n":71,"q":"Čo je cold call?","o":["Povinný telefonát na kataster pred každou obhliadkou.","Telefonát klientovi po ukončení obchodu.","Kontaktovanie potenciálneho klienta bez predchádzajúceho kontaktu."],"a":"C"},{"n":72,"q":"Aký ďalší prínos môže mať cold calling pre začínajúceho makléra okrem samotného náboru?","o":["Zaručenie kvalitných exkluzívnych zákaziek pri každom telefonáte.","Tréning komunikácie, prekonávania námietok a oslovovania neznámych ľudí.","Nahradenie potreby poznať lokalitu."],"a":"B"},{"n":73,"q":"Čo je real estate farming?","o":["Sústredenie marketingových aktivít makléra na konkrétnu lokalitu s cieľom dlhodobo sa v nej zviditeľniť.","Správa poľnohospodárskej pôdy pre vlastníka.","Jednorazové rozposlanie inzerátu do celého štátu bez lokálneho zamerania."],"a":"A"},{"n":74,"q":"Ktoré informácie by mal maklér poznať o lokalite, v ktorej pôsobí?","o":["Len školenie o pôdorysoch bytov v realitnej kancelárii.","Dopravu, služby, školstvo, cenový vývoj a budúcu výstavbu v lokalite.","Len názov obce, ulíc a PSČ."],"a":"B"},{"n":75,"q":"Začínajúci maklér si vyberá nehnuteľnosť pre svoj prvý obchod. Ktorá voľba je najvhodnejšia?","o":["Náročný komerčný objekt s viacerými právnymi problémami.","Starší typizovaný byt.","Rodinný dom na vidieku."],"a":"B"},{"n":76,"q":"Čo je dôležitejšie než samotný počet nehnuteľností v portfóliu makléra?","o":["Čo najvyšší počet inzerátov bez ohľadu na kvalitu.","Počet vizitiek rozdaných pri nábore.","Predajný potenciál, kvalita a konkurencieschopnosť zákaziek."],"a":"C"},{"n":77,"q":"Maklér má priveľa zákaziek a prestáva mať prehľad o detailoch. Čo by mal pri hodnotení portfólia sledovať?","o":["Len počet fotografií pri každom inzeráte.","Trh, aktuálnu cenu a čas aktívnej inzercie.","Prístup predávajúceho a potenciál zákazky."],"a":"BC"},{"n":78,"q":"Prečo je písomná sprostredkovateľská zmluva dôležitá pre klienta?","o":["Zaručuje, že nehnuteľnosť sa vždy predá za pôvodne požadovanú cenu.","Odstraňuje potrebu informovať klienta o rozsahu služby.","Jasne definuje práva a povinnosti a pomáha klientovi preukázať jeho nároky."],"a":"C"},{"n":79,"q":"O ktorých podmienkach môže maklér pri zazmluvnení klienta rokovať?","o":["O obsahu služby a pláne predaja alebo propagácie.","O zmene právoplatného rozhodnutia katastra.","O výške provízie a predajnej cene."],"a":"AC"},{"n":80,"q":"Ktoré tvrdenie platí pre nevýhradnú sprostredkovateľskú zmluvu?","o":["Klient nesmie nehnuteľnosť predať bez účasti jedinej realitnej kancelárie.","Vždy sa uzatvára na dobu určitú ako podmienka exkluzivity.","Klient môže využiť aj iné realitné spoločnosti alebo predať nehnuteľnosť svojpomocne."],"a":"C"},{"n":81,"q":"Prečo môže byť exkluzívna spolupráca výhodná pre realitnú kanceláriu aj klienta?","o":["Klient automaticky stráca právo na informácie o priebehu predaja.","Maklér môže lepšie kontrolovať ponuky a jednotnosť ceny.","RK má väčšiu istotu, že investovaný čas a peniaze neznehodnotí konkurenčný predaj."],"a":"BC"},{"n":82,"q":"Ktoré tvrdenia o určovaní provízie realitnej kancelárie platia?","o":["Províziu neurčuje realitná kancelária.","Výšku provízie vždy určuje zákon pevnou sadzbou.","Provízia musí byť v každom prípade presne 5 % z ceny nehnuteľnosti."],"a":""},{"n":83,"q":"Prečo sa môže pri lacnejšej, ale náročnej zákazke dohodnúť vyššia provízia?","o":["Pri lacnej nehnuteľnosti províziu vždy automaticky zvyšuje kataster.","Výška provízie nezávisí od rozsahu a náročnosti poskytovanej služby.","Náklady a náročnosť prípadu môžu byť nehladiac na cenu nehnuteľnosti relatívne vysoké."],"a":"C"},{"n":84,"q":"Klient spochybňuje výšku provízie. Čo by mal maklér urobiť?","o":["Bez vysvetlenia automaticky znížiť províziu.","Tvrdíť, že klient nemá právo poznať rozsah služby.","Názorne vysvetliť rozsah a kvalitu služby a konkrétne aktivity, ktoré ju tvoria."],"a":"C"},{"n":85,"q":"Čo patrí do prípravy makléra na náborové stretnutie?","o":["Trhová analýza ceny a prehľad o lokalite.","Tlačivá, pracovné listy, referencie a ďalšie podklady potrebné na stretnutie.","List vlastníctva a katastrálna mapa."],"a":"ABC"},{"n":86,"q":"Ako je vhodné časovo pristúpiť k náborovému stretnutiu?","o":["Prísť včas, ideálne s určitým predstihom.","Termín si možno tesne pred odchodom potvrdiť.","Príchod s výrazným meškaním je vhodný spôsob, ako otestovať klienta."],"a":"AB"},{"n":87,"q":"Čo sa maklér snaží zistiť v úvodnom rozhovore s klientom?","o":["Výlučne hlučnosť susedov.","Motiváciu klienta a dôvody predaja.","Predchádzajúce skúsenosti s predajom a jeho výsledok."],"a":"BC"},{"n":88,"q":"Na čo slúži pracovný list nehnuteľnosti?","o":["Na systematické zaznamenanie údajov potrebných pre ďalšie spracovanie zákazky.","Ako podklad pre prípravu inzerátu.","Ako náhrada rozhodnutia katastra o vlastníctve."],"a":"AB"},{"n":89,"q":"Ktoré podklady môžu pomôcť pri vypĺňaní pracovného listu bytu?","o":["Výlučne ústny odhad suseda bez dokladov.","Len marketingový slogan pripravovaného inzerátu.","Mesačný zálohový predpis, titul nadobudnutia a ďalšia dostupná dokumentácia."],"a":"C"},{"n":90,"q":"Maklér pripravuje pracovný list rodinného domu. Ktoré dokumenty si môže vyžiadať na nahliadnutie?","o":["Stavebné povolenia a kolaudačné rozhodnutia.","Geometrické plány.","Len mesačný predpis správcu bytového domu ako jediný povinný podklad."],"a":"AB"},{"n":91,"q":"Prečo má maklér pri náborovom stretnutí hovoriť aj o vadách nehnuteľnosti?","o":["Otvorená diskusia pomáha realisticky nastaviť podmienky predaja.","Vady môžu ovplyvniť cenu a argumentáciu budúcich kupujúcich.","Vady sa majú vždy zatajiť až do podpisu kúpnej zmluvy."],"a":"AB"},{"n":92,"q":"Čo je východiskom CMA analýzy?","o":["Rozhodnutie správcu bytového domu o predajnej cene.","Historické ceny nehnuteľností v lokalite bez aktuálnych.","Porovnanie podobných nehnuteľností na aktuálnom trhu v danej lokalite."],"a":"C"},{"n":93,"q":"Ktoré vlastnosti bytu môžu znižovať jeho cenu?","o":["Možnosť bezproblémového hypotekárneho financovania vždy znižuje cenu.","Absencia výťahu, balkóna alebo nevhodná dispozícia môžu znižovať cenu.","Každý byt na najvyššom podlaží musí mať zo zákona rovnakú cenu ako byt na inom podlaží."],"a":"B"},{"n":94,"q":"Prečo môže nemožnosť použiť nehnuteľnosť ako záloh znižovať jej cenu?","o":["Zmenšuje okruh kupujúcich, ktorí ju môžu financovať hypotékou.","Automaticky ruší vlastnícke právo predávajúceho.","Nižší počet potenciálnych záujemcov môže vytvárať tlak na cenu."],"a":"AC"},{"n":95,"q":"Maklér vidí, že na trhu rastú ceny a zákazka má silný potenciál. Čo môže klientovi navrhnúť?","o":["Primerané zvýšenie ceny, ak to odôvodňuje trend trhu.","Neetické precenenie bez ohľadu na trh.","Zatajenie všetkých informácií o konkurenčných ponukách."],"a":"A"},{"n":96,"q":"Prečo má maklér pri nevýhradnej zákazke sledovať aj inzerciu vlastníka a konkurenčných kancelárií?","o":["Aby mal prehľad o zmenách ceny tej istej nehnuteľnosti.","Aby vedel reagovať na cenovú rôznorodosť a udržať prehľad o trhu.","Aby mohol bez súhlasu klienta meniť cenu nehnuteľnosti v inzercii."],"a":"AB"},{"n":97,"q":"Na čom je vhodné dohodnúť sa s klientom ešte pred začatím obhliadok?","o":["Na možnostiach víkendových obhliadok.","Na vhodných termínoch obhliadok počas týždňa.","Na prípadnom prevzatí kľúčov na základe písomného záznamu."],"a":"ABC"},{"n":98,"q":"Aká je vhodná úloha vlastníka počas obhliadky vedenej maklérom?","o":["V každej miestnosti aktívne rokovať so záujemcom o cene.","Nechať makléra viesť obhliadku a zbytočne do nej nezasahovať.","Poskytovať záujemcovi svoje kontaktné údaje bez ohľadu na dohodu s maklérom."],"a":"B"},{"n":99,"q":"Prečo je obhliadka bez prítomnosti vlastníka často výhodná?","o":["Pretože vlastník pri nej automaticky stráca právo na informácie o priebehu obhliadky.","Záujemca môže byť otvorenejší a menej nervózny.","Maklér môže lepšie zisťovať názory a potreby záujemcu."],"a":"BC"},{"n":100,"q":"Prečo realitná kancelária eviduje osoby, ktorým poskytla neverejné informácie alebo umožnila vstup do nehnuteľnosti?","o":["Evidencia slúži výlučne na určovanie dane z nehnuteľnosti.","Evidencia prispieva k bezpečnosti a ochrane majetku klienta.","Klient má prehľad, koho a kedy kancelária zabezpečila."],"a":"BC"},{"n":101,"q":"Aký je základný cieľ homestagingu?","o":["Zatraktívniť nehnuteľnosť s relatívne nízkymi nákladmi.","Vždy vykonať kompletnú rekonštrukciu pred predajom.","Pripraviť priestor tak, aby oslovil čo najširší okruh záujemcov."],"a":"AC"},{"n":102,"q":"Prečo sa pri homestagingu odporúča odstrániť nadbytočný nábytok a osobné predmety?","o":["Aby nebolo možné rozoznať vady miestností.","Nehnuteľnosť stráca výraznú pečať pôvodného majiteľa a pôsobí univerzálnejšie.","Priestor môže pôsobiť väčší a vzdušnejší."],"a":"BC"},{"n":103,"q":"Ako môžu farby ovplyvniť vnímanie priestoru?","o":["Svetlé farby môžu priestor opticky zväčšiť.","Farby nemajú na vnímanie veľkosti priestoru žiadny vplyv.","Tmavé farby môžu miestnosť opticky zmenšovať."],"a":"AC"},{"n":104,"q":"Prečo je vhodné pred obhliadkami opraviť drobné závady?","o":["Znižujú negatívny dojem a obmedzujú argumenty kupujúceho na znižovanie ceny.","Môžu u kupujúceho vyvolať pochybnosti o ďalších skrytých problémoch.","Drobné závady vždy zvyšujú dôveru kupujúceho."],"a":"AB"},{"n":105,"q":"Predávajúci chce pred predajom uskutočniť drahú rekonštrukciu podľa vlastného vkusu. Aké odporúčanie je primerané?","o":["Vždy investovať do kompletnej rekonštrukcie bez ohľadu na cenu a cieľovú skupinu.","Uprednostniť nenáročné úpravy a opravu nefunkčných prvkov.","Zvážiť, či sa rozsiahla rekonštrukcia vôbec vyplatí, pretože nemusí zodpovedať vkusu kupujúceho."],"a":"BC"},{"n":106,"q":"Ako možno pri homestagingu pripraviť finálnu scénu miestnosti?","o":["Zútulniť priestor drobnými prvkami, ktoré podporia dojem domova.","Zaplniť každú voľnú plochu osobnými vecami pôvodného majiteľa.","Použiť dekorácie, textílie, vhodné osvetlenie alebo čerstvé kvety."],"a":"AC"},{"n":107,"q":"Aký je rozdiel medzi dokumentačnými a prezentačnými fotografiami?","o":["Prezentačné fotografie sa pripravujú zodpovednejšie pre verejnú propagáciu.","Dokumentačné fotografie zachytávajú aj detaily, vady a technické prvky pre potrebu makléra.","Každá dokumentačná fotografia musí byť automaticky zverejnená v inzeráte."],"a":"AB"},{"n":108,"q":"Prečo maklér fotografuje nehnuteľnosť už počas náborového stretnutia aj vtedy, keď neskôr príde profesionálny fotograf?","o":["Profesionálny fotograf podľa materiálu nikdy nesmie fotografovať nehnuteľnosť po maklérovi.","Fotografie mu pomáhajú nezabudnúť na detaily nehnuteľnosti.","Potrebuje okamžitú dokumentáciu na prípravu podkladov."],"a":"BC"},{"n":109,"q":"Ktoré tvrdenia o technike na fotografovanie interiérov platia?","o":["Možnosť výmeny objektívu je pri vhodnom fotoaparáte vždy nevýhodou.","Širokouhlý objektív je pri interiéroch nevhodný, pretože zachytí priveľa priestoru.","Pre malé miestnosti je jedinou vhodnou voľbou silný teleobjektív."],"a":""},{"n":110,"q":"Na čo možno používať program na úpravu fotografií bez skresľovania reality nehnuteľnosti?","o":["Na odstránenie osobných fotografií, evidenčných značiek alebo osôb zo záberu.","Na orezanie, úpravu jasu, ostrosti alebo vyváženia bielej.","Na odstránenie zjavných vád nehnuteľnosti tak, aby kupujúci o nich nevedel."],"a":"AB"},{"n":111,"q":"Čo je vhodné urobiť pred samotným fotografovaním interiéru?","o":["Upozorniť vlastníka a požiadať ho o súhlas s fotografovaním.","Upratať scénu a odstrániť rušivé či osobné predmety.","Zámerne ponechať neporiadok, aby fotografie pôsobili autentickejšie."],"a":"AB"},{"n":112,"q":"Ako je vhodné komponovať hlavný objekt fotografie?","o":["Horizontálne a vertikálne línie sú pri fotografii nehnuteľnosti nepodstatné.","Nemusí byť presne v strede; vhodné je excentrickejšie umiestnenie.","Treba dbať na zachovanie línií a na to, aby objekt opticky nepadal."],"a":"BC"},{"n":113,"q":"Čo pomáha pri fotografovaní interiéru s výrazným protisvetlom?","o":["Zvýšenie intenzity protisvetla.","Kontrola kontrastu medzi oknom a interiérom.","Vhodné použitie blesku alebo úprava svetelných podmienok."],"a":"BC"},{"n":114,"q":"Ktoré odporúčania platia pri fotografovaní nehnuteľností?","o":["Dávať pozor na odrazy v zrkadlách.","Preferovať fotografie na šírku.","Mazanie fotografií z karty priamo počas fotenia je vždy odporúčaný postup."],"a":"AB"},{"n":115,"q":"Prečo je pri dlhšom expozičnom čase dôležitý statív?","o":["Pomáha dosiahnuť ostrú fotografiu pri slabom osvetlení.","Jeho hlavnou funkciou je zmeniť farbu svetla v miestnosti.","Obmedzuje pohyb fotoaparátu počas expozície."],"a":"AC"},{"n":116,"q":"Maklér fotografuje exteriér domu za slnečného dňa. Aké svetlo je vhodnejšie pre plastický dojem?","o":["Bočné svetlo, ktoré vytvára objem a plasticitu.","Úplná tma bez doplnkového osvetlenia.","Priame svetlo spoza fotografa ako jediná ideálna možnosť."],"a":"A"},{"n":117,"q":"Ktoré tvrdenia o virtuálnych prehliadkach platia?","o":["Maklér si virtuálnu prehliadku nemôže pripraviť vo vlastnej réžii.","Virtuálnu prehliadku môže vytvoriť iba profesionálny dodávateľ.","Virtuálna prehliadka sa nesmie zobraziť na webe realitnej kancelárie."],"a":""},{"n":118,"q":"Ako môže maklér vytvoriť jednoduchšiu virtuálnu prehliadku vo vlastnej réžii?","o":["Použiť dostupný mobil alebo 360-stupňovú kameru, ak to zvolený postup umožňuje.","Nahradiť všetky fotografie iba textovým opisom miestností.","Vytvoriť 360-stupňové fotografie miestností a spojiť ich vhodnou aplikáciou."],"a":"AC"},{"n":119,"q":"Odkiaľ môže maklér získať pôdorys nehnuteľnosti?","o":["Z databáz alebo dokumentácie od predávajúceho.","Pôdorys možno získať iba zo znaleckého posudku.","Môže si pripraviť vlastný nákres so zameraním."],"a":"AC"},{"n":120,"q":"Maklér nemá k dispozícii žiadny existujúci pôdorys. Ako môže postupovať?","o":["Zmerať rozmery ručne nakresliť ho v grafickom programe.","Nehnuteľnosť nemožno bez pôvodného pôdorysu vôbec ponúknuť.","Zamerať rozmery laserovým meračom a pripraviť vlastný náčrt."],"a":"AC"},{"n":121,"q":"Ktoré činnosti vykonáva maklér pri príprave zákazky na propagáciu?","o":["Vytvára a ukladá zložku zákazky a pripravuje plán aktivít.","Kontroluje podklady a právny či faktický stav.","Upravuje mediálne podklady a pripravuje text inzerátu."],"a":"ABC"},{"n":122,"q":"Aké údaje sa pri založení zákazky zaznamenávajú do informačného systému realitnej kancelárie?","o":["Údaje o nehnuteľnosti a klientovi.","Cena, provízia, druh a expirácia zmluvy.","Text inzerátu, fotografie, videá alebo dokumenty súvisiace so zákazkou."],"a":"ABC"},{"n":123,"q":"Čo by mal kvalitný text inzerátu zdôrazniť?","o":["Silné a jedinečné stránky nehnuteľnosti pretavené do výhod pre budúceho vlastníka.","Najmä slang, superlatívy a skratky bez vysvetlenia.","Informácie, ktoré vysvetlia hodnotu alebo špecifiká nehnuteľnosti."],"a":"AC"},{"n":124,"q":"Prečo môže byť nevhodná formulácia typu „zľava pri rýchlom jednaní“?","o":["Môže vytvoriť dojem tiesne predávajúceho.","Vždy automaticky zvýši predajnú cenu.","Môže povzbudiť záujemcu k výraznejšiemu vyjednávaniu o cene."],"a":"AC"},{"n":125,"q":"Čo je párovanie ponuky a dopytu?","o":["Automatické určovanie provízie podľa počtu fotografií.","Proces, pri ktorom maklér identifikuje vhodné ponuky nehnuteľností pre klienta - kupujúceho.","Vyhľadávanie zhody medzi ponúkanými nehnuteľnosťami a evidovanými požiadavkami záujemcov."],"a":"BC"},{"n":126,"q":"Ako má vyzerať kvalitný plán predaja?","o":["Má obsahovať iba všeobecné frázy bez dátumov a zodpovednosti.","Môže byť pripravený po týždňoch na niekoľkotýždňové obdobie.","Obsahuje konkrétne činnosti a termíny ich realizácie."],"a":"BC"},{"n":127,"q":"Nehnuteľnosť sa ani po realizácii plánu predaja nepredala a záujem je nízky. Čo má maklér analyzovať?","o":["Počet reakcií, obhliadok a spätnú väzbu trhu.","Primeranosť ceny voči konkurenčným ponukám.","Iba úpravu fotiek nehnuteľnosti."],"a":"AB"},{"n":128,"q":"Aký je rozdiel medzi personálnym marketingom makléra a marketingom zákazky?","o":["Marketing zákazky je zameraný na konkrétnu nehnuteľnosť a jej predaj alebo prenájom.","Medzi týmito dvoma formami marketingu nie je žiadny rozdiel.","Personálny marketing prezentuje makléra a jeho služby."],"a":"AC"},{"n":129,"q":"Čo by si mal maklér pred obhliadkou zopakovať zo zložky zákazky?","o":["Výsledky predchádzajúcich obhliadok a časté námietky.","Iba svoje osobné poznámky nesúvisiace s nehnuteľnosťou.","Interné údaje zákazky a poslednú komunikáciu s klientom."],"a":"AC"},{"n":130,"q":"Ktoré podklady môžu byť užitočné pri obhliadke bytu?","o":["Informačný leták, prípadné propagačné materiály a protokol o obhliadke.","List vlastníctva a pôdorys s rozmermi.","Informácie o nákladoch na užívanie a o lokalite."],"a":"ABC"},{"n":131,"q":"Ako má maklér postupovať tesne pred obhliadkou prázdnej nehnuteľnosti?","o":["Vyvetrať a podľa potreby zapnúť osvetlenie či doplniť jednoduché dekorácie.","Prísť až po záujemcovi, aby neovplyvnil jeho prvý dojem.","Prísť s predstihom, nehnuteľnosť skontrolovať a pripraviť."],"a":"AC"},{"n":132,"q":"Aký je hlavný účel samotnej obhliadky?","o":["Fyzicky predstaviť nehnuteľnosť tak, aby si záujemca vytvoril reálnu predstavu.","Poskytnúť relevantné informácie a umožniť záujemcovi priestor na posúdenie nehnuteľnosti.","Žiadať o rýchle rozhodnutie o kúpe."],"a":"AB"},{"n":133,"q":"Ktoré informácie môže maklér počas obhliadky zisťovať o záujemcovi?","o":["Výlučne politické a náboženské názory záujemcu.","Čo hľadá a aké má preferencie.","Ako dlho nehnuteľnosť hľadá a akú má predstavu o spôsobe úhrady."],"a":"BC"},{"n":134,"q":"Prečo nemá vlastník počas obhliadky nekvalifikovane zasahovať do prezentácie?","o":["Maklér môže stratiť kontrolu nad tokom poskytovaných informácií.","Pretože vlastník je kompetentnejší ako maklér.","Môže odradiť záujemcu alebo vyvolať predčasné zjednávanie ceny."],"a":"AC"},{"n":135,"q":"Maklér prezentuje rovnakú nehnuteľnosť dvom odlišným záujemcom. Má byť jeho komentár úplne identický?","o":["Nie nevyhnutne; môže zdôrazniť výhody podľa potrieb konkrétnych záujemcov.","Má byť pravdivý a nemá sa vyhýbať ani vadám nehnuteľnosti.","Áno, musí použiť doslova rovnaké vety bez ohľadu na potreby záujemcu."],"a":"AB"},{"n":136,"q":"Čo je úlohou makléra pri rokovaní o kúpnej cene po prejavení záujmu o nehnuteľnosť?","o":["Pomocou vhodných vyjednávacích techník priblížiť predstavy kupujúceho a predávajúceho.","Bez súhlasu strán jednostranne určiť konečnú kúpnu cenu.","Zohľadňovať aj ďalšie podmienky, napríklad vypratanie alebo spôsob úhrady."],"a":"AC"},{"n":137,"q":"Čo signalizuje zloženie rezervačnej zálohy?","o":["Kupujúci sa tým automaticky stáva vlastníkom nehnuteľnosti.","Seriózny záujem kupujúceho a jeho solventnosť.","Kupujúci si zabezpečuje, že nehnuteľnosť bude prednostne prevedená do jeho vlastníctva."],"a":"BC"},{"n":138,"q":"Ako je vhodné postupovať s ďalšou časťou kúpnej ceny nad rámec primeranej rezervačnej zálohy?","o":["Vždy ju ponechať v hotovosti u makléra až do odovzdania nehnuteľnosti.","Nevystavovať realitnú kanceláriu zbytočnému riziku finančných transakcií klientov.","Využiť notársku, advokátsku alebo bankovú úschovu."],"a":"BC"},{"n":139,"q":"Čo ovplyvňuje časovú náročnosť prípravy zmluvnej dokumentácie?","o":["Vyčíslenie zostatkov dlhov alebo riešenie ďalších právnych okolností.","Schvaľovanie hypotekárneho úveru.","Potreba zosynchronizovať viacero súvisiacich úkonov pred podpisom zmlúv."],"a":"ABC"},{"n":140,"q":"Ktoré podklady sa bežne pripravujú pre zmluvnú dokumentáciu?","o":["Informácie o úhrade kúpnej ceny a podľa potreby potvrdenie správcu.","Výlučne marketingový slogan nehnuteľnosti.","Údaje účastníkov, údaje o nehnuteľnosti a titul nadobudnutia."],"a":"AC"},{"n":141,"q":"Právny zástupca jednej zo strán pripravil návrh kúpnej zmluvy. Ako má realitná kancelária postupovať?","o":["Automaticky návrh akceptovať bez akejkoľvek kontroly.","Dať návrh kriticky posúdiť spolupracujúcemu advokátovi.","Sledovať, aby bola zmluva vyvážená a bezpečná pre obe strany."],"a":"BC"},{"n":142,"q":"Čo má maklér skontrolovať pred cestou na podpis kúpnej zmluvy?","o":["Pripravené zmluvy a návrhy na vklad.","Len stav batérie svojho telefónu, dokumenty kontrolovať nemusí.","Potrebné prílohy a správny počet vyhotovení listín."],"a":"AC"},{"n":143,"q":"Čo môže nasledovať po podpise kúpnej zmluvy?","o":["Kupujúci sa podpisom zmluvy vždy okamžite stáva vlastníkom nehnuteľnosti.","Podanie listín na príslušný katastrálny odbor.","Pri úschove môže maklér sledovať splnenie jej podmienok a priebeh katastrálneho konania."],"a":"BC"},{"n":144,"q":"Ktoré úkony patria do definitívneho ukončenia realitného obchodu po prevode vlastníctva?","o":["Vyhotovenie preberacieho protokolu.","Prepis médií a riešenie správcu alebo spoločenstva vlastníkov.","Alternatívne aj pomoc pri procese podania daňového priznania v súvislosti s nadobudnutou nehnuteľnosťou."],"a":"ABC"},{"n":145,"q":"Čo je vhodné zaznamenať v preberacom protokole?","o":["Fotodokumentáciu možno pripojiť ako prílohu protokolu.","Odovzdané kľúče, vybavenie a prípadné zjavné vady.","Stavy meračov energií a vody."],"a":"ABC"},{"n":146,"q":"Kedy je vhodné vykonať prepis elektrickej energie pri odovzdávaní nehnuteľnosti?","o":["Pri prepise sú potrebné údaje predávajúceho aj kupujúceho, ak sa predávajúci už skôr neodhlásil.","Hneď po podpise preberacieho protokolu môže byť praktické riešiť zmenu odberateľa.","Prepis elektriny sa môže vykonať iba rozhodnutím katastra bez účasti odberateľov."],"a":"AB"},{"n":147,"q":"Kedy sa nový vlastník bytu prihlási u správcu bytového domu alebo SVB?","o":["Povinnosť sa vzťahuje rovnako na každý rodinný dom bez správcu.","Keď sa pôvodný vlastník odhlási zo správy bytu.","Po nadobudnutí vlastníckeho práva povolením vkladu."],"a":"BC"},{"n":148,"q":"Kupujúci nadobudol nehnuteľnosť kúpou počas roka. Dokedy má podať priznanie k dani z nehnuteľností?","o":["Do troch dní od prvej obhliadky.","V deň podpisu rezervačnej zmluvy.","Do 31. januára nasledujúceho roka."],"a":"C"},{"n":149,"q":"Prečo je vhodné udržiavať kontakt s bývalými klientmi?","o":["Pravidelný primeraný kontakt pomáha maklérovi zostať v povedomí.","Môžu byť zdrojom ďalších zákaziek a informácií.","Pripomienkové kampane môžu podporovať jeho viditeľnosť v lokalite."],"a":"ABC"},{"n":150,"q":"Ako môže maklér pracovať s referenčným potenciálom bývalých klientov?","o":["Kontaktovať ich čo najčastejšie bez ohľadu na frekvenciu a formu komunikácie.","Kontaktovať ich primeranou formou v rámci pripomienkových kampaní.","Informovať sa u nich aj o nehnuteľnostiach, ktoré aktuálne vyhľadáva."],"a":"BC"}]}];

/* ---------- storage (best effort) ---------- */
const KEY = "rk-karticky-v1";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { progress = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} }
function prog(id){ return progress[id] || (progress[id] = {}); }
const PREFS_KEY = "rk-karticky-prefs";
let prefs = { shuffle:false };
try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREFS_KEY) || "{}")); } catch (e) {}
function savePrefs(){ try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {} }

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LET = ["A","B","C"];
const fmtAns = a => a ? a.split("").join(", ") : "žiadna";

function counts(t){
  const p = prog(t.id); let k=0,u=0;
  for (const q of t.questions){ if (p[q.n]===1) k++; else if (p[q.n]===0) u++; }
  return {k,u,n:t.questions.length-k-u,total:t.questions.length};
}

/* ---------- HOME ---------- */
let openTest = null, chosenMode = {};
function renderHome(){
  const home = $("#home");
  let h = `<p class="brand">Realitný maklér · 2026</p>
    <h1 id="h1">Kartičky na testy</h1>
    <p class="lead">Vyber test, ťukni na možnosti, ktoré považuješ za správne, a odkry odpoveď. Ohodnoť sa „Viem / Neviem“ a k neisto zvládnutým sa vráť neskôr.</p>
    <div class="tests">`;
  for (const t of DATA){
    const c = counts(t), mode = chosenMode[t.id] || "all";
    const pct = x => (x / c.total * 100).toFixed(2) + "%";
    h += `<div class="test">
      <button class="test-head" data-open="${t.id}" aria-expanded="${openTest===t.id}">
        <div class="test-name">${esc(t.name)}</div>
        <div class="test-meta"><span><b>${c.total}</b> otázok</span><span>viem <b>${c.k}</b></span><span>neviem <b>${c.u}</b></span><span>nevidené <b>${c.n}</b></span></div>
        <div class="bar" aria-hidden="true"><i class="k" style="width:${pct(c.k)}"></i><i class="u" style="width:${pct(c.u)}"></i></div>
      </button>`;
    if (openTest === t.id){
      const opt = (m,label,n) => `<button class="chip" data-mode="${m}" data-t="${t.id}" aria-pressed="${mode===m}" ${n? "":"disabled"}>${label} (${n})</button>`;
      h += `<div class="setup">
        <div class="chips" role="group" aria-label="Ktoré kartičky">
          ${opt("all","Všetky",c.total)}${opt("unknown","Neviem",c.u)}${opt("unseen","Nevidené",c.n)}${opt("notknown","Neviem + nové",c.u+c.n)}
        </div>
        <div class="row">
          <button class="toggle" id="shuf" aria-pressed="${prefs.shuffle}"><span class="sw"></span>Zamiešať poradie</button>
          <button class="btn btn-primary" data-start="${t.id}">Začať</button>
        </div>
        <div><button class="link" data-reset="${t.id}">Vymazať pokrok tohto testu</button></div>
      </div>`;
    }
    h += `</div>`;
  }
  h += `</div><p class="foot">Pokrok sa ukladá len v tomto prehliadači. Na iPhone: Zdieľať → Pridať na plochu, a kartičky sa otvoria ako aplikácia.</p>`;
  home.innerHTML = h;
}
$("#home").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.open){ openTest = openTest === b.dataset.open ? null : b.dataset.open; renderHome(); return; }
  if (b.dataset.mode){ chosenMode[b.dataset.t] = b.dataset.mode; renderHome(); return; }
  if (b.id === "shuf"){ prefs.shuffle = !prefs.shuffle; savePrefs(); renderHome(); return; }
  if (b.dataset.reset){
    const t = DATA.find(x => x.id === b.dataset.reset);
    if (confirm(`Vymazať pokrok testu „${t.name}“?`)){ progress[t.id] = {}; save(); renderHome(); }
    return;
  }
  if (b.dataset.start){ startSession(b.dataset.start, chosenMode[b.dataset.start] || "all", prefs.shuffle); }
});

/* ---------- SESSION ---------- */
let S = null;
function shuffleArr(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startSession(id, mode, shuffle){
  const t = DATA.find(x => x.id === id); if (!t) return;
  const p = prog(id);
  let idx = t.questions.map((q,i)=>i).filter(i => {
    const v = p[t.questions[i].n];
    return mode==="all" || (mode==="unknown" && v===0) || (mode==="unseen" && v===undefined) || (mode==="notknown" && v!==1);
  });
  if (!idx.length) idx = t.questions.map((q,i)=>i);
  if (shuffle) shuffleArr(idx);
  S = { t, order: idx, pos: 0, revealed: false, sel: new Set(), graded: {} , mode };
  if (location.hash !== "#" + id) history.pushState(null, "", "#" + id);
  show("study"); renderCard();
}
function show(which){
  $("#home").classList.toggle("hidden", which !== "home");
  $("#study").classList.toggle("hidden", which !== "study");
  if (which === "home"){ renderHome(); window.scrollTo(0,0); }
}
function goHome(){ S = null; if (location.hash) history.pushState(null, "", location.pathname + location.search); show("home"); }
$("#back").onclick = goHome;
window.addEventListener("popstate", () => {
  const id = location.hash.slice(1);
  if (id && DATA.some(t => t.id === id)) { if (!S || S.t.id !== id) startSession(id, "all", false); }
  else { S = null; show("home"); }
});
$("#shuffleNow").onclick = () => {
  if (!S || S.done) return;
  const rest = S.order.slice(S.pos + 1); shuffleArr(rest);
  S.order = S.order.slice(0, S.pos + 1).concat(rest);
  flash("Zostávajúce kartičky zamiešané");
};
function flash(msg){
  const h = $("#hintLine"); if (h){ h.textContent = msg; setTimeout(()=>{ if (h.isConnected) h.textContent = defaultHint(); }, 1600); }
}
const isTouch = matchMedia("(hover:none)").matches;
const defaultHint = () => isTouch ? "Potiahni doľava / doprava pre ďalšiu / predchádzajúcu kartičku" : "Klávesy: A B C výber · medzerník odkryť · N neviem · V viem · ← →";

function curQ(){ return S.t.questions[S.order[S.pos]]; }
function renderTop(){
  const total = S.order.length;
  $("#tTitle").textContent = S.t.name;
  $("#tSub").textContent = S.done ? `Hotovo · ${total} kartičiek` : `Kartička ${S.pos+1} / ${total}`;
  $("#tBar").style.width = ((S.done ? total : S.pos) / total * 100) + "%";
}
function renderCard(dir){
  renderTop();
  const q = curQ(), p = prog(S.t.id)[q.n];
  const ans = q.a, rev = S.revealed;
  let opts = "";
  q.o.forEach((txt,i) => {
    const L = LET[i], isAns = ans.includes(L), isSel = S.sel.has(L);
    let cls = "opt", mark = "";
    if (rev){
      if (isAns){ cls += " ok"; mark = isSel ? "✓" : "✓"; }
      else if (isSel){ cls += " bad"; mark = "✗"; }
      else cls += " dim";
    } else if (isSel) cls += " sel";
    opts += `<button class="${cls}" data-opt="${L}" aria-pressed="${isSel}" ${rev ? 'tabindex="-1"' : ""}>
      <span class="L">${L}</span><span class="T">${esc(txt)}</span>${mark ? `<span class="mark" aria-hidden="true">${mark}</span>` : ""}</button>`;
  });
  let answer = "";
  if (rev){
    let verdict = "";
    if (S.sel.size){
      const mine = [...S.sel].sort().join("");
      verdict = mine === ans ? `<span class="v-ok">Tvoja odpoveď je správna.</span> ` : `<span class="v-bad">Tvoja odpoveď (${fmtAns(mine)}) nie je správna.</span> `;
    }
    answer = `<div class="answer">${verdict}${ans ? `Správna odpoveď: <b>${fmtAns(ans)}</b>` : `<b>Ani jedna z možností nie je správna.</b>`}</div>`;
  }
  const st = p===1 ? `<span class="status k">viem</span>` : p===0 ? `<span class="status u">neviem</span>` : `<span class="status">nová</span>`;
  $("#mainArea").innerHTML = `<article class="card ${rev ? "revealed" : ""} ${dir ? "" : "enter"}" id="card">
      <div class="card-meta"><span class="qnum">OTÁZKA ${q.n}</span>${st}</div>
      ${q.s ? `<div class="sec">${esc(q.s)}</div>` : ""}
      <h2 class="q">${esc(q.q)}</h2>
      <div class="opts">${opts}</div>
      ${answer}
    </article>
    <p class="hint" id="hintLine">${defaultHint()}</p>`;
  if (!dir) $("#mainArea").scrollTop = 0;
  renderCtrl();
}
function renderCtrl(){
  const prev = `<button class="nav" id="prev" aria-label="Predchádzajúca" ${S.pos===0 ? "disabled":""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>`;
  const next = `<button class="nav" id="next" aria-label="Preskočiť / ďalšia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>`;
  let mid;
  if (!S.revealed){
    mid = `<button class="big primary grow" id="reveal">Ukázať odpoveď <span class="kbd">␣</span></button>`;
  } else {
    let sug = "";
    if (S.sel.size) sug = [...S.sel].sort().join("") === curQ().a ? "yes" : "no";
    mid = `<button class="big no grow ${sug==="no"?"sugg":""}" id="gNo">Neviem <span class="kbd">N</span></button>
           <button class="big yes grow ${sug==="yes"?"sugg":""}" id="gYes">Viem <span class="kbd">V</span></button>`;
  }
  $("#ctrl").innerHTML = `<div class="ctrl-inner">${prev}${mid}<span class="navrow"></span>${next}</div>`;
  // landscape layout: move nav buttons into one row at bottom
  if (matchMedia("(orientation:landscape) and (max-height:560px)").matches){
    const inner = $("#ctrl .ctrl-inner"), row = inner.querySelector(".navrow");
    row.append($("#prev"), $("#next")); inner.prepend(row);
  }
  $("#prev").onclick = () => move(-1);
  $("#next").onclick = () => move(1);
  if ($("#reveal")) $("#reveal").onclick = reveal;
  if ($("#gNo")) $("#gNo").onclick = () => grade(0);
  if ($("#gYes")) $("#gYes").onclick = () => grade(1);
}
$("#mainArea").addEventListener("click", e => {
  const b = e.target.closest("[data-opt]"); if (!b || !S || S.revealed || S.done) return;
  toggleOpt(b.dataset.opt);
});
function toggleOpt(L){ if (S.sel.has(L)) S.sel.delete(L); else S.sel.add(L); renderCard(true); }
function reveal(){ if (S.done || S.revealed) return; S.revealed = true; renderCard(true); }
function grade(v){
  const q = curQ(); prog(S.t.id)[q.n] = v; save();
  S.graded[q.n] = v; move(1, true);
}
function move(d){
  if (S.done) return;
  const np = S.pos + d;
  if (np < 0) return;
  const card = $("#card");
  const go = () => {
    if (np >= S.order.length){ S.done = true; renderEnd(); return; }
    S.pos = np; S.revealed = false; S.sel = new Set(); renderCard();
  };
  if (card && !matchMedia("(prefers-reduced-motion:reduce)").matches){
    card.classList.add(d > 0 ? "out-l" : "out-r"); setTimeout(go, 150);
  } else go();
}
function renderEnd(){
  renderTop();
  const g = Object.values(S.graded), k = g.filter(v=>v===1).length, u = g.filter(v=>v===0).length;
  const skipped = S.order.length - g.length, c = counts(S.t);
  $("#mainArea").innerHTML = `<div class="end">
    <h2>Kolo dokončené</h2>
    <p class="lead" style="margin:0">${esc(S.t.name)}</p>
    <div class="stats">
      <div class="stat k"><b>${k}</b><span>viem</span></div>
      <div class="stat u"><b>${u}</b><span>neviem</span></div>
      <div class="stat"><b>${skipped}</b><span>preskočené</span></div>
    </div>
    <p class="lead">Celkovo v teste: viem ${c.k} z ${c.total}, neviem ${c.u}, nevidené ${c.n}.</p>
    <div class="btns">
      ${c.u ? `<button class="btn btn-primary" id="againU">Precvičiť „neviem“ (${c.u})</button>` : ""}
      ${c.u + c.n ? `<button class="btn ${c.u ? "btn-ghost" : "btn-primary"}" id="againNK">Neviem + nové (${c.u + c.n})</button>` : ""}
      <button class="btn btn-ghost" id="againAll">Znova celý test</button>
      <button class="btn btn-ghost" id="toHome">Späť na zoznam testov</button>
    </div></div>`;
  $("#ctrl").innerHTML = "";
  const id = S.t.id;
  if ($("#againU")) $("#againU").onclick = () => startSession(id, "unknown", prefs.shuffle);
  if ($("#againNK")) $("#againNK").onclick = () => startSession(id, "notknown", prefs.shuffle);
  $("#againAll").onclick = () => startSession(id, "all", prefs.shuffle);
  $("#toHome").onclick = goHome;
}

/* ---------- swipe ---------- */
let sx=0, sy=0, st=0, tracking=false;
$("#mainArea").addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { tracking=false; return; }
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); tracking = true;
}, {passive:true});
$("#mainArea").addEventListener("touchend", e => {
  if (!tracking || !S || S.done) return; tracking = false;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - st < 700) move(dx < 0 ? 1 : -1);
}, {passive:true});

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (!S || $("#study").classList.contains("hidden") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.done){ if (e.key === "Escape") goHome(); return; }
  const k = e.key.toLowerCase();
  if (["a","b","c","1","2","3"].includes(k) && !S.revealed){ toggleOpt(LET["abc123".indexOf(k) % 3]); e.preventDefault(); }
  else if ((k === " " || k === "enter") && !S.revealed){ reveal(); e.preventDefault(); }
  else if (k === "n" && S.revealed) grade(0);
  else if (k === "v" && S.revealed) grade(1);
  else if (k === "arrowright") move(1);
  else if (k === "arrowleft") move(-1);
  else if (k === "escape") goHome();
});

/* re-layout controls when the phone rotates */
matchMedia("(orientation:landscape) and (max-height:560px)").addEventListener("change", () => { if (S && !S.done) renderCtrl(); });

/* ---------- boot ---------- */
const startId = location.hash.slice(1);
if (startId && DATA.some(t => t.id === startId)) startSession(startId, "all", false);
else show("home");
</script>
</body>
</html>
