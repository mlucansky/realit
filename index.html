oplatkov, ak v súlade s uzatvorenou zmluvou alebo všeobecnými obchodnými podmienkami. Zmenu však musí klientovi vopred oznámiť, pričom klient má právo so zmenou nesúhlasiť a zmluvu bezplatne ukončiť","Nie, banka môže meniť klientovi výšku poplatkov až potom, čo dlžník úver splatí, inak bude dlžník uhrádzať poplatky, aké boli v čase, keď úverovú zmluvu podpísal","Cenník poplatkov môže banka meniť iba na základe písomnej dohody medzi bankou a dlžníkom"],"a":"A"},{"n":141,"q":"Môže byť jeden zo spoludlžníkov na hypotekárnom úvere občanom s cudzou štátnou príslušnosťou?","o":["Nie, spoludlžník nemôže byť občanom s cudzou štátnou príslušnosťou","Áno, cudzinec môže byť spoludlžníkom na úvere. Pre čerpanie úveru musí však splniť podmienky veriteľa","Spoludlžník môže byť cudzinec, avšak musí mať vedený bežný účet vo financujúcej banke"],"a":"B"},{"n":142,"q":"Kto koná za maloletého stavebného sporiteľa a môže nadobúdať práva a brať na seba povinnosti zo zmluvy o stavebnom sporení?","o":["Zákonný zástupca, najčastejšie rodič, ktorý uzatvára za maloletého sporiteľa zmluvu a nadobúda z nej práva aj povinnosti.","Samotný maloletý ako účastník sporenia je reálnym nositeľom práv a povinností, no pre svoju nespôsobilosť na právne úkony v plnom rozsahu zaňho vo všetkých úkonoch spojených so správou účtu a zmluvou konajú zákonný zástupcovia/rodičia","Maloletý stavebný sporiteľ musí požiadať advokáta, aby ho zastupoval vo veciach stavebného sporenia"],"a":"AB"},{"n":143,"q":"Môže si zobrať stavebný úver maloletý v prípade, že bola na jeho meno uzatvorená zmluva o stavebnom sporení?","o":["Áno, ak ako maloletý vlastnoručne podpísal zmluvu o stavebnom sporení","Maloletý nemá plnú spôsobilosť na právne úkony a preto nemôže vstupovať do úverových vzťahov a brať na seba dlhodobé finančné záväzky","Maloletí sporitelia môžu uzatvoriť zmluvu o stavebnom úvere, ak výška splátok úveru nepresiahne 300,00 EUR."],"a":"B"},{"n":144,"q":"Je možné z hypotekárneho úveru nadobudnúť vlastníctvo iba k samotnému k stavebnému pozemku v prípade, že na ňom ešte nie je žiadna stavba domu?","o":["Banky úvery samotné financovanie pozemku bez stavby neposkytujú","Áno, nadobudnutie stavebného pozemku bez okamžitej stavby domu z hypotéky možné je, ale zvyčajne banky uplatňujú prísnejšie pravidlá a nižšie percento financovania","Žiadateľ musí deklarovať, že pozemok je určený na individuálnu výstavbu doložením územnoplánovacej informácie a musí mať inžinierske siete a prístupovú cestu"],"a":"BC"},{"n":145,"q":"Je možné použitie úveru zo stavebnej sporiteľne použiť na úhradu všetkých nákladov v súvislosti so stavbou nehnuteľnosti?","o":["Áno, stavebný úver je možné použiť na úhradu nákladov prípravy a vypracovania projektovej dokumentácie na stavebné účely, získanie energetického certifikátu a úhradu záväzkov súvisiacich so stavebnými účelmi uvedenými v Zákone o stavebnom sporení","Nie, stavba sporiteľňa akceptuje iba náklady za stavebné materiály a stavebné práce","Stavebná sporiteľňa prefinancuje iba na polovicu nákladov, ktoré priamo nesúvisia s výstavbou"],"a":"A"},{"n":146,"q":"Je možné mať účet stavebného sporenia vedený inde ako v stavebnej sporiteľni, aby sporiteľ ušetril na poplatkoch za vedenie účtu stavebného sporenia?","o":["Áno, bežná komerčná banka môže viesť účet stavebného sporenia","Nie. Účet stavebného sporenia musí byť vedený priamo v licencovanej stavebnej sporiteľni - špecializovanej banke, ktorá smie tento produkt a súvisiace účty poskytovať a spravovať.","Iná spoločnosť ako stavebná sporiteľňa môže viesť účet stavebného sporenia v prípade, ak klient prisľúbi, že nasporené prostriedky použije výlučne na účely výstavby, rekonštrukcie a modernizácie bývania"],"a":"B"},{"n":147,"q":"Ak chce získať stavebný sporiteľ viac štátnych prémií, môže uzatvoriť viacero zmlúv o stavebnom sporení?","o":["Áno, stavebný sporiteľ môže získať viacero štátnych prémií, ak uzatvorí viac zmlúv","Ak stavebný sporiteľ uzatvorí viacero zmlúv o stavebnom sporení, štátna prémia sa poskytne na tú zmluvu, o ktorej to stavebný sporiteľ písomne vyhlási","Stavebný sporiteľ môže v stavebnej sporiteľni uzatvoriť iba jednu zmluvu o stavebnom sporení"],"a":"B"},{"n":148,"q":"Je možné rozdeliť alebo spojiť už uzatvorené zmluvy o stavebnom sporení?","o":["Áno, už uzatvorené zmluvy o stavebnom sporení je možné rozdeliť aj spojiť podľa prísnych pravidiel príslušnej stavebnej sporiteľne a musia sa vykonať skôr, ako dôjde k prideleniu cieľovej sumy","Nie, každý sporiteľ má vlastnú zmluvu, a už pri uzatvorení zmluvy musí vedieť, koľko peňazí bude potrebovať na financovanie svojho bývania","Zmeny na zmluvy môžu robiť iba maloletí sporitelia, nakoľko nevedia odhadnúť náklady financovania bývania v budúcnosti"],"a":"A"},{"n":149,"q":"Na čo slúži v stavebnom sporení takzvané hodnotiace číslo?","o":["Je to číslo, ktoré hodnotí stavebnú sporiteľňu a meria jej trhový podiel","Hodnotiace číslo hodnotí počet uzatvorených zmlúv stavebnou sporiteľňou","Je to ukazovateľ, ktorý rozhoduje o tom, kedy sporiteľ získať nárok na stavebný úver a pridelenie cieľovej sumy. Spravodlivo meria, ako dlho a pravidelne sporiteľ vkladá peniaze a akou sumou prispieva do spoločného fondu"],"a":"C"},{"n":150,"q":"Musí dedič, ktorý zdedil vklady zo stavebného sporenia pokračovať v zmluve o stavebnom sporení?","o":["Dedič môže zmluvu zrušiť zmluvu a sporiteľňa mu vyplatí celú nasporenú sumu spolu s pripísanými úrokmi a štátnou prémiou vypočítanou ku dňu úmrtia poručiteľa","Dedič musí pokračovať v zmluve o sporení a dosporiť cieľovú sumu","Dedič môže požiadať o prevod zmluvy na svoje meno a môže pokračovať v pravidelných vkladoch za pôvodných podmienok za podmienok stavebnej sporiteľne, ktorá môže vyžadovať úpravu zmluvných podmienok podľa aktuálne platného sadzobníka a taríf."],"a":"AC"}]},{"id":"kataster","name":"Kataster nehnuteľností","questions":[{"n":1,"q":"V katastri nehnuteľností sa evidujú:","o":["práva vyplývajúce zo správy majetku štátu","nájomné práva k bytom, ak nájomné právo trvá alebo má trvať najmenej 5 rokov","predkupné právo, ak má mať účinky vecného práva"],"a":"AC"},{"n":2,"q":"Právotvorné (konštitutívne) účinky má:","o":["vykonanie záznamu","zrušenie záznamu","poznámka"],"a":""},{"n":3,"q":"Zásada priority zápisu práv do katastra sa nevzťahuje na zápis do katastra nehnuteľností formou:","o":["vkladu","záznamu","poznámky"],"a":"C"},{"n":4,"q":"Nájomné právo sa v katastri nehnuteľností eviduje, ak nájomné právo trvá alebo má trvať najmenej 5 rokov a predmetom nájomnej zmluvy je:","o":["pozemok","dom alebo pozemok","byt alebo nebytový priestor"],"a":"A"},{"n":5,"q":"Výška správneho poplatku za urýchlený návrh na vklad podaný v papierovej podobe je:","o":["100 €","300 €","150 €"],"a":"B"},{"n":6,"q":"Vklad je:","o":["úkon okresného úradu, ktorým vzniká, mení sa alebo zaniká právo k nehnuteľnostiam","úkon okresného úradu plniaci evidenčné funkcie, ktoré nemajú vplyv na vznik, zmenu ani na zánik práv k nehnuteľnostiam","úkon okresného úradu, ktorý je určený na vyznačenie skutočností alebo pomeru vzťahujúceho sa na nehnuteľnosti alebo na osobu a ktorý nemá vplyv na vznik, zmenu ani na zánik práv k nehnuteľnostiam"],"a":"A"},{"n":7,"q":"Právotvorné (konštitutívne) účinky má:","o":["vykonanie záznamu","zrušenie záznamu","poznámka"],"a":""},{"n":8,"q":"Záznam je:","o":["úkon okresného úradu, ktorý je určený na vyznačenie skutočností alebo pomeru vzťahujúceho sa na nehnuteľnosti alebo na osobu a ktorý nemá vplyv na vznik, zmenu ani na zánik práv k nehnuteľnostiam","úkon okresného úradu plniaci evidenčné funkcie, ktorý má vplyv na vznik, zmenu a na zánik práv k nehnuteľnostiam","úkon okresného úradu plniaci evidenčné funkcie, ktorý nemá vplyv na vznik, zmenu ani na zánik práv k nehnuteľnostiam"],"a":"C"},{"n":9,"q":"Poznámka je:","o":["úkon okresného úradu, ktorý je určený na vyznačenie skutočností alebo pomeru vzťahujúceho sa na nehnuteľnosti alebo na osobu a ktorý nemá vplyv na vznik, zmenu ani na zánik práv k nehnuteľnostiam","úkon okresného úradu plniaci evidenčné funkcie, ktorý má vplyv na vznik, zmenu a na zánik práv k nehnuteľnostiam","úkon okresného úradu plniaci evidenčné funkcie, ktorým sa zapisuje právo do katastra nehnuteľností, ale ktorý nemá vplyv na vznik, zmenu ani na zánik práv k nehnuteľnostiam"],"a":"A"},{"n":10,"q":"Aj bez návrhu môže okresný úrad vykonať, resp. do katastra zapísať:","o":["vklad","záznam","vklad aj záznam"],"a":"B"},{"n":11,"q":"List vlastníctva sa skladá:","o":["z časti A - Vlastníci, z časti B – Ťarchy, z časti C – Majetková podstata","z časti A – Majetková podstata, z časti B – Vlastníci, z časti C - Ťarchy","Z časti A – Vlastníci, z časti B - Majetková podstata, z časti C - Ťarchy"],"a":"B"},{"n":12,"q":"Nehnuteľnosť je:","o":["pozemok","každá stavba","stavba spojená so zemou pevným základom"],"a":"AC"},{"n":13,"q":"Identifikáciou parcely sa rozumie:","o":["porovnanie zápisu a zákresu tej istej nehnuteľnosti vo verejnej listine a inej listine a v iných operátoch so zápisom a zákresom v súbore popisných informácií a v súbore geodetických informácií katastra","geometrické určenie a polohové určenie a zobrazenie pozemku v mape určeného operátu","geometrické určenie a polohové určenie a zobrazenie pozemku v katastrálnej mape alebo v geometrickom pláne s vyznačením jej parcelného čísla"],"a":"A"},{"n":14,"q":"Parcelou sa rozumie:","o":["porovnanie zápisu a zákresu tej istej nehnuteľnosti vo verejnej listine a inej listine a v iných operátoch so zápisom a zákresom v súbore popisných informácií a v súbore geodetických informácií katastra","geometrické určenie a polohové určenie a zobrazenie pozemku v katastrálnej mape, v mape určeného operátu alebo v geometrickom pláne s vyznačením jej parcelného čísla","vymedzenie tvaru a rozmerov nehnuteľnosti alebo katastrálneho územia ich hranicami"],"a":"B"},{"n":15,"q":"Iná oprávnená osoba je osoba oprávnená z práva k nehnuteľnosti, a to:","o":["záložný veriteľ, oprávnený z predkupného práva, oprávnený z vecného bremena, nájomca, sp rdí, že jeho práva, právom chránené záujmy alebo povinnosti môžu byť rozhodnutím dotknuté","každý, koho práva, právom chránené záujmy alebo povinnosti môžu byť rozhodnutím o návrhu na vklad dotknuté","účastník právneho úkonu, na ktorého základe má vzniknúť, zmeniť sa alebo zaniknúť právo k nehnuteľnosti"],"a":"C"},{"n":22,"q":"Návrh na vklad je možné podať:","o":["v lehote 3 rokov od uzatvorenia zmluvy","v lehote 1 roka od uzatvorenia zmluvy","neexistuje zákonná lehota na podanie návrhu na vklad"],"a":"C"},{"n":23,"q":"Ak sa účastníci kúpnej zmluvy dohodli, že návrh na vklad podá kupujúci, návrh na vklad môže podať:","o":["iba kupujúci","ktorýkoľvek účastník kúpnej zmluvy","Iba kupujúci, avšak v návrhu na vklad musí byť uvedené, že predávajúci s podaním návrhu na vklad súhlasí"],"a":"B"},{"n":24,"q":"Správnym poplatkom je spoplatnený:","o":["návrh na vklad","návrh na záznam","návrh na zápis poznámky spornosti"],"a":"A"},{"n":25,"q":"Výška správneho poplatku za návrh na vklad podaný v papierovej podobe je:","o":["66 €","70 €","100 €"],"a":"C"},{"n":26,"q":"Výška správneho poplatku za návrh na vklad podaný v elektronickej podobe je:","o":["66 €","50 €","15 €"],"a":"B"},{"n":27,"q":"Ak účastníka konania pred podaním návrhu na vklad podal oznámenie o zamýšľanom návrhu na vklad, správny poplatok sa znižuje o:","o":["polovicu","33 €","15 €"],"a":"C"},{"n":28,"q":"Geometrický plán je prílohou návrhu na vklad v listinnej forme, ak:","o":["iba ak sa zlučujú alebo rozdeľujú pozemky","ak sa zlučujú alebo rozdeľujú pozemky alebo ak sa zriaďuje vecné bremeno k časti pozemku","ak sa zlučujú pozemky alebo rozdeľujú pozemky alebo ak sa zriaďuje vecné bremeno k časti pozemku alebo ak sa zriaďuje záložné právo"],"a":""},{"n":29,"q":"Ak bol návrh na vklad podaný v papierovej podobe, zmluvu je potrebné pripojiť:","o":["v jednom vyhotovení","v dvoch vyhotoveniach","v takom počte vyhotovení, ako je počet účastníkov konania o návrhu na vklad"],"a":"B"},{"n":30,"q":"Okresný úrad skúma spln "o":["záznamu","poznámky","záznamu alebo poznámky, ak sa tak dohodnú účastníci dohody záložných veriteľov"],"a":"A"},{"n":47,"q":"Výška správneho poplatku za návrh na zápis nájomného práva je:","o":["100 €","50 €","300 €"],"a":""},{"n":48,"q":"Výška správneho poplatku za návrh na zápis poznámky je:","o":["100 €","300 €","zápis poznámky do katastra nehnuteľností nie je spoplatnený"],"a":"C"},{"n":49,"q":"Lehota na vykonanie záznamu (okrem výmazu záložného práva) je:","o":["30 dní od doručenia verejnej listiny alebo inej listiny spôsobilých na záznam v elektronickej podobe, ktoré potvrdzujú alebo osvedčujú vznik, zmenu alebo zánik práva k nehnuteľnosti","30 dní od doručenia verejnej listiny alebo inej listiny spôsobilých na záznam, ktoré potvrdzujú alebo osvedčujú vznik, zmenu alebo zánik práva k nehnuteľnosti","60 dní od doručenia verejnej listiny alebo inej listiny spôsobilých na záznam, ktoré potvrdzujú alebo osvedčujú vznik, zmenu alebo zánik práva k nehnuteľnosti"],"a":"AC"},{"n":50,"q":"Okresný úrad vykoná záznam:","o":["iba z vlastného podnetu","iba na návrh vlastníka alebo inej oprávnenej osoby","bez návrhu, prípadne na návrh vlastníka alebo inej oprávnenej osoby"],"a":"C"},{"n":51,"q":"Podkladom na vykonanie záznamu môže byť:","o":["zmluva","tzv. verejná listina","tzv. iná listina"],"a":"ABC"},{"n":52,"q":"Poplatok za návrh na zápis poznámky je:","o":["za návrh na zápis poznámky sa neplatí správny poplatok","za návrh na zápis poznámky sa neplatí správny poplatok, s výnimkou návrhu na zápis poznámky spornosti, ktorý je spoplatnený sumou 33 €","66 €"],"a":"A"},{"n":53,"q":"Správny poplatok za návrh na zápis poznámky spornosti je:","o":["50 €","100 €","za návrh na zápis poznámky spornosti sa neplatí správny poplatok"],"a":"C"},{"n":54,"q":"Podpis vlastníka nehnuteľnosti nemusí byť osvedčený na:","o":["kúpnej zmluve","záložnej zmluve","zmluve o zriadení vecného bremena"],"a":"B"},{"n":55,"q":"Na zmluve o prevode nehnuteľnosti musí byť osvedčený podpis:","o":["vše :"C"},{"n":80,"q":"Stavba, ktorá nie je predmetom zápisu do katastra nehnuteľností:","o":["je na liste vlastníctva evidovaná kódom využitia pozemku pod touto stavbou","sa v operáte katastra nehnuteľností neeviduje vôbec žiadnym spôsobom","sa opisným spôsobom opíše v časti „Iné údaje“ listu vlastníctva"],"a":"A"},{"n":81,"q":"Výpis, alebo kópia listu vlastníctva, ktorá sa vydáva vlastníkovi:","o":["môže obsahovať aj rodné číslo vlastníka nehnuteľností","môže obsahovať aj iný identifikátor, ak sa jedná o cudzinca","neobsahuje ani rodné číslo, ani iný identifikátor cudzinca"],"a":"AB"},{"n":82,"q":"Čo tvorí kataster nehnuteľností?","o":["katastrálne územia","katastrálne operáty","katastrálne operáty usporiadané podľa katastrálnych území"],"a":"C"},{"n":83,"q":"Na aké účely slúži, resp. je využívaný kataster nehnuteľností ?","o":["na daňové a poplatkové účely","na oceňovanie nehnuteľností, najmä pozemkov","na ochranu národných kultúrnych pamiatok"],"a":"ABC"},{"n":84,"q":"Čo sa rozumie pod pojmom „katastrálny operát“?","o":["geometrické určenie a polohové určenie nehnuteľností a katastrálnych území","súbor dokumentačných materiálov obsahujúcich údaje katastra z jedného katastrálneho územia","súbor dokumentačných materiálov obsahujúcich údaje katastra zo všetkých katastrálnych území"],"a":"B"},{"n":85,"q":"Čo sa rozumie pod pojmom „mapa určeného operátu“?","o":["mapa, na ktorej sú zobrazené pozemky vymedzené vlastníckymi hranicami v nájme právnických osôb a fyzických osôb a sú zlúčené do väčších celkov","mapa, na ktorej sú zobrazené pozemky vymedzené vlastníckymi hranicami v nájme iba právnických osôb a sú zlúčené do väčších celkov","mapa, na ktorej sú zobrazené pozemky vymedzené vlastníckymi hranicami v nájme iba fyzických osôb a sú zlúčené do väčších celkov"],"a":"A"},{"n":86,"q":"Čo je zobrazené na mape určeného operátu ?","o":["parcely registra C-KN v užívaní osôb, ktoré ich využívajú na poľnohospodárske účely","parcely registra C-KN","parcely registra E-KN"],"a":"C"},{"n":87,"q":"Sú hranice parciel registra E-KN zreteľné (viditeľné) v teréne ?","o":["áno a sú vyznačené zelenou farbou","nie, nie sú viditeľné v teréne","nie, ale na mape určeného operátu sú vyznačené zelenou farbou"],"a":"BC"},{"n":88,"q":"Čo je najvyššou formou identifikácie parcely ?","o":["samotná listina, označená ako „identifikácia parcely“, nič presnejšie už neexistuje","geometrický plán","vykonanie projektu pozemkových úprav"],"a":"B"},{"n":89,"q":"V katastri sa evidujú stavby spojené so zemou pevným základom, a to prienikom so zemským povrchom alebo priemetom ich vonkajšieho odvodu na zemský povrch:","o":["ale iba tie, ktoré sú označené súpisným číslom, iné stavby sa v katastri neevidujú","ktoré sú rozostavanými stavbami v súvislosti so vznikom, zmenou alebo zánikom práva k nim","sú podzemnými stavbami, a to v miestach ich prienikov so zemským povrchom"],"a":"BC"},{"n":90,"q":"V katastri nehnuteľností sa evidujú pozemky, ktoré sú vymedzené:","o":["hranicou držby","hranicou druhu pozemku","rozhraním spôsobu využívania"],"a":"ABC"},{"n":91,"q":"V akej forme sa vedie katastrálny operát ?","o":["v papierovej podobe alebo elektronickej podobe","iba v papierovej podobe","iba v elektronickej podobe"],"a":"A"},{"n":92,"q":"Aké časti obsahuje katastrálny operát ?","o":["sídelné a nesídelné geografické názvy","súbor popisných informácií","sumárne údaje katastra o pôdnom fonde"],"a":"BC"},{"n":93,"q":"Čo je neplatný katastrálny operát ?","o":["je dokumentom s trvalou dokumentárnou hodnotou","je dokumentom, ktorý po jeho zneplatnení už nemá pre kataster výpovednú hodnotu","pozemková a železničná kniha, ktoré už nemajú trvalú dokumentárnu hodnotu"],"a":"A"},{"n":94,"q":"Medzi poľnohospodárske druhy pozemkov patrí:","o":["orná pôda, chmeľnice, vinice, lesné pozemky a vodné plochy","orná pôda, chmeľnice, vinice, záhrady, ovocné sady a trvalé trávne porasty","orná pôda, chmeľnice, vinice, záhrady a ostatné plochy"],"a":"B"},{"n":95,"q":"Komu možno vydať časti katastrálneho operátu ?","o":["nikomu","každému, kto si o to požiada","súdom a orgánom činným v trestnom konaní, a to iba na nevyhnutne potrebný čas"],"a":"C"},{"n":96,"q":"Do koho pôsobnosti spadá Úrad geodézie, kartografie a katastra SR ?","o":["do pôsobnosti Ministerstva pôdohospodárstva a rozvoja vidieka Slovenskej republiky","do pôsobnosti Ministerstva vnútra Slovenskej republiky","nespadá do nikoho pôsobnosti, je to ústredný orgán štátnej správy"],"a":"C"},{"n":97,"q":"Čo patrí do pôsobnosti Úradu geodézie, kartografie a katastra SR ?","o":["kontrolovať geodetické a kartografické činnosti, ktorých výsledky sa majú prevziať do katastra","spracúvať sumárne údaje o pôdnom fonde","rozhodovať o odvolaní proti rozhodnutiu o zamietnutí vkladu"],"a":"C"},{"n":98,"q":"Kto a čo podlieha katastrálnej inšpekcii ?","o":["fyzické a právnické osoby, vykonávajúce geodetické a kartografické činnosti, ktorých výsledky sa preberajú do katastra","zamestnanci okresných úradov, katastrálnych odborov","činnosti, pri ktorých sa využívajú údaje katastra, napr. geometrické plány, vytyčovanie hraníc pozemkov"],"a":"AC"},{"n":99,"q":"Čo patrí do pôsobnosti okresného úradu, katastrálneho odboru?","o":["rozhodovať v katastrálnom konaní","spravovať informačný systém katastra","rozhodovať o podanom proteste prokurátora proti rozhodnutiu, vydanom v katastrálnom konaní"],"a":"AC"},{"n":100,"q":"Kto je povinný poskytovať súčinnosť pri spravovaní katastra ?","o":["advokáti","štátne orgány a notári","vlastníci a iné oprávnené osoby"],"a":"BC"},{"n":101,"q":"akým spôsobom možno vykonať katastrálne konanie ?","o":["v listinnej podobe aj elektronicky","iba v listinnej podobe","iba elektronicky"],"a":"A"},{"n":102,"q":"Ak je návrh na vklad podaný elektronicky, prílohy:","o":["musia byť iba v elektronickej podobe","musia byť iba v listinnej podobe","môžu byť aj v listinnej, aj elektronickej podobe"],"a":"C"},{"n":103,"q":"Ak je návrh na začatie katastrálneho konania podaný v listinnej podobe, prílohy v listinnej podobe musia byť predložené:","o":["v origináli","v úradne osvedčenej fotokópii","vo farebnej fotokópii"],"a":"AB"},{"n":104,"q":"Podateľňa okresného úradu, katastrálneho odboru:","o":["nesmie prijatie písomného podania odmietnuť","môže prijatie písomného podania odmietnuť, prijatie písomnosti je na zvážení zamestnanca podateľne","musí prijatie písomného podania odmietnuť, ak podanie neobsahuje náležitosti predpísané zákonom"],"a":"A"},{"n":105,"q":"Kde je upravené prijímanie zásielok, adresovaných a prijímaných okresným úradom, katastrálnym odborom?","o":["v zákone NR SR č. 162/1995 Z.z. o katastri nehnuteľností a o zápise vlastníckych a iných práv k nehnuteľnostiam (katastrálny zákon) v znení neskorších predpisov","vo Vyhláške Úradu geodézie, kartografie a katastra SR č. 461/2009 Z.z., ktorou sa vykonáva zákon NR SR č. 162/1995 Z.z. o katastri nehnuteľností a o zápise vlastníckych a iných práv k nehnuteľnostiam (katastrálny zákon) v znení neskorších predpisov","vo Vyhláške Úradu geodézie, kartografie a katastra SR č. 22/2010 Z.z., ktorou sa vydáva Spravovací poriadok pre katastrálne úrady a správy katastra"],"a":"C"},{"n":106,"q":"Druhy registrov o katastrálnom konaní sú upravené v:","o":["vo Vyhláške Úradu geodézie, kartografie a katastra SR č. 22/2010 Z.z., ktorou sa vydáva Spravovací poriadok pre katastrálne úrady a správy katastra","vo Vyhláške Úradu geodézie, kartografie a katastra SR č. 461/2009 Z.z., ktorou sa vykonáva zákon NR SR č. 162/1995 Z.z. o katastri nehnuteľností a o zápise vlastníckych a iných práv k nehnuteľnostiam (katastrálny zákon) v znení neskorších predpisov","v zákone NR SR č. 162/1995 Z.z. o katastri nehnuteľností a o zápise vlastníckych a iných práv k nehnuteľnostiam (katastrálny zákon) v znení neskorších predpisov"],"a":"A"},{"n":107,"q":"Byty a nebytové priestory sa evidujú:","o":["iba v súbore geodetických informácií katastra údajmi o byte a nebytovom priestore","iba v súbore popisných informácií katastra údajmi o byte a nebytovom priestore","v súbore geodetických, aj v súbore popisných informácií katastra údajmi o byte a nebytovom priestore"],"a":"B"},{"n":108,"q":"Rozsah vecného bremena k časti pozemku:","o":["sa eviduje zobrazením na mape určeného operátu","sa eviduje zobrazením vo vektorovej katastrálnej mape","sa eviduje na podklade geometrického plánu na vyznačenie rozsahu vecného bremena"],"a":"BC"},{"n":109,"q":"Pozemok – parcela registra E-KN:","o":["má zreteľne viditeľné hranice v teréne","výmera je záväzným údajom katastra","výmera nie je záväzným údajom katastra"],"a":"C"},{"n":110,"q":"Ako možno zmeniť pozemok – parcelu registra E-KN na pozemok – parcelu registra C-KN?","o":["geometrickým plánom na obnovu právneho stavu","vykonaním projektu pozemkových úprav","vykonaním registra obnovenej evidencie pozemkov"],"a":"A"},{"n":111,"q":"Oznámenie o návrhu na vklad:","o":["sa podáva v papierovej podobe","sa podáva v elektronickej podobe prostredníctvom elektronického formulára na webovom sídle úradu","má vplyv na poradie zápisov"],"a":"B"},{"n":112,"q":"Na vykonanie záznamu sú spôsobilé najmä:","o":["osvedčenie notára","rozsudok súdu, ak vecné bremeno zanikne z dôvodu, že vznikne hrubý nepomer medzi vecným bremenom a výhodou oprávneného","listina preukazujúca správu majetku štátu"],"a":"ABC"},{"n":113,"q":"Poznámka, ktorá obmedzuje vlastníka nakladať s nehnuteľnosťou je najmä:","o":["upovedomenie o začatí exekúcie predajom nehnuteľnosti","upovedomenie o začatí exekúcie zriadením exekučného záložného práva","uznesenie súdu o zaistení majetku"],"a":"AC"},{"n":114,"q":"Geometrický plán má tieto časti:","o":["technickú správu","grafické znázornenie doterajšieho stavu nehnuteľností a návrh zmien","popisné pole"],"a":"BC"},{"n":115,"q":"Súpis nehnuteľností možno vydať v územnom rozsahu:","o":["katastrálneho územia","okresu, kraja","celého územia Slovenskej republiky"],"a":"ABC"},{"n":116,"q":"V akom právnom predpise môžeme nájsť kód spôsobu využívania pozemku ?","o":["v zákone NR SR č. 162/1995 Z.z. o katastri nehnuteľností a o zápise vlastníckych a iných práv k nehnuteľnostiam (katastrálny zákon) v znení neskorších predpisov","vo Vyhláške Úradu geodézie, kartografie a katastra SR č. 461/2009 Z.z., ktorou sa vykonáva zákon NR SR č. 162/1995 Z.z. o katastri nehnuteľností a o zápise vlastníckych a iných práv k nehnuteľnostiam (katastrálny zákon) v znení neskorších predpisov","vo Vyhláške Úradu geodézie, kartografie a katastra SR č. 22/2010 Z.z., ktorou sa vydáva Spravovací poriadok pre katastrálne úrady a správy katastra"],"a":"B"},{"n":117,"q":"Medzi fyzickými osobami nepodnikateľmi nesmie platba v hotovosti prevýšiť:","o":["15 000 EUR","10 000 EUR","5 000 EUR"],"a":"A"},{"n":118,"q":"Dohoda (bývalých) manželov o vyporiadaní bezpodielového spoluvlastníctva manželov k bytu:","o":["nie je zmluvou o prevode vlastníckeho práva k nehnuteľnostiam a preto netreba uvádzať náležitosti ustanovenia § 5 zákona č. 182/1993 Z.z. o vlastníctve bytov a nebytových priestorov","je zmluvou o prevode vlastníckeho práva k nehnuteľnostiam a preto treba uvádzať náležitosti ustanovenia § 5 zákona č. 182/1993 Z.z. o vlastníctve bytov a nebytových priestorov","ide iba o dohodu o vysporiadaní vzájomných práv a nárokov a preto netreba uvádzať náležitosti ustanovenia § 5 zákona č. 182/1993 Z.z. o vlastníctve bytov a nebytových priestorov"],"a":"B"},{"n":119,"q":"Zmluvu o zriadení vecného bremena IN PERSONAM môžu uzavrieť:","o":["iba všetci povinní z vecného bremena (vlastníci)","iba niektorí povinní z vecného bremena (vlastníci)","nadpolovičná väčšina povinných z vecného bremena (vlastníkov)"],"a":"A"},{"n":120,"q":"Správny poplatok za urýchlené konanie o návrhu na vklad :","o":["takýto druh správneho poplatku právny poriadok Slovenskej republiky nepozná","pri podaní je možné zaplatiť časť poplatku vo výške 100 EUR a zvyšok je možné doplatiť kedykoľvek v priebehu 15 dní","je splatný iba pri podaní, a to v plnej výške 300 EUR"],"a":"C"},{"n":121,"q":"Správny poplatok za urýchlené konanie o zázname:","o":["takýto druh správneho poplatku právny poriadok Slovenskej republiky nepozná","pri podaní je možné zaplatiť časť poplatku vo výške 100 EUR a zvyšok je možné doplatiť kedykoľvek v priebehu 15 dní","je splatný iba pri podaní, a to v plnej výške 300 EUR"],"a":"A"},{"n":122,"q":"Vyhľadávanie údajov z ISKN podľa identifikovaného vlastníka alebo inej oprávnenej osoby (tzv. lustráciu) vykonáva:","o":["Úrad geodézie, kartografie a katastra SR","Výskumný ústav geodézie a kartografie v Bratislave","Geodetický a kartografický ústav Bratislava"],"a":"C"},{"n":123,"q":"Čo rozumieme pod pojmom „lustrácia“ na úseku katastra nehnuteľností (za ktorú sa platí správny poplatok) ?","o":["vyhľadávanie osôb cez katastrálne portály v gescii Úradu geodézie, kartografie a katastra SR","vyhľadávanie nehnuteľností cez katastrálne portály v gescii Úradu geodézie, kartografie a katastra SR","vyhľadávanie údajov z informačného systému katastra nehnuteľností podľa identifikovaného vlastníka alebo inej oprávnenej osoby"],"a":"C"},{"n":124,"q":"Predkupné právo, ktoré má mať účinky vecného práva k nehnuteľnosti a ktoré sa zapisuje do katastra nehnuteľností:","o":["možno dohodnúť v samostatnej zmluve o zriadení predkupného práva","možno dohodnúť iba spolu so scudzovacou zmluvou, ktorou je Kúpna zmluva","takéto právo nemožno dohodnúť s účinkami vecného práva k nehnuteľnosti"],"a":"B"},{"n":125,"q":"Poznámka o vyhlásení konkurzu na majetok dlžníka, zapísaná na liste vlastníctva:","o":["má obmedzujúci charakter","má informatívny charakter","bráni v prevode tohto majetku na nového nadobúdateľa"],"a":"AC"},{"n":126,"q":"Geometrický plán ako podklad právneho úkonu, úradne overený po 01.10.2018 :","o":["je potrebné priložiť v papierovej forme k návrhu na začatie katastrálneho konania o návrhu na vklad","nie je potrebné priložiť v papierovej forme k návrhu na začatie katastrálneho konania o návrhu na vklad","stačí uviesť číslo úradného overenia geometrického plánu do návrhu na začatie katastrálneho konania o návrhu na vklad"],"a":"BC"},{"n":127,"q":"Údaje katastra sa poskytujú:","o":["na základe zmluvy","na základe žiadosti","ústne na podateľni okresného úradu, katastrálneho odboru"],"a":"AB"},{"n":128,"q":"Správny poplatok za prešetrenie údajov katastra nehnuteľností je:","o":["3 EUR","5 EUR","12 EUR"],"a":"B"},{"n":129,"q":"Ak oznámenie o návrhu na vklad obsahuje viac právnych úkonov, napr. darovanie a zriadenie vecného bremena, správny poplatok sa zníži o :","o":["15 EUR","30 EUR","zníži sa vždy iba o 15 EUR bez ohľadu na počet právnych úkonov"],"a":"AC"},{"n":130,"q":"Údaj o pozemku, evidovanom ako parcela registra E-KN obsahujú:","o":["parcelné číslo","číslo listu vlastníctva","údaj o pôvodnom katastrálnom území"],"a":"ABC"},{"n":131,"q":"Zbierka listín obsahuje najmä:","o":["písomné vyhotovenia zmlúv, dohôd a písomných vyhlásení vkladateľov o vložení nehnuteľnosti do majetku právnických osôb","písomné vyhotovenia rozhodnutí štátnych orgánov","dokumentáciu sídelných a nesídelných geografických geografických názvov"],"a":"ABC"},{"n":132,"q":"Do evidencie doručených návrhov na vklad má právo nahliadnuť:","o":["každý","iba účastník právneho úkonu, ktorého návrh na začatie katastrálneho konania bol podaný na príslušný okresný úrad, katastrálny odbor","iba ten, kto preukáže oprávnený záujem"],"a":"A"},{"n":133,"q":"Ak účastník konania nepodá do 90 dní od vyplnenia oznámenia o návrhu na vklad návrh na začatie katastrálneho konania o návrhu na vklad :","o":["platnosť tohto oznámenia zostáva aj tak naďalej zachovaná","nikto iný, ako ten čo toto oznámenie vyhotovil, nemôže v rámci tejto lehoty podať návrh na vklad, týkajúci sa dotknutých nehnuteľností","na takéto oznámenie sa neprihliada"],"a":"C"},{"n":134,"q":"Čestné vyhlásenie o splnení podmienok podľa ustanovenia § 59a Obchodného zákonníka alebo čestné vyhlásenie, že sa tieto podmienky na danú obchodnú spoločnosť nevzťahujú sa prikladá v prípade, ak sa jedná o:","o":["komanditnú spoločnosť","spoločnosť s ručením obmedzeným","akciovú spoločnosť"],"a":"C"},{"n":135,"q":"Identifikácia parciel je prílohou návrhu na začatie konania :","o":["ak vlastnícke právo nie je vpísané na liste vlastníctva","kedykoľvek, keď je potrebné bližšie určenie nehnuteľnosti, ktorá je predmetom prevodu","iba v prípade, ak má okresný úrad, katastrálny odbor pochybnosť o tom, kde sa nehnuteľnosť na katastrálnej mape presne nachádza"],"a":"A"},{"n":136,"q":"Identifikáciu parciel vyhotovuje:","o":["Úrad geodézie, kartografie a katastra SR","okresný úrad, odbor opravných prostriedkov, referát katastra nehnuteľností","okresný úrad, katastrálny odbor"],"a":"C"},{"n":137,"q":"Do uplynutia koľko dní od vyplnenia oznámenia o návrhu na vklad má účastník konania možnosť podať návrh na vklad ?","o":["30 dní","60 dní","90 dní"],"a":"C"},{"n":138,"q":"Kto oznamuje príslušným štátnym orgánom skutočnosti nasvedčujúce tomu, že došlo k porušeniu všeobecne záväzného právneho predpisu, o ktorej sa dozvedeli pri výkone štátnej správy?","o":["Úrad geodézie, kartografie a katastra SR a okresné úrady, katastrálne odbory","Úrad geodézie, kartografie a katastra SR a okresné úrady, odbory opravných prostriedkov, referáty katastra nehnuteľností","okresné úrady, odbory opravných prostriedkov, referáty katastra nehnuteľností a okresné úrady, katastrálne odbory"],"a":"A"},{"n":139,"q":"Na zápis práva k nehnuteľnosti do katastra je spôsobilá:","o":["písomne vyhotovená zmluva iba v štátnom jazyku alebo v českom jazyku","písomne vyhotovená zmluva v štátnom jazyku, českom jazyku alebo v úradne osvedčenom preklade","verejná listina alebo iná listina bez chýb v písaní a počítaní a bez iných zrejmých nesprávností"],"a":"BC"},{"n":140,"q":"Ak verejná alebo iná listina obsahuje chyby v písaní alebo počítaní alebo iné zrejmé nesprávnosti, prípadne náležitosti podľa katastrálneho zákona, okresný úrad, katastrálny odbor:","o":["vydá rozhodnutie o prerušení konanie o zázname, určí lehotu a vyzve na odstránenie nedostatkov","vydá rozhodnutie o prerušení konania o zázname a vráti ju tomu, kto podal návrh na záznam a určí lehotu na vykonanie opravy","vráti ju vyhotoviteľovi alebo tomu, kto podal návrh na záznam a určí lehotu na vykonanie opravy"],"a":"C"},{"n":141,"q":"Referenčným registrom je v Slovenskej republike :","o":["Register fyzických osôb","Register adries","Kataster nehnuteľností"],"a":"AB"},{"n":142,"q":"Ak bol návrh na vykonanie záznamu podaný prostredníctvom elektronického formulára, okresný úrad, katastrálny odbor vykoná záznam do:","o":["60 dní od doručenia návrhu na vykonanie záznamu","45 dní od doručenia návrhu na vykonanie záznamu","30 dní od doručenia návrhu na vykonanie záznamu"],"a":"C"},{"n":143,"q":"Okresný úrad, katastrálny odbor plombu zruší :","o":["právoplatným rozhodnutím o zamietnutí návrhu na vklad","právoplatným rozhodnutím, ktorým sa nevyhovuje protestu prokurátora","právoplatným rozhodnutím, ktorým sa vyhovuje protestu prokurátora"],"a":"AB"},{"n":144,"q":"Rozostavaný byt alebo nebytový priestor sa do katastra zapíše :","o":["ak stavba, v ktorej sa byt alebo nebytový priestor nachádza je uzavretá stropnou konštrukciou stavby a jednotlivé byty alebo nebytové priestory sú stavebnotechnicky oddelené","ak sú jednotlivé byty alebo nebytové priestory sú stavebnotechnicky oddelené","stavba, v ktorej sa byt alebo nebytový priestor nachádza je navonok uzavretá obvodovými stenami a strešnou konštrukciou a jednotlivé byty alebo nebytové priestory sú stavebnotechnicky oddelené"],"a":"C"},{"n":145,"q":"V akom poradí sa vyznačí plomba na list vlastníctva ?","o":["v poradí, v akom sa správe katastra doručili návrhy na zápis do katastra","vždy sa najskôr vyznačí plomba signalizujúca konanie o návrhu na vklad","plomba sa vyznačí iba vtedy, ak podateľňa okresného úradu, katastrálneho odboru vyhodnotí, že predložená listina spĺňa všetky náležitosti na začatie katastrálneho konania"],"a":"A"},{"n":146,"q":"Kedy sa do katastra nehnuteľností zapíše stavba ?","o":["postačí, ak je ohraničená obvodovými stenami","ak je ohraničená obvodovými stenami a strešnou konštrukciou","ak je ohraničená obvodovými stenami a stropnou konštrukciou"],"a":"B"},{"n":147,"q":"Čo sa predkladá na výmaz stavby alebo podzemnej stavby, ktorá zanikla ?","o":["právoplatné rozhodnutie o zrušení súpisného čísla","potvrdenie obce, že stavba bola odstránená, alebo neexistuje","právoplatné rozhodnutie o zrušení súpisného čísla a právoplatné rozhodnutie o zrušení súpisného čísla"],"a":"C"},{"n":148,"q":"Okresný úrad, katastrálny odbor opraví v rámci konania o oprave chyby v katastrálnom operáte :","o":["výmeru parcely registra „E“","výmeru parcely registra „C“, ktorá nie je zapísaná na liste vlastníctva","údaj o viacnásobnom vlastníctve"],"a":"AC"},{"n":149,"q":"Úradne osvedčená pravosť podpisu osôb, ktorých sa týka návrh na začatie konania o oprave chyby v katastrálnom operáte musí byť v prípade, ak :","o":["je účastníkom konania o oprave chyby Slovenský pozemkový fond","sa opravuje údaj o viacnásobnom vlastníctve, ak s tým súhlasia všetky osoby zapísané v katastri ako vlastníci a iné osoby, ktorým svedčí vlastnícke právo k tej istej nehnuteľnosti podľa verejnej listiny alebo podľa inej listiny a nie sú zapísaní v katastri ako vlastníci tejto nehnuteľnosti","je účastníkom konania obec"],"a":"B"},{"n":150,"q":"Kedy sa skončí konanie o oprave chyby v katastrálnom operáte ?","o":["dňom vykonania zápisu do katastra na základe rozhodnutia o oprave chyby","dňom vykonania zápisu do katastra na základe protokolu o oprave chyby","dňom odoslania oznámenia o dôvodoch nevykonania opravy chyby"],"a":"ABC"},{"n":151,"q":"Vykonanie opravy chyby na základe protokolu o oprave chyby :","o":["okresný úrad, katastrálny odbor dotknutej osobe neoznamuje","okresný úrad, katastrálny odbor oznámi dotknutej osobe oznámi, iba ak sa opravovali údaje na liste vlastníctva","okresný úrad, katastrálny odbor oznámi osobe dotknutej opravou chyby do 15 dní odo dňa vykonania opravy chyby v katastri"],"a":"C"}]},{"id":"pravo","name":"Právo a nehnuteľnosti","questions":[{"n":1,"q":"Nehnuteľnosť je:","o":["akákoľvek stavba, vrátane dočasnej stavby, ktorá so zemou nie je pevne spojená","pozemok","stavba spojená so zemou pevným základom"],"a":"BC"},{"n":2,"q":"Byt je:","o":["akákoľvek nehnuteľnosť, ktorá je užívaná na trvalé bývanie","miestnosť alebo súbor miestností, ktoré sú kolaudačným osvedčením stavebného úradu určené na bývanie ako samostatná bytová jednotka","miestnosť alebo súbor miestností, ktoré spĺňajú základné hygienické a bezpečnostné predpisy a sú užívané na trvalé bývanie"],"a":"B"},{"n":3,"q":"Nebytový priestor je:","o":["jednou zo spoločných častí bytového domu","miestnosť alebo súbor miestností, ktoré sú kolaudačným osvedčením stavebného úradu určené na iné účely ako na bývanie","byt, ak ho vlastník alebo iná oprávnená osoba užíva na iné účely ako na bývanie (napríklad na výkon podnikateľskej činnosti)"],"a":"B"},{"n":4,"q":"Vo vzťahu stavby a pozemku na Slovensku platí:","o":["stavba môže byť samostatným predmetom vlastníckeho práva","vlastníkom stavby môže byť iná osoba ako vlastník pozemku","stavba je vždy súčasťou pozemku, na ktorom stojí"],"a":"AB"},{"n":5,"q":"Pri podielovom spoluvlastníctve:","o":["rozhoduje o hospodárení s vecou väčšina hlasov počítaná podľa veľkosti ich spoluvlastníckych podielov","rozhoduje o hospodárení s vecou väčšina hlasov počítaná podľa počtu spoluvlastníkov","na prevod vlastníckeho práva sa vyžaduje súhlas (a podpis) 2/3 všetkých podielových spoluvlastníkov"],"a":"A"},{"n":6,"q":"Do zákonného rozsahu bezpodielového spoluvlastníctva manželov spravidla patrí:","o":["nehnuteľnosť nadobudnutá kúpou počas manželstva, ak nejde o zákonnú výnimku","nehnuteľnosť zdedená jedným z manželov","vec, ktorá podľa svojej povahy slúži osobnej potrebe len jedného z manželov"],"a":"A"},{"n":7,"q":"Pre bezpodielové spoluvlastníctvo manželov platí:","o":["môže vzniknúť iba medzi manželmi","manželia v ňom nemajú určené spoluvlastnícke podiely","jeho rozsah možno rozšíriť alebo zúžiť ústnou dohodou"],"a":"AB"},{"n":8,"q":"Dražobná zábezpeka:","o":["môže byť najviac 15 % z najnižšieho podania","môže byť najviac 30 % z najnižšieho podania","je nevratná"],"a":"B"},{"n":9,"q":"Medzi zjavné vady nepatrí:","o":["viditeľné plesne","praskliny na stenách","nezabezpečenie nehnuteľnosti proti spodnej vode"],"a":"C"},{"n":10,"q":"Občiansky zákonník pri zodpovednosti za vady predanej veci rozlišuje:","o":["vady zjavné a vady dodatočne zistené","vady zjavné a vady statické","vady na nehnuteľnosti v interiéri a vady na nehnuteľnosti v exteriéri"],"a":"A"},{"n":11,"q":"Kupujúci si v prípade vady nehnuteľnosti môže podľa Občianskeho zákonníka u predávajúceho:","o":["uplatniť zľavu z kúpnej ceny","odstúpiť od zmluvy","uplatniť si právo na opravu nehnuteľnosti"],"a":"AB"},{"n":12,"q":"Poľnohospodárskou pôdou podľa zákona o ochrane a využívaní poľnohospodárskej pôdy je produkčne potenciálna pôda evidovaná v katastri nehnuteľností ako:","o":["vinice","chmeľnice","záhrady"],"a":"ABC"},{"n":13,"q":"Základná sadzba odvodu za odňatie poľnohospodárskej pôdy sa určuje podľa:","o":["kvality pôdy určenej podľa kódu bonitovaných pôdno-ekologických jednotiek","počtu spoluvlastníkov pozemku","zámeru, na ktorý má byť vyňatý pozemok využitý"],"a":"A"},{"n":14,"q":"Kúpna zmluva na nehnuteľnosť musí byť podľa Občianskeho zákonníka:","o":["písomná","vyhotovená vo forme notárskej zápisnice","vyhotovená advokátom"],"a":"A"},{"n":15,"q":"Vlastníctvo k nehnuteľnosti sa nadobúda:","o":["dňom podpisu kúpnej zmluvy","dňom odovzdania nehnuteľnosti","dňom právoplatného povolenia vkladu vlastníckeho práva do katastra nehnuteľností"],"a":"C"},{"n":16,"q":"Legalizácia príjmov z trestnej činnosti (tzv. pranie špinavých peňazí) je činnosť, ktorá spočíva v:","o":["utajení alebo zakrytí pôvodu alebo povahy majetku, umiestnenia alebo premiestnenia majetku, vlastníckeho práva alebo iného práva k majetku s vedomím, že tento majetok pochádza z trestnej činnosti, alebo z účasti na trestnej činnosti","nadobudnutí, držbe, užívaní a požívaní majetku s vedomím, že tento majetok pochádza z trestnej činnosti, alebo z účasti na trestnej činnosti","účasti na konaní podľa predchádzajúcich bodov, a to aj vo forme spolčenia, napomáhania, podnecovania a navádzania, ako aj v pokuse o takéto konanie"],"a":"ABC"},{"n":17,"q":"Spracúvanie osobných údajov je zákonné a možné iba vtedy a iba v tom rozsahu, keď je splnená aspoň jedna z týchto podmienok:","o":["dotknutá osoba vyjadrila súhlas so spracúvaním svojich osobných údajov na jeden alebo viaceré konkrétne účely","spracúvanie je nevyhnutné, aby sa ochránili životne dôležité záujmy dotknutej osoby alebo inej fyzickej osoby","spracúvanie je nevyhnutné na splnenie zákonnej povinnosti prevádzkovateľa"],"a":"ABC"},{"n":18,"q":"Na vydanie súhlasu s budúcim možným použitím poľnohospodárskej pôdy na stavebné zámery a iné zámery a určenie podmienok súhlasu je rozhodujúci celkový konečný rozsah zamýšľaného odňatia poľnohospodárskej pôdy. Súhlas okresného úradu sa nevyžaduje, ak ide o celkovú a konečnú výmeru odňatia poľnohospodárskej pôdy do:","o":["500 m2","1 000 m2","5 000 m2"],"a":"B"},{"n":19,"q":"Záložný veriteľ môže vykonať záložné právo, ktoré je zriadené v jeho prospech nasledovnými spôsobmi:","o":["spôsobom určeným v záložnej zmluve (napríklad priamym predajom zálohu)","predajom zálohu na dobrovoľnej dražbe","predajom zálohu súdnym exekútorom"],"a":"ABC"},{"n":20,"q":"Predkupné právo vzniká :","o":["pri podielovom spoluvlastníctve, ak sa prevádza spoluvlastnícky podiel","pri bezpodielovom spoluvlastníctve, ak sa prevádza spoluvlastnícky podiel","v prospech štátu - pri prevode nehnuteľnosti, ktorá je kultúrnou pamiatkou"],"a":"AC"},{"n":21,"q":"Pri nesprávnych alebo neúplných osobných údajoch má dotknutá osoba právo:","o":["na opravu nesprávnych osobných údajov bez zbytočného odkladu","na doplnenie neúplných osobných údajov","na automatické vymazanie osobných údajov bez ohľadu na účel spracúvania"],"a":"AB"},{"n":22,"q":"Dotknutá osoba má právo na vymazanie osobných údajov ak:","o":["osobné údaje už nie sú potrebné na účely, na ktoré sa spracúvali","osobné údaje sa spracúvali nezákonne","osobné údaje sa získavali v súvislosti s prevenciou proti praniu špinavých peňazí"],"a":"AB"},{"n":23,"q":"Prevádzkovateľ osobných údajov musí dotknutú osobu poučiť o:","o":["práve podať žalobu","účeloch spracúvania osobných údajov","dobe uchovávania osobných údajov"],"a":"BC"},{"n":24,"q":"Vydražiteľ v rámci dobrovoľnej dražby:","o":["nadobudne vlastnícke právo udelením príklepu, ak v ustanovenej lehote uhradil cenu dosiahnutú vydražením","nadobudne vlastnícke právo udelením príklepu aj bez uhradenia ceny dosiahnutej vydražením; dražobník má právo cenu následne vymáhať","nadobudne vlastnícke právo príklepom licitátora a následným potvrdením príklepu príslušným súdom"],"a":"A"},{"n":25,"q":"Začatie výkonu záložného práva k nehnuteľnosti:","o":["musí byť vyznačené v katastri nehnuteľností","sa do katastra nehnuteľností nezapisuje ani nevyznačuje","sa záložcovi oznamuje iba ústne"],"a":"A"},{"n":26,"q":"Zákonné záložné právo v bytovom dome slúži na ochranu:","o":["dlžníkov vlastníka bytu","ostatných vlastníkov bytov v bytovom dome","podielových spoluvlastníkov bytu"],"a":"B"},{"n":27,"q":"Záložné právo k nehnuteľnosti:","o":["sa zapisuje do „ČASTI A“ listu vlastníctva","sa zapisuje do „ČASTI B“ listu vlastníctva","sa zapisuje do časti “Poznámky”"],"a":""},{"n":28,"q":"Vecné bremeno môže zaniknúť:","o":["splynutím práv a povinností z vecného bremena v jednej osobe","odstránením stavby","písomnou zmluvou"],"a":"ABC"},{"n":29,"q":"Vecné bremeno zriadené v prospech určitej osoby (in personam) môže zaniknúť:","o":["smrťou alebo zánikom tejto osoby","každou zmenou vlastníka zaťaženej nehnuteľnosti","prechodnou nemožnosťou výkonu vecného bremena"],"a":"A"},{"n":30,"q":"Ak vecné bremeno vzniká zmluvou:","o":["zmluva musí mať písomnú formu","na vznik práva je potrebný vklad do katastra nehnuteľností","zapisuje sa do katastra nehnuteľností záznamom"],"a":"AB"},{"n":31,"q":"Nájom nebytového priestoru na dobu neurčitú možno, ak zmluva neurčuje inak:","o":["písomne vypovedať aj bez uvedenia dôvodu","vypovedať iba zo zákonom presne vymedzených dôvodov","ukončiť iba rozhodnutím súdu"],"a":"A"},{"n":32,"q":"Obsahové náležitosti nájomnej zmluvy podľa zákona o krátkodobom nájme bytu sú:","o":["označenie bytu a rozsahu jeho užívania","určenie výšky nájomného a výšky úhrad za plnenia poskytované s užívaním bytu","vyhlásenie nájomcu, že si je vedomý skutočnosti, že nájomná zmluva sa uzaviera podľa zákona o krátkodobom nájme bytu"],"a":"ABC"},{"n":33,"q":"Doba nájmu podľa zákona o krátkodobom nájme bytu môže byť dohodnutá najviac na:","o":["jeden rok","šesť mesiacov","tri roky"],"a":""},{"n":34,"q":"Pri nájme bytu podľa Občianskeho zákonníka môže prenajímateľ dať nájomcovi výpoveď z dôvodu že:","o":["potrebuje byt pre seba, manžela, pre svoje deti, vnukov, zaťa alebo nevestu, svojich rodičov alebo súrodencov","nájomca hrubo poškodzuje prenajatý byt","nájomca sústavne narušuje pokojné bývanie ostatných nájomcov alebo vlastníkov bytov, ohrozuje bezpečnosť alebo porušuje dobré mravy v dome"],"a":"ABC"},{"n":35,"q":"Záložné práva k nehnuteľnosti:","o":["pri predaji nehnuteľnosti vždy zanikajú","sú na liste vlastníctva zoradené podľa výšky dlhu, ktorý zabezpečujú","nie je možné zriadiť, ak je predmetom záložného práva byt vo výstavbe"],"a":""},{"n":36,"q":"Pri platbe kúpnej ceny prostredníctvom tretej osoby – uschovávateľa (notár, banka, advokát):","o":["môže byť kúpna cena zložená do notárskej úschovy","predmet úschovy sa predávajúcemu vydá po splnení dohodnutých podmienok (spravidla po povolení vkladu vlastníckeho práva v prospech kupujúceho)","je potrebné uviesť podmienky vydania predmetu úschovy"],"a":"ABC"},{"n":37,"q":"Zmluva o prevode vlastníctva bytu musí okrem všeobecných náležitostí obsahovať:","o":["vyhlásenie nadobúdateľa o pristúpení k zmluve o spoločenstve vlastníkov alebo k zmluve o výkone správy","označenie bytu a jeho polohy vrátane čísla bytu a čísla vchodu","súhlas ostatných vlastníkov bytov v dome s prevodom"],"a":"AB"},{"n":38,"q":"Prijatie návrhu na uzavretie zmluvy, ktoré obsahuje dodatky, výhrady alebo iné zmeny:","o":["je prijatím pôvodného návrhu","je odmietnutím pôvodného návrhu a považuje sa za nový návrh","nemá právne účinky"],"a":"B"},{"n":39,"q":"Kedy je právny úkon neplatný?","o":["Ak odporuje zákonu alebo dobrým mravom","Ak neobsahuje overené podpisy účastníkov","Ak je vykonaný osobou bez spôsobilosti na právne úkony"],"a":"AC"},{"n":40,"q":"Pri prevode alebo nadobúdaní nehnuteľnosti:","o":["za maloletú osobu koná jej zákonný zástupca a právny úkon musí schváliť súd","právnická osoba koná prostredníctvom štatutárneho orgánu","maloletá osoba koná samostatne, ak má súhlas zákonného zástupcu"],"a":"AB"},{"n":41,"q":"Zákonom vyžadovanými náležitosťami kúpnej zmluvy sú:","o":["určenie predmetu kúpy","kúpna cena","lehota na vysťahovanie a vypratanie nehnuteľnosti"],"a":"AB"},{"n":42,"q":"Čo je právnym dôsledkom odstúpenia od zmluvy?","o":["Zmluva sa zrušuje (zaniká) a strany si vracajú plnenia","Zmluva platí naďalej, pokiaľ si strany nevrátia plnenia","Zmluva zostáva v platnosti, pokiaľ kataster nevykoná spätný zápis"],"a":"A"},{"n":43,"q":"Po účinnom odstúpení od kúpnej zmluvy:","o":["kupujúci musí vydať nehnuteľnosť predávajúcemu","predávajúci musí vydať kupujúcemu uhradenú kúpnu cenu","kupujúci musí požiadať súd, aby zrušenie zmluvy potvrdil"],"a":"AB"},{"n":44,"q":"V akých prípadoch je rezervačná zmluva trojstranná?","o":["Ak ju uzatvára realitný sprostredkovateľ, budúci kupujúci a budúci predávajúci","Ak má spolu v počte tri normostrany","Ak sa týka výlučne podnájmu"],"a":"A"},{"n":45,"q":"Rezervačná zmluva:","o":["ukladá zúčastneným stranám povinnosti smerujúce k budúcemu prevodu","obsahuje záväzok budúceho predávajúceho a budúceho kupujúceho uzavrieť kúpnu zmluvu v stanovenej lehote","rieši aj situáciu, keď k podpisu kúpnej zmluvy nedôjde"],"a":"ABC"},{"n":46,"q":"Čo sa vo všeobecnosti vyžaduje na platnosť právneho úkonu?","o":["Spôsobilosť osoby na právne úkony","Zrozumiteľnosť a určitý obsah","Schválenie súdom"],"a":"AB"},{"n":47,"q":"Pri družstevnom byte sa prevádza:","o":["samotná nehnuteľnosť evidovaná v katastri nehnuteľností","členský podiel v bytovom družstve a práva s ním spojené","výlučne nájomný vzťah bez členských práv"],"a":"B"},{"n":48,"q":"Kto môže byť zmluvnou stranou kúpnej zmluvy na nehnuteľnosť?","o":["Osoba so spôsobilosťou na právne úkony","Maloletá osoba zastúpená zákonným zástupcom, ak právny úkon schváli súd","Právnická osoba zastúpená oprávneným zástupcom"],"a":"ABC"},{"n":49,"q":"Pri sprostredkovateľskom vzťahu medzi podnikateľmi:","o":["písomná forma sa na jeho platný vznik nevyžaduje","písomná zmluva môže sprostredkovateľovi pomôcť v prípadnom spore o províziu","nárok na províziu vždy vzniká až po povolení vkladu sprostredkovanej nehnuteľnosti do katastra nehnuteľností"],"a":"AB"},{"n":50,"q":"Vecné bremená k nehnuteľnosti:","o":["sa zapisujú do „ČASTI A“ listu vlastníctva","sa zapisujú do „ČASTI B“ listu vlastníctva","sa zapisujú do „ČASTI C“ listu vlastníctva"],"a":"C"},{"n":51,"q":"Členský podiel v bytovom družstve môže byť:","o":["v bezpodielovom spoluvlastníctve manželov","vo výlučnom vlastníctve","v podielovom spoluvlastníctve"],"s":"Nehnuteľnosti a vlastníctvo","a":"AB"},{"n":52,"q":"Komunálne byty sú:","o":["bývalé štátne byty","byty vo vlastníctve bytového družstva","byty vo vlastníctve obcí"],"s":"Nehnuteľnosti a vlastníctvo","a":"AC"},{"n":53,"q":"Medzi veci, ktoré sú výlučne vo vlastníctve štátu, patria:","o":["pozemky nachádzajúce sa v časti prírody s najvyšším stupňom ochrany","podzemné vody","jaskyne"],"s":"Nehnuteľnosti a vlastníctvo","a":"BC"},{"n":54,"q":"Vlastnícke oprávnenia zahŕňajú právo:","o":["vec užívať a požívať jej plody a úžitky","s vecou disponovať","vec držať"],"s":"Nehnuteľnosti a vlastníctvo","a":"ABC"},{"n":55,"q":"Pri výlučnom vlastníctve:","o":["o nakladaní s nehnuteľnosťou rozhoduje vlastník sám","vlastník potrebuje súhlas podielového spoluvlastníka","vec vlastní iba jedna osoba"],"s":"Nehnuteľnosti a vlastníctvo","a":"AC"},{"n":56,"q":"Ideálny spoluvlastnícky podiel:","o":["môže byť vyjadrený zlomkom","vyjadruje mieru účasti na právach a povinnostiach zo spoločnej veci","predstavuje fyzicky vyčlenenú časť nehnuteľnosti"],"s":"Nehnuteľnosti a vlastníctvo","a":"AB"},{"n":57,"q":"Ak spoluvlastník prevádza svoj podiel na blízku osobu:","o":["podiel musí vždy najskôr ponúknuť ostatným spoluvlastníkom","súrodenec sa nepovažuje za blízku osobu","zákonné predkupné právo ostatných spoluvlastníkov sa neuplatní"],"s":"Nehnuteľnosti a vlastníctvo","a":"C"},{"n":58,"q":"Dohoda o zrušení a vyporiadaní podielového spoluvlastníctva k nehnuteľnosti:","o":["je platná aj ako ústna dohoda","na jej právne účinky sa vyžaduje vklad do katastra nehnuteľností","musí mať písomnú formu"],"s":"Nehnuteľnosti a vlastníctvo","a":"BC"},{"n":59,"q":"Pri súdnom vyporiadaní podielového spoluvlastníctva môže súd:","o":["prikázať vec jednému alebo viacerým spoluvlastníkom za primeranú náhradu","nariadiť predaj tretej osobe a rozdeliť výťažok podľa podielov","vec rozdeliť, ak je dobre deliteľná a môže ďalej plniť svoj účel"],"s":"Nehnuteľnosti a vlastníctvo","a":"ABC"},{"n":60,"q":"Pri vybavovaní bežných vecí patriacich do BSM:","o":["ide najmä o úkony každodennej správy spoločného majetku","môže konať každý z manželov samostatne","je vždy potrebný osobitný súhlas druhého manžela"],"s":"Nehnuteľnosti a vlastníctvo","a":"AB"},{"n":61,"q":"Právny úkon môže byť:","o":["trojstranný alebo viacstranný","jednostranný","dvojstranný"],"s":"Právne úkony a zmluvy","a":"ABC"},{"n":62,"q":"Právny úkon je prejav vôle smerujúci najmä k:","o":["zmene práv alebo povinností","zániku práv alebo povinností","vzniku práv alebo povinností"],"s":"Právne úkony a zmluvy","a":"ABC"},{"n":63,"q":"Chyby v písaní alebo počítaní v právnom úkone:","o":["nespôsobujú neplatnosť, ak je význam úkonu nepochybný","spôsobujú neplatnosť v každom prípade","môžu sa nachádzať aj v platnom právnom úkone"],"s":"Právne úkony a zmluvy","a":"AC"},{"n":64,"q":"Mlčanie alebo nečinnosť adresáta návrhu:","o":["samy osebe neznamenajú prijatie návrhu","nahrádzajú podpis zmluvy","znamenajú prijatie návrhu"],"s":"Právne úkony a zmluvy","a":"A"},{"n":65,"q":"Odpoveď, ktorá mení obsah navrhovanej zmluvy:","o":["je novým návrhom","je prijatím návrhu","musí byť prijatá druhou stranou zmluvy"],"s":"Právne úkony a zmluvy","a":"A"},{"n":66,"q":"Zaslanie žiadosti o uzavretie sprostredkovateľskej zmluvy spolu s jej obsahom klientovi:","o":["zaväzuje klienta aj bez jeho prijatia","predstavuje návrh na uzavretie zmluvy","ponecháva klientovi možnosť návrh prijať alebo odmietnuť"],"s":"Právne úkony a zmluvy","a":"BC"},{"n":67,"q":"Zmluva je uzavretá:","o":["už odoslaním návrhu bez ohľadu na jeho prijatie","v deň, ktorý bol v návrhu pre adresáta uvedený","aj samotným mlčaním adresáta"],"s":"Právne úkony a zmluvy","a":""},{"n":68,"q":"Pri práci s návrhom zmluvy je nutné od klienta požadovať:","o":["mlčanlivosť","jasný prejav vôle byť zmluvou viazaný","bezodkladnú odpoveď"],"s":"Právne úkony a zmluvy","a":"B"},{"n":69,"q":"Podstatou záväzku sprostredkovateľa je:","o":["vyvíjať činnosť smerujúcu k tomu, aby mal záujemca možnosť uzavrieť zmluvu s treťou osobou","zaručiť, aby kataster povolil vklad","majetkovo vysporiadať právne vzťahy"],"s":"Sprostredkovanie a rezervácia","a":"A"},{"n":70,"q":"Pri sprostredkovaní:","o":["sa záujemca spravidla zaväzuje zaplatiť províziu, ak dôjde k uzavretiu sprostredkovanej zmluvy","si strany môžu dohodnúť aj iný okamih vzniku nároku na províziu","záujemca je povinný zaplatiť províziu pri podpise rezervačnej zmluvy"],"s":"Sprostredkovanie a rezervácia","a":"AB"},{"n":71,"q":"Sprostredkovateľská zmluva so spotrebiteľom nesmie obsahovať:","o":["neprijateľné podmienky spôsobujúce značnú nerovnováhu v neprospech spotrebiteľa","zrozumiteľné a vyvážené povinnosti strán","ustanovenia odporujúce predpisom na ochranu spotrebiteľa"],"s":"Sprostredkovanie a rezervácia","a":"AC"},{"n":72,"q":"Ustanovenia spotrebiteľskej zmluvy odporujúce predpisom na ochranu spotrebiteľa:","o":["stávajú sa neplatnými po uplynutí troch rokov od podpisu spotrebiteľskej zmluvy","súd na ich neplatnosť prihliada z úradnej povinnosti","sú neplatné"],"s":"Sprostredkovanie a rezervácia","a":"BC"},{"n":73,"q":"Pri spotrebiteľskej zmluve:","o":["je určená minimálna veľkosť písma 1,9 mm","nedodržanie minimálnej veľkosti písma spôsobuje neplatnosť celej zmluvy","postačuje ľubovoľná veľkosť písma, ak s ňou spotrebiteľ súhlasí a podpíše ju"],"s":"Sprostredkovanie a rezervácia","a":"AB"},{"n":74,"q":"Ak realitná kancelária uzavrie so spotrebiteľom zmluvu mimo svojich prevádzkových priestorov:","o":["vzťah spadá pod režim ochrany spotrebiteľa","je spotrebiteľ chránený viac, než keby ju podpísali v priestoroch realitnej kancelárie","zmluvu musí bezodkladne odovzdať v listinnej podobe alebo na trvanlivom médiu"],"s":"Sprostredkovanie a rezervácia","a":"ABC"},{"n":75,"q":"Rezervačnú zmluvu možno uzavrieť:","o":["aj pri sprostredkovaní nájmu","iba v prípade, ak nie sú jasné podmienky kúpnej zmluvy","pred podpisom kúpnej zmluvy"],"s":"Sprostredkovanie a rezervácia","a":"AC"},{"n":76,"q":"Strany sa dohodli na podstatných podmienkach prevodu, ale chýba zostatok úveru a vyjadrenie správcu. Vhodným predbežným krokom je:","o":["uzavretie nájomnej zmluvy, kým sa nezíska vyčíslenie zostatku úveru a vyjadrenie správcu","uzavretie kúpnej zmluvy","uzavretie rezervačnej zmluvy"],"s":"Sprostredkovanie a rezervácia","a":"C"},{"n":77,"q":"Ak čas odovzdania nehnuteľnosti nie je v kúpnej zmluve dohodnutý, predávajúci ju má odovzdať:","o":["bez zbytočného odkladu","po uplynutí jedného roka od povolenia vkladu","na osobitnú písomnú výzvu"],"s":"Prevodové zmluvy a spoločnosti","a":"A"},{"n":78,"q":"Predávajúci môže odoprieť odovzdanie nehnuteľnosti, ak:","o":["kupujúci zaplatil kúpnu cenu riadne a včas","kúpna cena nebola zložená do notárskej úschovy","kupujúci nezaplatil kúpnu cenu riadne a včas"],"s":"Prevodové zmluvy a spoločnosti","a":"C"},{"n":79,"q":"Pri zaplatení celej kúpnej ceny na účet predávajúceho pri podpise kúpnej zmluvy:","o":["kupujúci zaplatí ešte pred nadobudnutím vlastníctva k nehnuteľnosti","predávajúci nesie väčšie riziko ako kupujúci","kupujúci nesie väčšie riziko ako predávajúci"],"s":"Prevodové zmluvy a spoločnosti","a":"AC"},{"n":80,"q":"Pri delenej platbe kúpnej ceny:","o":["musí byť každá časť kúpnej ceny uhradená až po povolení vkladu","sa časti kúpnej ceny uhrádzajú v rôznych fázach transakcie podľa dohodnutých podmienok","prvá časť kúpnej ceny musí byť vždy uhradená priamo predávajúcemu pri podpise zmluvy"],"s":"Prevodové zmluvy a spoločnosti","a":"B"},{"n":81,"q":"Platba kúpnej ceny až po prevode vlastníckeho práva:","o":["predstavuje pre kupujúceho riziko","je výhodná pre kupujúceho","predstavuje pre predávajúceho riziko čakania a nezaplatenia"],"s":"Prevodové zmluvy a spoločnosti","a":"BC"},{"n":82,"q":"Príslušenstvom bytu sú:","o":["výťah","vedľajšie miestnosti a priestory určené na užívanie s bytom","strecha domu"],"s":"Prevodové zmluvy a spoločnosti","a":"B"},{"n":83,"q":"Medzi spoločné časti domu patria:","o":["strecha","základy domu","výťah"],"s":"Prevodové zmluvy a spoločnosti","a":"AB"},{"n":84,"q":"Medzi spoločné zariadenia domu patria:","o":["komín","priečelie domu","výťah"],"s":"Prevodové zmluvy a spoločnosti","a":"AC"},{"n":85,"q":"Príslušenstvom domu môžu byť:","o":["altány","prístrešky","kôlne"],"s":"Prevodové zmluvy a spoločnosti","a":"ABC"},{"n":86,"q":"Pre spoločné zariadenie domu platí, že:","o":["môže byť umiestnené aj mimo domu, ak slúži výlučne tomuto domu","zahŕňa prístrešky, kôlne a altány","musí byť vždy stavebnou súčasťou domu"],"s":"Prevodové zmluvy a spoločnosti","a":"A"},{"n":87,"q":"Darovacia zmluva na nehnuteľnosť:","o":["musí mať písomnú formu","musí presne určovať darovanú nehnuteľnosť","je platná aj vtedy, ak sa má plniť až po darcovej smrti"],"s":"Prevodové zmluvy a spoločnosti","a":"AB"},{"n":88,"q":"Darca sa môže domáhať vrátenia daru, ak obdarovaný:","o":["nehnuteľnosť po nadobudnutí vlastníctva stavebne upraví","sa rozhodne dar ďalej predať a to pod obvyklú cenu","správa k nemu alebo členom jeho rodiny tak, že hrubo porušuje dobré mravy"],"s":"Prevodové zmluvy a spoločnosti","a":"C"},{"n":89,"q":"Obdarovaný je oprávnený dar vrátiť, ak:","o":["je darom nehnuteľnosť","má nehnuteľnosť vady, na ktoré ho darca neupozornil","darca neuhradí náklady spojené s prevodom vlastníctva nehnuteľnosti"],"s":"Prevodové zmluvy a spoločnosti","a":"B"},{"n":90,"q":"Pri prevode členského podielu v bytovom družstve:","o":["sa nevyžaduje súhlas orgánov družstva","sa vyžaduje vklad vlastníckeho práva do katastra","môžu stanovy určiť podrobnosti alebo poplatky"],"s":"Prevodové zmluvy a spoločnosti","a":"AC"},{"n":91,"q":"Členské práva a povinnosti prechádzajú na nadobúdateľa vo vzťahu k družstvu:","o":["povolením vkladu vlastníctva do katastra nehnuteľností","doručením návrhu na vklad do katastra nehnuteľností","doručením rozhodnutia katastra o povolení vkladu členského podielu na nadobúdateľa"],"s":"Prevodové zmluvy a spoločnosti","a":""},{"n":92,"q":"Nehnuteľnosť patriaca obchodnej spoločnosti sa môže previesť:","o":["spolu s obchodnou spoločnosťou predajom podielu alebo akcií","iba po zrušení spoločnosti s likvidáciou","samostatným prevodom nehnuteľnosti z majetku spoločnosti"],"s":"Prevodové zmluvy a spoločnosti","a":"AC"},{"n":93,"q":"SPV je:","o":["právnická osoba účelovo založená na realizáciu konkrétneho projektu alebo držbu konkrétneho majetku","osobitný typ obchodnej spoločnosti upravený priamo Obchodným zákonníkom","organizačná zložka investora bez samostatnej právnej subjektivity"],"s":"Prevodové zmluvy a spoločnosti","a":"A"},{"n":94,"q":"Zmluva o prevode obchodného podielu v spoločnosti s ručením obmedzeným:","o":["má voči spoločnosti účinky dňom doručenia zmluvy","vyžaduje úradne osvedčené podpisy zmluvných strán","musí mať písomnú formu"],"s":"Prevodové zmluvy a spoločnosti","a":"ABC"},{"n":95,"q":"Zápis nového spoločníka do obchodného registra pri prevode obchodného podielu:","o":["zakladá účinky prevodu obchodného podielu","deklaruje zmenu, ktorej účinky voči spoločnosti nastali už skôr podľa zákona","nahrádza doručenie zmluvy o prevode obchodného podielu spoločnosti"],"s":"Prevodové zmluvy a spoločnosti","a":"B"},{"n":96,"q":"Pri kúpe nehnuteľnosti od obchodnej spoločnosti je dôležité:","o":["overiť odborný profil štatutárnych zástupcov obchodnej spoločnosti","pracovať s aktuálnym výpisom z obchodného registra","preveriť v obchodnom registri spôsob konania štatutárneho orgánu"],"s":"Prevodové zmluvy a spoločnosti","a":"BC"},{"n":97,"q":"Plnomocenstvo (plná moc), ktoré obchodná spoločnosť udeľuje zástupcovi na predaj nehnuteľnosti, má byť:","o":["z dôvodu právnej istoty konkretizované na nehnuteľnosť a cenu, za ktorú ju možno scudziť","písomné","podpísané štatutárnym orgánom (osobami oprávnenými konať za spoločnosť)"],"s":"Prevodové zmluvy a spoločnosti","a":"ABC"},{"n":98,"q":"Prokúra:","o":["je účinná až zápisom do obchodného registra","automaticky zahŕňa oprávnenie scudzovať a zaťažovať nehnuteľnosti","môže byť udelená iba fyzickej osobe"],"s":"Prevodové zmluvy a spoločnosti","a":"AC"},{"n":99,"q":"Prokurista môže scudzovať nehnuteľnosti spoločnosti:","o":["len ak je oprávnenie na scudzovanie nehnuteľností výslovne zahrnuté v udelenej prokúre","vždy, ak scudzenie nehnuteľnosti súvisí s prevádzkou podniku","iba so súhlasom valného zhromaždenia, bez ohľadu na rozsah udelenej prokúry"],"s":"Prevodové zmluvy a spoločnosti","a":"A"},{"n":100,"q":"Pri samostatnom predaji nehnuteľnosti z majetku obchodnej spoločnosti:","o":["kupujúci nadobúda nehnuteľnosť, nie obchodný podiel ani postavenie spoločníka v spoločnosti","kupujúci spolu s nehnuteľnosťou automaticky preberá všetky záväzky spoločnosti","môže mať dopad na daňové povinnosti vrátane dane z pridanej hodnoty"],"s":"Prevodové zmluvy a spoločnosti","a":"AC"},{"n":101,"q":"Právna úprava nájmu nehnuteľnosti:","o":["je obsiahnutá výlučne v Obchodnom zákonníku","vychádza najmä z Občianskeho zákonníka a pri niektorých druhoch nájmu aj z osobitných predpisov","závisí výlučne od toho, či je nájomca podnikateľ"],"s":"Nájomné vzťahy","a":"B"},{"n":102,"q":"Zmluva o nájme bytu podľa Občianskeho zákonníka:","o":["má obsahovať označenie predmetu a rozsahu užívania bytu","má obsahovať výšku nájomného a úhrad alebo spôsob ich výpočtu","má byť písomná alebo sa o jej obsahu vyhotoví zápisnica"],"s":"Nájomné vzťahy","a":"ABC"},{"n":103,"q":"Základným právom nájomcu bytu je:","o":["riadne užívať byt a využívať služby a spoločné časti domu v rozsahu spojenom s nájmom","prenechať byt tretej osobe bez ohľadu na podmienky nájomnej zmluvy","meniť byt a jeho vybavenie podľa vlastného uváženia bez súhlasu prenajímateľa"],"s":"Nájomné vzťahy","a":"A"},{"n":104,"q":"Nájomca bytu spravidla uhrádza:","o":["náklady spojené s bežnou údržbou, ak zmluva neurčuje inak","drobné opravy súvisiace s užívaním bytu","všetky zásadné stavebné opravy bytu"],"s":"Nájomné vzťahy","a":"AB"},{"n":105,"q":"Prenajímateľ bytu je povinný:","o":["odovzdať byt v stave spôsobilom na riadne užívanie","znášať aj drobné opravy, ak sa tak dohodli v nájomnej zmluve","zabezpečiť plný a nerušený výkon práv nájomcu spojených s užívaním bytu"],"s":"Nájomné vzťahy","a":"ABC"},{"n":106,"q":"Nájom bytu môže zaniknúť:","o":["písomnou výpoveďou","písomnou dohodou","uplynutím dohodnutej doby pri nájme na určitý čas"],"s":"Nájomné vzťahy","a":"ABC"},{"n":107,"q":"Výpovedná lehota pri nájme bytu podľa Občianskeho zákonníka:","o":["je tri mesiace","začína plynúť prvým dňom mesiaca nasledujúceho po doručení výpovede","môže byť v nájomnej zmluve dohodnutá aj kratšia ako tri mesiace"],"s":"Nájomné vzťahy","a":"AB"},{"n":108,"q":"Výhody právneho režimu krátkodobého nájmu bytu môže prenajímateľ v plnom rozsahu využívať, ak:","o":["registračnú povinnosť splní až pri skončení nájmu","si riadne splnil zákonom ustanovenú registračnú povinnosť","registračnú povinnosť nemusí splniť, ak je nájomná zmluva uzavretá vo forme notárskej zápisnice"],"s":"Nájomné vzťahy","a":"B"},{"n":109,"q":"Pri krátkodobom nájme bytu môžu zmluvné strany:","o":["dohodnúť aj ďalšie výpovedné dôvody, pre ktoré nemožno spravodlivo požadovať ďalšie trvanie nájmu","ľubovoľne skrátiť výpovednú lehotu bez ohľadu na zákonom stanovené minimá","vylúčiť všetky zákonné výpovedné dôvody a ponechať iba dôvody uvedené v zmluve"],"s":"Nájomné vzťahy","a":"A"},{"n":110,"q":"Peňažná zábezpeka pri krátkodobom nájme môže zabezpečovať:","o":["nezaplatené nájomné","iné pohľadávky prenajímateľa súvisiace s užívaním bytu","škodu na byte alebo jeho zariadení"],"s":"Nájomné vzťahy","a":"ABC"},{"n":111,"q":"Zmluva o nájme nebytového priestoru musí obsahovať:","o":["predmet a účel nájmu","výšku a splatnosť nájomného a spôsob jeho platenia","pri nájme na určitý čas aj dobu nájmu"],"s":"Nájomné vzťahy","a":"ABC"},{"n":112,"q":"Účel nájmu nebytového priestoru:","o":["môže byť odlišný od stavebného určenia, ak je uvedený v písomnej nájomnej zmluve","určuje výlučne dohoda prenajímateľa a nájomcu","musí zodpovedať stavebnému určeniu nebytového priestoru"],"s":"Nájomné vzťahy","a":"C"},{"n":113,"q":"Ak nájomca nebytového priestoru prenajatého na dobu určitú stratí spôsobilosť prevádzkovať činnosť, na ktorú si priestor prenajal:","o":["nájom zaniká automaticky dňom straty spôsobilosti","môže nájomca nájom predčasne písomne vypovedať","nájomca môže nájom ukončiť iba dohodou s prenajímateľom"],"s":"Nájomné vzťahy","a":"B"},{"n":114,"q":"Prenajímateľ môže predčasne vypovedať nájom nebytového priestoru na dobu určitú, ak nájomca:","o":["užíva priestor v súlade so zmluvou a riadne platí","prenechá priestor do podnájmu bez súhlasu prenajímateľa","mešká s nájomným alebo úhradou za služby o viac ako jeden mesiac"],"s":"Nájomné vzťahy","a":"BC"},{"n":115,"q":"Vecné bremeno in personam:","o":["môže mať podobu práva doživotného užívania miestnosti","je vždy zriadené v prospech vlastníka inej nehnuteľnosti","je zriadené v prospech určitej osoby"],"s":"Vecné práva k cudzej veci","a":"AC"},{"n":116,"q":"Vecné bremeno in rem:","o":["zaniká pri každej zmene vlastníka oprávnenej nehnuteľnosti","je zriadené v prospech vlastníka inej nehnuteľnosti","môže mať podobu práva prechodu"],"s":"Vecné práva k cudzej veci","a":"BC"},{"n":117,"q":"Povinnosť z vecného bremena:","o":["prechádza na každého nového vlastníka zaťaženej nehnuteľnosti","je viazaná na určitú nehnuteľnosť","nový vlastník musí so zriadením vecného bremena súhlasiť"],"s":"Vecné práva k cudzej veci","a":"AB"},{"n":118,"q":"Zákonné vecné bremeno je typické najmä tým, že:","o":["vzniká na základe zákona na zabezpečenie zákonom chráneného alebo verejného záujmu","vzniká vždy až zápisom do katastra na základe zmluvy vlastníkov","môže vzniknúť iba v prospech konkrétnej fyzickej osoby"],"s":"Vecné práva k cudzej veci","a":"A"},{"n":119,"q":"Na vydržanie práva zodpovedajúceho vecnému bremenu je potrebné:","o":["dobromyseľnosť oprávneného","desať rokov nepretržitého výkonu práva","uzavretie zmluvy a vklad do katastra nehnuteľností"],"s":"Vecné práva k cudzej veci","a":"AB"},{"n":120,"q":"Vecné bremeno zanikne zo zákona pre zmenu pomerov vtedy, ak:","o":["povinný z vecného bremena prevedie vlastnícke právo k nehnuteľnosti na inú osobu","ide o trvalú zmenu a vec už nemôže slúžiť potrebám oprávneného","ide o dočasnú nemožnosť výkonu vecného bremena"],"s":"Vecné práva k cudzej veci","a":"B"},{"n":121,"q":"Pri posudzovaní zmeny pomerov ako dôvodu na zrušenie vecného bremena:","o":["postačuje samotná zmena vlastníka zaťaženej nehnuteľnosti","vecné bremeno zaniká automaticky, ak nehnuteľnosť nadobudol nový vlastník v dražbe","musí ísť o takú zmenu okolností, ktorá podstatne mení pomer medzi vecným bremenom a výhodou oprávneného"],"s":"Vecné práva k cudzej veci","a":"C"},{"n":122,"q":"Pri súdnom obmedzení alebo zrušení vecného bremena z dôvodu hrubého nepomeru:","o":["vecné bremeno zaniká bez náhrady už samotným vznikom hrubého nepomeru","súd môže rozhodnúť iba o zmene spôsobu výkonu vecného bremena, nie o jeho zrušení","súd môže vecné bremeno obmedziť alebo zrušiť za primeranú náhradu"],"s":"Vecné práva k cudzej veci","a":"C"},{"n":123,"q":"Rozhodnutie súdu o zrušení vecného bremena:","o":["sa v katastri vyznačí záznamom","spôsobuje zánik dňom právoplatnosti súdneho rozhodnutia","má konštitutívne účinky"],"s":"Vecné práva k cudzej veci","a":"ABC"},{"n":124,"q":"Pri zániku vecného bremena zmluvou medzi oprávneným a povinným:","o":["postačuje iba záznam bez rozhodnutia o vklade","vecné bremeno zaniká dňom právoplatnosti rozhodnutia o povolení vkladu","je potrebný vklad do katastra nehnuteľností"],"s":"Vecné práva k cudzej veci","a":"BC"},{"n":125,"q":"Zmluvné predkupné právo:","o":["môže mať záväzkovoprávny alebo vecnoprávny charakter","pri vecnoprávnom charaktere musí byť zapísané v katastri","vecnoprávne predkupné právo vzniká aj bez zápisu do katastra nehnuteľností"],"s":"Vecné práva k cudzej veci","a":"AB"},{"n":126,"q":"Akcesorický charakter záložného práva znamená, že:","o":["so zánikom hlavného záväzku zásadne zaniká aj záložné právo","existuje vždy úplne nezávisle od zabezpečenej pohľadávky","je späté s hlavným záväzkom"],"s":"Vecné práva k cudzej veci","a":"AC"},{"n":127,"q":"Záložná zmluva musí určiť:","o":["najvyššiu hodnotu istiny, do ktorej sa pohľadávka zabezpečuje, ak zmluva neurčuje hodnotu zabezpečenej pohľadávky","predmet zálohu","zabezpečenú pohľadávku"],"s":"Vecné práva k cudzej veci","a":"ABC"},{"n":128,"q":"Záložným právom možno zabezpečiť:","o":["pohľadávku, ktorá vznikne v budúcnosti","nepeňažnú pohľadávku, ak je jej hodnota určitá alebo určiteľná","peňažnú pohľadávku"],"s":"Vecné práva k cudzej veci","a":"ABC"},{"n":129,"q":"Záložné právo k nehnuteľnosti vzniká:","o":["doručením rozhodnutia katastra o zápise záložného práva","zápisom do katastra nehnuteľností","uzavretím záložnej zmluvy"],"s":"Vecné práva k cudzej veci","a":"B"},{"n":130,"q":"Poradie záložných práv k nehnuteľnosti sa určuje:","o":["podľa abecedného poradia záložných veriteľov","podľa výšky zabezpečeného dlhu","podľa poradia ich vzniku alebo doručenia návrhov na zápis"],"s":"Vecné práva k cudzej veci","a":"C"},{"n":131,"q":"Záložnú zmluvu k nehnuteľnosti môže za vlastníka nehnuteľnosti podpísať:","o":["vlastník alebo jeho riadne splnomocnený zástupca, ak sú splnené požiadavky na zastúpenie","iba vlastník osobne, zastúpenie je zo zákona vylúčené","ktorákoľvek osoba poverená dlžníkom, aj bez splnomocnenia vlastníka"],"s":"Vecné práva k cudzej veci","a":"A"},{"n":132,"q":"Exekučné záložné právo na nehnuteľnosť:","o":["sa zriaďuje výlučne na návrh oprávneného v exekučnom konaní","vzniká zápisom do katastra nehnuteľností","posilňuje poradie budúceho uspokojenia veriteľa"],"s":"Vecné práva k cudzej veci","a":"ABC"},{"n":133,"q":"Výkon záložného práva možno začať:","o":["ak zabezpečená pohľadávka ešte nebola splatná","aj pri premlčanej zabezpečenej pohľadávke","len predchádzajúcim súhlasom súdu"],"s":"Vecné práva k cudzej veci","a":"B"},{"n":134,"q":"Po oznámení začatia výkonu záložného práva:","o":["záložca nesmie bez súhlasu záložného veriteľa záloh previesť","záložca môže so zálohom voľne nakladať","záložca sám určuje spôsob výkonu záložného práva"],"s":"Vecné práva k cudzej veci","a":"A"},{"n":135,"q":"Pri priamom predaji zálohu je záložný veriteľ povinný:","o":["konať na základe zákonného splnomocnenia v mene záložcu","postupovať s náležitou starostlivosťou","predať záloh za obvyklú cenu"],"s":"Vecné práva k cudzej veci","a":"ABC"},{"n":136,"q":"Dohoda uzavretá pred splatnosťou zabezpečenej pohľadávky, podľa ktorej záložný veriteľ pri nesplnení dlhu nadobudne vlastníctvo zálohu:","o":["je platná, ak bola súčasťou písomnej záložnej zmluvy","je platná, ak hodnota zálohu neprevyšuje výšku zabezpečenej pohľadávky","je neplatná"],"s":"Vecné práva k cudzej veci","a":"C"},{"n":137,"q":"Po predaji zálohu je záložný veriteľ povinný:","o":["oznámiť záložcovi iba výslednú sumu, ktorou bola pohľadávka uspokojená","bez zbytočného odkladu podať záložcovi písomnú správu o výkone záložného práva s údajmi najmä o predaji, výťažku, nákladoch a použití výťažku","vyúčtovanie predaja predložiť len vtedy, ak ho záložca písomne vyžiada"],"s":"Vecné práva k cudzej veci","a":"B"},{"n":138,"q":"Predaj zálohu súdnym exekútorom:","o":["sa vždy uskutočňuje ako dobrovoľná dražba podľa zákona o dobrovoľných dražbách","sa vykonáva v exekučnom konaní podľa Exekučného poriadku na základe exekučného titulu","sa ustanovenia Exekučného poriadku o predaji nehnuteľnosti nepoužijú"],"s":"Vecné práva k cudzej veci","a":"B"},{"n":139,"q":"Ktorý z nasledujúcich dokumentov môže byť exekučným titulom:","o":["vykonateľné rozhodnutie súdu ukladajúce povinnosť","predžalobná výzva veriteľa","neuhradená faktúra"],"s":"Vecné práva k cudzej veci","a":"A"},{"n":140,"q":"Ak je predmetom dobrovoľnej dražby byt, dom alebo iná nehnuteľnosť, oznámenie o dražbe sa v registri dražieb uverejní najmenej:","o":["30 dní pred začatím dražby","15 dní pred začatím dražby","60 dní pred začatím dražby"],"s":"Dražby, vady a pôda","a":"A"},{"n":141,"q":"Účastníkom dobrovoľnej dražby môže byť:","o":["osoba, ktorá spĺňa zákonné podmienky účasti na dražbe a je spôsobilá na právne úkony","iba osoba, ktorá je vlastníkom alebo záložným veriteľom predmetu dražby","iba fyzická osoba s trvalým pobytom na území Slovenskej republiky"],"s":"Dražby, vady a pôda","a":"A"},{"n":142,"q":"Ak po najvyššom podaní nenasleduje ďalšie vyššie podanie, licitátor:","o":["po tretej výzve vykoná príklep","dvakrát vyzve na ďalšie podanie","ukončí dražbu bez ďalšej výzvy"],"s":"Dražby, vady a pôda","a":"AB"},{"n":143,"q":"Ak vydražiteľ neuhradí cenu dosiahnutú vydražením v stanovenej lehote, dražobná zábezpeka:","o":["prepadá v celom rozsahu dražobníkovi bez ohľadu na výšku nákladov","sa vydražiteľovi vráti, pretože k nadobudnutiu vlastníctva nedošlo","sa použije na úhradu nákladov zmarenej dražby a prípadne aj opakovanej dražby"],"s":"Dražby, vady a pôda","a":"C"},{"n":144,"q":"Za zjavnú vadu nehnuteľnosti sa spravidla považuje vada, ktorá:","o":["je pri primeranej obhliadke rozpoznateľná bez potreby osobitného odborného skúmania","bola predávajúcemu známa, hoci ju kupujúci pri obhliadke nemohol zistiť","sa prejaví až po odovzdaní nehnuteľnosti bez ohľadu na jej zistiteľnosť pri obhliadke"],"s":"Dražby, vady a pôda","a":"A"},{"n":145,"q":"Predávajúci splní informačnú povinnosť o známej vade, ak:","o":["všeobecne uvedie, že nehnuteľnosť môže mať vady zodpovedajúce jej veku","kupujúceho upozorní na konkrétnu známu vadu nehnuteľnosti","oznámi, že nehnuteľnosť bola v minulosti opravovaná, bez uvedenia konkrétnej vady"],"s":"Dražby, vady a pôda","a":"B"},{"n":146,"q":"Ak sa po uzavretí kúpnej zmluvy dodatočne prejaví vada, ktorá existovala už v čase uzavretia zmluvy:","o":["predávajúci za ňu zodpovedá len vtedy, ak o nej pri predaji vedel","predávajúci za ňu nezodpovedá, ak ju pri bežnej obhliadke nemohol zistiť","predávajúci za ňu môže zodpovedať bez ohľadu na to, či o nej vedel, ak na ňu kupujúceho neupozornil"],"s":"Dražby, vady a pôda","a":"C"},{"n":147,"q":"Vada vznikla až po uzavretí kúpnej zmluvy a v čase prevzatia neexistovala. V režime dodatočne zistených vád:","o":["predávajúci za ňu nezodpovedá","kupujúci má právo na zľavu","považuje sa za vadu existujúcu pri uzavretí zmluvy"],"s":"Dražby, vady a pôda","a":"A"},{"n":148,"q":"Kupujúci musí vadu nehnuteľnosti u predávajúceho uplatniť:","o":["bez zbytočného odkladu po jej zistení","až pri uplatnení nároku na súde, ak ide o skrytú vadu","najneskôr do 24 mesiacov od prevzatia nehnuteľnosti"],"s":"Dražby, vady a pôda","a":"AC"},{"n":149,"q":"Ak predávajúci neuspokojí nárok kupujúceho zo zodpovednosti za vady, kupujúci ho môže uplatniť na súde v premlčacej lehote:","o":["dvoch rokov od prevzatia nehnuteľnosti","troch rokov od zistenia vady","troch rokov odo dňa, keď vadu vytkol predávajúcemu"],"s":"Dražby, vady a pôda","a":"C"},{"n":150,"q":"Poľnohospodárskou pôdou sú aj:","o":["trvalé trávne porasty","zastavané plochy","ovocné sady"],"s":"Dražby, vady a pôda","a":"AC"},{"n":151,"q":"Pri odňatí poľnohospodárskej pôdy na stavbu sa spravidla:","o":["mení druh pozemku na celej parcele bez ohľadu na rozsah stavby","z odňatej plochy vytvára nová parcela určená geometrickým plánom","vyníma iba tá časť parcely, ktorá je na uskutočnenie stavby nevyhnutná"],"s":"Dražby, vady a pôda","a":"BC"},{"n":152,"q":"Sadzba odvodu za odňatie poľnohospodárskej pôdy:","o":["sa zvyšuje, ak je na pôde funkčné závlahové zariadenie","sa znižuje, ak pôda priamo nadväzuje na zastavanú plochu v obci","je vždy rovnaká bez ohľadu na vlastnosti pôdy a funkčné využitie"],"s":"Dražby, vady a pôda","a":"AB"},{"n":153,"q":"Odvod za trvalé odňatie poľnohospodárskej pôdy:","o":["sa platí jednorazovo","sa platí mesačne po celú dobu trvania vyňatia poľnohospodárskej pôdy","je splatný do 30 dní od právoplatnosti rozhodnutia o trvalom odňatí"],"s":"Dražby, vady a pôda","a":"AC"},{"n":154,"q":"Nariadenie GDPR sa vzťahuje:","o":["na spracúvanie osobných údajov fyzickou osobou výlučne na osobné účely","na automatizované spracúvanie osobných údajov a za určitých podmienok aj ich neautomatizované spracúvanie","iba na spracúvanie osobných údajov prostredníctvom elektronických databáz"],"s":"GDPR","a":"B"},{"n":155,"q":"Prevádzkovateľ osobných údajov je subjekt, ktorý:","o":["určuje účely a prostriedky spracúvania osobných údajov","spracúva osobné údaje výlučne podľa pokynov iného prevádzkovateľa","len technicky uchováva údaje bez možnosti rozhodovať o účele ich spracúvania"],"s":"GDPR","a":"A"},{"n":156,"q":"Sprostredkovateľ osobných údajov:","o":["spracúva osobné údaje v mene prevádzkovateľa","môže byť fyzická alebo právnická osoba","sám nezávisle určuje všetky účely spracúvania"],"s":"GDPR","a":"AB"},{"n":157,"q":"Porušením ochrany osobných údajov môže byť:","o":["náhodné zničenie alebo strata údajov","oprava nesprávneho údaju na žiadosť dotknutej osoby","neoprávnené poskytnutie alebo prístup k údajom"],"s":"GDPR","a":"AC"},{"n":158,"q":"Zásada minimalizácie údajov vyžaduje, aby osobné údaje boli:","o":["zhromažďované aj nad rámec aktuálnej potreby pre prípad ich budúceho využitia","primerané, relevantné a obmedzené na rozsah nevyhnutný vzhľadom na účel spracúvania","spracúvané aj v širšom rozsahu, ak s tým dotknutá osoba súhlasila"],"s":"GDPR","a":"B"},{"n":159,"q":"Zásada správnosti vyžaduje, aby osobné údaje boli:","o":["ponechané bez zmeny počas celej doby spracúvania, aby sa zachovala ich pôvodnosť","správne a podľa potreby aktualizované, pričom nesprávne údaje sa majú bezodkladne opraviť alebo vymazať","aktualizované iba na žiadosť dotknutej osoby"],"s":"GDPR","a":"B"},{"n":160,"q":"Osobné údaje možno uchovávať dlhšie, než je nevyhnutné na pôvodný účel, ak sa ďalej spracúvajú výlučne:","o":["na akýkoľvek nový účel, ak boli pôvodne získané zákonným spôsobom","na budúce obchodné využitie, ak prevádzkovateľ nevie vopred určiť dobu ich potreby","na účely archivácie vo verejnom záujme, vedeckého alebo historického výskumu alebo na štatistické účely pri splnení zákonných podmienok"],"s":"GDPR","a":"C"},{"n":161,"q":"Realitná kancelária chce poskytnúť údaje klienta banke, no tento úkon nie je nevyhnutný na plnenie zmluvy a zmluva ho nepokrýva. Potrebuje:","o":["automaticky právny základ verejného záujmu","iný právny základ spracúvania, napríklad súhlas","nepotrebuje právny základ, lebo to určuje osobitný predpis (zákon o bankách)"],"s":"GDPR","a":"B"},{"n":162,"q":"Platný súhlas dotknutej osoby (v rámci ochrany osobných údajov) musí byť:","o":["informovaný a jednoznačný","poskytnutý slobodne","konkrétny"],"s":"GDPR","a":"ABC"},{"n":163,"q":"Súhlas do
